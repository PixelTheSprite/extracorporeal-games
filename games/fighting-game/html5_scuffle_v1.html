<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

    background: #0a0a0f;

  #title-screen .sub { font-size: 0.5rem; color: #888; letter-spacing: 3px; margin-bottom: 1.2rem; }
  .section-label { font-size: 0.4rem; color: #ff6b00; letter-spacing: 2px; margin-bottom: 0.5rem; text-align: center; }

    width: 120px; height: 68px; background: #1a1a2e;

  }
  .stage-card:hover, .stage-card.selected { border-color: #ff6b00; box-shadow: 0 0 12px #ff6b0060; }
  .stage-card canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
  .stage-card .sname { font-size: 0.3rem; color: #ddd; background: #000a; padding: 3px 6px; width: 100%; text-align: center; position: relative; z-index: 1; line-height: 1.5; }
  .stage-card.selected .sname { color: #ff6b00; }

  #start-btn {
    background: #ff6b00; border: none; color: #000;
    font-family: 'Press Start 2P', monospace; font-size: 0.6rem;
    padding: 12px 28px; cursor: pointer; border-radius: 4px;

  }

  #controls-hint { font-size: 0.32rem; color: #555; margin-top: 1rem; line-height: 2.2; text-align: center; }

  #game-wrap { display: none; flex-direction: column; align-items: center; width: 100vw; height: 100vh; }
  #hud { display: flex; justify-content: space-between; align-items: center; width: 860px; max-width: 98vw; padding: 8px 12px 4px; }
  .player-hud { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .player-hud .p-name { font-size: 0.42rem; }
  .p1-name { color: #4fc3f7; } .p2-name { color: #ef5350; }
  .stock-bar { display: flex; gap: 4px; }
  .stock-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #555; }
  .p1 .stock-dot { background: #4fc3f7; } .p2 .stock-dot { background: #ef5350; }
  .damage-pct { font-size: 1.1rem; font-weight: 700; min-width: 70px; text-align: center; }
  .p1-pct { color: #4fc3f7; } .p2-pct { color: #ef5350; }
  .timer-box { font-size: 0.9rem; color: #fff; text-align: center; }
  .timer-box .t-label { font-size: 0.35rem; color: #777; margin-bottom: 2px; }
  #canvas-container { position: relative; }
  #game-canvas { image-rendering: pixelated; display: block; border: 2px solid #1a1a2e; }
  #ko-overlay {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
    font-size: 2.5rem; color: #ff6b00;
    text-shadow: 0 0 20px #ff6b00, 2px 2px 0 #000;
    pointer-events: none; opacity: 0; transition: opacity 0.2s;
  }
  #result-screen {
    position: fixed; inset: 0; background: #000000cc;
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
  }
  #result-screen h2 { font-size: 1.6rem; color: #ff6b00; text-shadow: 0 0 20px #ff6b00; margin-bottom: 1rem; }
  #result-screen .winner-name { font-size: 0.8rem; color: #fff; margin-bottom: 2rem; }
  .result-btn {
    background: transparent; border: 2px solid #ff6b00; color: #ff6b00;
    font-family: 'Press Start 2P', monospace; font-size: 0.55rem;
    padding: 10px 20px; cursor: pointer; letter-spacing: 1px;
    transition: all 0.15s; margin: 4px;
  }
  .result-btn:hover { background: #ff6b00; color: #000; }

<script>

 // ===== ACHIEVEMENT SETUP =====
        AchievementSystem.init('fighting-game');
        
        AchievementSystem.register('fighting-game', [
            { 
                id: 'first-fight', 
                name: 'First Punch', 
                description: 'Win your first fight', 
                icon: '👊', 
                points: 10, 
                rarity: 'common' 
            },
            { 
                id: 'combo-master', 
                name: 'Combo Master', 
                description: 'Land a 10-hit combo', 
                icon: '⚔️', 
                points: 30, 
                rarity: 'uncommon' 
            },
            { 
                id: 'all-characters', 
                name: 'Master All', 
                description: 'Win with every character', 
                icon: '👥', 
                points: 50, 
                rarity: 'legendary' 
            },
            { 
                id: 'stage-dominator', 
                name: 'Stage Dominator', 
                description: 'Win on all stages', 
                icon: '🌍', 
                points: 45, 
                rarity: 'rare' 
            },
            { 
                id: 'perfect-victory', 
                name: 'Flawless', 
                description: 'Win without taking damage', 
                icon: '✨', 
                points: 60, 
                rarity: 'legendary' 
            }
        ]);

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const W = 860, H = 520;

// ==============================
// UTILITY
// ==============================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ==============================
// CHARACTER DEFINITIONS
// Original cast. Each slot keeps the move stats of the fighter it replaced.
// ==============================
const CHARS = [
  {
    id:'rivet', name:'RIVET',
    bio: 'Boxy construction robot with a wrench claw',
    color:'#ffb300', darkColor:'#e65100',
    drawFn: drawRivet,
    attacks:{ normal:{w:52,h:30,dmg:9,kb:7}, special:{w:70,h:22,dmg:15,kb:13} }
  },
  {
    id:'thistle', name:'THISTLE',
    bio: 'Hedge witch who swings a long broom',
    color:'#7e57c2', darkColor:'#4527a0',
    drawFn: drawThistle,
    attacks:{ normal:{w:68,h:26,dmg:8,kb:8}, special:{w:90,h:18,dmg:14,kb:14} }
  },
  {
    id:'spud', name:'SPUD',
    bio: 'Potato prizefighter in boxing gloves',
    color:'#c8a165', darkColor:'#8d6e3f',
    drawFn: drawSpud,
    attacks:{ normal:{w:55,h:35,dmg:7,kb:9}, special:{w:85,h:20,dmg:16,kb:18} }
  },
  {
    id:'nova', name:'NOVA',
    bio: 'Kid astronaut with a bubble helmet and ray gun',
    color:'#26a69a', darkColor:'#00695c',
    drawFn: drawNova,
    attacks:{ normal:{w:70,h:30,dmg:12,kb:6}, special:{w:110,h:16,dmg:20,kb:10} }
  },
  {
    id:'hoot', name:'HOOT',
    bio: 'Night owl brawler in a fighting sash',
    color:'#5c6bc0', darkColor:'#283593',
    drawFn: drawHoot,
    attacks:{ normal:{w:58,h:28,dmg:10,kb:9}, special:{w:120,h:14,dmg:18,kb:12} }
  },
  {
    id:'gloop', name:'GLOOP',
    bio: 'One-eyed slime cube that has swallowed a coin',
    color:'#4dd0e1', darkColor:'#00838f',
    drawFn: drawGloop,
    attacks:{ normal:{w:50,h:40,dmg:11,kb:7}, special:{w:65,h:55,dmg:19,kb:15} }
  },
  {
    id:'tusk', name:'TUSK',
    bio: 'Walrus strongman swinging a kettlebell',
    color:'#a1887f', darkColor:'#5d4037',
    drawFn: drawTusk,
    attacks:{ normal:{w:65,h:45,dmg:15,kb:5}, special:{w:80,h:40,dmg:22,kb:9} }
  },
  {
    id:'bones', name:'BONES',
    bio: 'Skeleton duellist with a plumed hat and rapier',
    color:'#eeeeee', darkColor:'#9e9e9e',
    drawFn: drawBones,
    attacks:{ normal:{w:75,h:22,dmg:8,kb:10}, special:{w:100,h:18,dmg:16,kb:16} }
  }
];

// ==============================
// DRAW FUNCTIONS
// Origin is the fighter's centre; +x is the way they face.
// ==============================

// RIVET — boxy construction robot
function drawRivet(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Piston legs and tread feet
  ctx.fillStyle = dark; ctx.fillRect(-9,14,6,12+s*2); ctx.fillRect(4,14,6,12-s*2);
  ctx.fillStyle = '#263238'; roundRect(ctx,-13,24+s*2,12,6,2); ctx.fill(); roundRect(ctx,1,24-s*2,12,6,2); ctx.fill();
  // Box body with a seam and corner rivets
  ctx.fillStyle = color; roundRect(ctx,-13,-6,26,22,2); ctx.fill();
  ctx.fillStyle = dark; ctx.fillRect(-13,3,26,3);
  ctx.fillStyle = '#fff3e0'; [[-11,-4],[9,-4],[-11,12],[9,12]].forEach(([a,b]) => ctx.fillRect(a,b,2,2));
  // Pressure gauge
  ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.arc(0,10,4,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(3,7); ctx.stroke();
  // Head with a cyan visor slot
  ctx.fillStyle = color; roundRect(ctx,-11,-24,22,17,3); ctx.fill();
  ctx.fillStyle = '#263238'; roundRect(ctx,-8,-19,18,7,2); ctx.fill();
  ctx.fillStyle = '#4dd0e1'; ctx.fillRect(-6,-17,14,3);
  // Antenna
  ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-5,-24); ctx.lineTo(-7,-31); ctx.stroke();
  ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(-7,-32,2.5,0,Math.PI*2); ctx.fill();
  // Wrench claw arm
  ctx.fillStyle = dark; ctx.fillRect(12,-2,10,5);
  ctx.fillStyle = '#b0bec5'; ctx.fillRect(20,-5,4,11); ctx.fillRect(24,-5,5,3); ctx.fillRect(24,3,5,3);
  ctx.restore();
}

// THISTLE — hedge witch with a broom
function drawThistle(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Striped stockings and boots
  ctx.fillStyle = '#fafafa'; ctx.fillRect(-7,16,5,10+s*2); ctx.fillRect(3,16,5,10-s*2);
  ctx.fillStyle = '#43a047'; for (let i = 0; i < 3; i++) { ctx.fillRect(-7,17+i*3,5,1.5); ctx.fillRect(3,17+i*3,5,1.5); }
  ctx.fillStyle = '#3e2723'; ctx.fillRect(-9,25+s*2,8,5); ctx.fillRect(2,25-s*2,8,5);
  // Long braid behind
  ctx.fillStyle = '#ff7043'; roundRect(ctx,-11,-14,5,20,2); ctx.fill();
  // Flared dress with a hem and a patch
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-7,-4); ctx.lineTo(7,-4); ctx.lineTo(13,18); ctx.lineTo(-13,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = dark; ctx.fillRect(-12,15,24,3);
  ctx.fillStyle = '#ffb74d'; ctx.fillRect(-6,6,5,5);
  // Face
  ctx.fillStyle = '#e0ac7e'; roundRect(ctx,-7,-17,14,14,5); ctx.fill();
  ctx.fillStyle = '#000'; ctx.fillRect(2,-12,3,3);
  ctx.fillStyle = '#c68a5a'; ctx.fillRect(6,-9,3,3);
  // Wide-brimmed hat with a bent tip and a thistle flower
  ctx.fillStyle = dark; roundRect(ctx,-15,-20,30,5,2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-9,-19); ctx.lineTo(9,-19); ctx.lineTo(3,-28); ctx.lineTo(-8,-33); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ce93d8'; ctx.beginPath(); ctx.arc(6,-22,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#66bb6a'; ctx.fillRect(4,-20,4,2);
  // Broom held forward
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(2,10); ctx.lineTo(26,-6); ctx.stroke();
  ctx.fillStyle = '#ffca28'; ctx.beginPath(); ctx.moveTo(24,-10); ctx.lineTo(37,-14); ctx.lineTo(34,-1); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// SPUD — potato prizefighter
function drawSpud(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Feet
  ctx.fillStyle = '#5d4037'; roundRect(ctx,-12,22+s*2,10,7,3); ctx.fill(); roundRect(ctx,3,22-s*2,10,7,3); ctx.fill();
  // Lumpy potato body with spots
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0,1,15,22,0.12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = dark; [[-8,6],[-3,-17],[9,-14],[-9,-4]].forEach(([a,b]) => { ctx.beginPath(); ctx.arc(a,b,1.6,0,Math.PI*2); ctx.fill(); });
  // Boxing trunks
  ctx.fillStyle = '#1e88e5'; roundRect(ctx,-14,11,28,8,3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-14,11,28,2);
  // Headband with trailing ties
  ctx.fillStyle = '#e53935'; ctx.fillRect(-14,-15,28,4); ctx.fillRect(-21,-15,8,3); ctx.fillRect(-20,-12,6,2);
  // Eyes and grin
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3,-7,3.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(6,-7,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-2,-7,1.7,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,-7,1.7,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(2,0,4,0.2,Math.PI-0.2); ctx.stroke();
  // Sprout on top
  ctx.fillStyle = '#7cb342';
  ctx.beginPath(); ctx.ellipse(-3,-24,2.5,5,-0.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-24,2.5,5,0.6,0,Math.PI*2); ctx.fill();
  // Boxing gloves
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(18,0,7,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-16,5,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(10,3,4,5);
  ctx.restore();
}

// NOVA — kid astronaut
function drawNova(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Jetpack and flame
  ctx.fillStyle = dark; roundRect(ctx,-19,-6,8,18,3); ctx.fill();
  ctx.fillStyle = '#ffab40'; ctx.beginPath(); ctx.moveTo(-18,12); ctx.lineTo(-12,12); ctx.lineTo(-15,17+s*3); ctx.closePath(); ctx.fill();
  // Suit legs and boots
  ctx.fillStyle = '#eceff1'; ctx.fillRect(-8,14,7,11+s*2); ctx.fillRect(2,14,7,11-s*2);
  ctx.fillStyle = color; ctx.fillRect(-10,24+s*2,10,5); ctx.fillRect(1,24-s*2,10,5);
  // Puffy suit with a stripe and chest panel
  ctx.fillStyle = '#eceff1'; roundRect(ctx,-11,-4,22,20,6); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(-11,8,22,3);
  ctx.fillStyle = '#263238'; roundRect(ctx,-5,-1,10,6,1); ctx.fill();
  ctx.fillStyle = '#ff5252'; ctx.fillRect(-3,1,2,2); ctx.fillStyle = '#69f0ae'; ctx.fillRect(1,1,2,2);
  // Face, curly hair and eye inside the helmet
  ctx.fillStyle = '#8d5524'; ctx.beginPath(); ctx.arc(0,-15,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-1,-19,6,Math.PI,0); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(2,-17,3,3); ctx.fillStyle = '#000'; ctx.fillRect(3,-16,2,2);
  // Glass bubble helmet
  ctx.fillStyle = '#b3e5fc44'; ctx.beginPath(); ctx.arc(0,-15,11,0,Math.PI*2); ctx.fill();

// HOOT — night owl brawler
function drawHoot(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Talons
  ctx.fillStyle = '#ffb300'; ctx.fillRect(-9,23+s*2,8,4); ctx.fillRect(2,23-s*2,8,4);
  // Egg-shaped body with a speckled belly
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0,5,15,19,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e8eaf6'; ctx.beginPath(); ctx.ellipse(1,10,9,11,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-4,5+i*5); ctx.lineTo(1,8+i*5); ctx.lineTo(6,5+i*5); ctx.stroke(); }
  // Head with short feather tufts
  ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0,-12,14,11,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13,-15); ctx.lineTo(-11,-24); ctx.lineTo(-5,-20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13,-15); ctx.lineTo(11,-24); ctx.lineTo(5,-20); ctx.closePath(); ctx.fill();
  // Face discs, big amber eyes, beak
  ctx.fillStyle = '#e8eaf6'; ctx.beginPath(); ctx.arc(-4,-12,6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,-12,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffca28'; ctx.beginPath(); ctx.arc(-4,-12,4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,-12,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-3,-12,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8,-12,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(4,-8); ctx.lineTo(2,-3); ctx.closePath(); ctx.fill();
  // Fighting sash
  ctx.fillStyle = '#ef6c00'; ctx.fillRect(-14,0,28,4); ctx.fillRect(-19,0,6,9);
  // Wing balled up like a fist
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(15,4,9,5,-0.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// GLOOP — one-eyed slime cube
function drawGloop(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, sq = (frame % 2) * 2;
  ctx.save(); ctx.translate(x+20, y+22); ctx.scale(f,1);
  // Wobbly jelly cube
  ctx.fillStyle = color + 'cc'; roundRect(ctx,-18,-12+sq,36,40-sq,6); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2; roundRect(ctx,-18,-12+sq,36,40-sq,6); ctx.stroke();
  // Drips
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(-10,28,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,29,2.5,0,Math.PI*2); ctx.fill();
  // Bubbles and a swallowed coin
  ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(-8,14,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10,20,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(2,16,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffb300'; ctx.fillRect(1,13,2,6);
  // One big eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(4,0+sq,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6,0+sq,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(6,-3+sq,2,2);
  // Shine
  ctx.fillStyle = '#ffffff66'; roundRect(ctx,-14,-8+sq,5,10,2); ctx.fill();
  // Reaching blob arm
  ctx.fillStyle = color + 'cc'; roundRect(ctx,16,4,10,8,4); ctx.fill();
  ctx.restore();
}

// BONES — skeleton duellist
function drawBones(ctx, x, y, facingRight, color, dark, frame) {
  const f = facingRight ? 1 : -1, s = frame % 2;

  ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(10,-6); ctx.lineTo(12,18); ctx.lineTo(4,15); ctx.lineTo(0,19); ctx.lineTo(-5,15); ctx.lineTo(-12,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffca28'; ctx.fillRect(-1,-6,2,20);
  // Skull with glowing eyes and teeth
  ctx.fillStyle = color; roundRect(ctx,-9,-24,18,16,7); ctx.fill(); ctx.fillRect(-5,-10,11,4);
  ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(-2,-17,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(5,-17,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff5252'; ctx.fillRect(-3,-18,2,2); ctx.fillRect(4,-18,2,2);
  ctx.fillStyle = '#212121'; for (let i = -4; i < 6; i += 3) ctx.fillRect(i,-9,1,3);
  // Hat with a red plume
  ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.moveTo(-13,-22); ctx.lineTo(13,-22); ctx.lineTo(6,-29); ctx.lineTo(-6,-29); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.ellipse(-8,-30,8,3,-0.5,0,Math.PI*2); ctx.fill();
  // Arm bone and a rapier held level
  ctx.fillStyle = color; ctx.fillRect(6,0,7,3);
  ctx.fillStyle = '#cfd8dc'; ctx.fillRect(13,0.5,26,2);
  ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(13,1.5,4,-Math.PI/2,Math.PI/2); ctx.stroke();
  ctx.restore();
}

  sky.addColorStop(0,colors.sky1); sky.addColorStop(1,colors.sky2);
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  g.fillStyle='#ffffff55';
  for(let i=0;i<100;i++) g.fillRect((i*137+50)%W,(i*89+20)%(H*0.85),1+(i%2),1+(i%2));

  g.fillStyle='#1a0040';
  g.beginPath(); g.ellipse(430,440,350,40,0,0,Math.PI*2); g.fill();
}

  g.lineTo(W,H); g.fill();
  // Fluffy clouds
  [[130,80],[300,50],[500,90],[700,65]].forEach(([cx,cy])=>{
    g.fillStyle='#fff9';
    g.beginPath(); g.ellipse(cx,cy,55,28,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx+35,cy+8,40,22,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(cx-30,cy+10,38,20,0,0,Math.PI*2); g.fill();
  });
  // Wildflowers
  for(let i=0;i<26;i++){ g.fillStyle=['#fff','#ffeb3b','#f48fb1'][i%3]; g.beginPath(); g.arc((i*67+20)%W,395+(i*29)%60,3,0,Math.PI*2); g.fill(); }
}

// ==============================
// PLATFORM DRAWING (themed per stage)
// ==============================
function drawStagePlatforms(stage) {
  stage.platforms.forEach(p=>{
    const isMain=p.main;
    const c=stage.colors;
    ctx.fillStyle=c.main; roundRect(ctx,p.x,p.y,p.w,p.h,isMain?4:6); ctx.fill();
    ctx.strokeStyle=c.plat; ctx.lineWidth=2;
    roundRect(ctx,p.x,p.y,p.w,p.h,isMain?4:6); ctx.stroke();
    ctx.strokeStyle=c.glow+'aa'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(p.x+4,p.y+1); ctx.lineTo(p.x+p.w-4,p.y+1); ctx.stroke();
  });
  ctx.strokeStyle='#ff6b0018'; ctx.lineWidth=1; ctx.setLineDash([6,6]);
  ctx.strokeRect(20,20,W-40,H-40); ctx.setLineDash([]);
}

// ==============================
// PARTICLES & EFFECTS
// ==============================
const particles=[];
function spawnParticles(x,y,color,count=8){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:30,maxLife:30,color});
  }
}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;const sz=4*(p.life/p.maxLife);ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);});ctx.globalAlpha=1;}

const hitflashes=[];
function spawnHitFlash(x,y,big){hitflashes.push({x,y,life:12,big});}
function drawHitFlashes(){
  hitflashes.forEach(h=>{const r=(h.big?28:16)*(h.life/12);ctx.globalAlpha=h.life/12*0.9;ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let i=0;i<6;i++){const a=i/6*Math.PI*2,r2=r+4;ctx.beginPath();ctx.moveTo(h.x+Math.cos(a)*(r-6),h.y+Math.sin(a)*(r-6));ctx.lineTo(h.x+Math.cos(a)*r2,h.y+Math.sin(a)*r2);ctx.stroke();}ctx.globalAlpha=1;});
  for(let i=hitflashes.length-1;i>=0;i--){hitflashes[i].life--;if(!hitflashes[i].life)hitflashes.splice(i,1);}
}

// ==============================
// PLAYER CLASS
// ==============================
const GRAVITY=0.5,JUMP_FORCE=-12,SPEED=3.5,STOCKS=3;
let currentPlatforms=[];

class Player {
  constructor(id,charData,x,y,keys){
    this.id=id; this.char=charData; this.x=x; this.y=y;
    this.vx=0; this.vy=0;
    this.color=charData.color; this.dark=charData.darkColor;
    this.keys=keys; this.w=40; this.h=48;
    this.onGround=false; this.jumps=2;
    this.facing=id===1?1:-1;
    this.damage=0; this.stocks=STOCKS;
    this.attackTimer=0; this.hitStun=0; this.dodgeTimer=0;
    this.attackBox=null; this.frameCount=0;
    this.respawnTimer=0; this.dead=false;
    this.name=charData.name;
  }
  update(keys,other){
    if(this.dead){this.respawnTimer--;if(this.respawnTimer<=0)this.respawn();return;}
    this.frameCount++;
    if(this.hitStun>0)this.hitStun--;
    if(this.dodgeTimer>0)this.dodgeTimer--;
    if(this.attackTimer>0){this.attackTimer--;if(this.attackTimer===0)this.attackBox=null;}
    if(this.hitStun===0&&this.dodgeTimer===0){
      if(keys[this.keys.left]){this.vx=-SPEED;this.facing=-1;}
      else if(keys[this.keys.right]){this.vx=SPEED;this.facing=1;}
      else{this.vx*=0.7;}
      if(keys[this.keys.up]&&!this._jumpHeld&&this.jumps>0){this.vy=JUMP_FORCE;this.jumps--;this._jumpHeld=true;}
      if(!keys[this.keys.up])this._jumpHeld=false;
      if(keys[this.keys.attack]&&!this._atkHeld&&this.attackTimer===0){this._atkHeld=true;this.doAttack('normal',other);}
      if(!keys[this.keys.attack])this._atkHeld=false;
      if(keys[this.keys.special]&&!this._spHeld&&this.attackTimer===0){this._spHeld=true;this.doAttack('special',other);}
      if(!keys[this.keys.special])this._spHeld=false;
      if(keys[this.keys.dodge]&&!this._dHeld&&this.onGround){this._dHeld=true;this.dodgeTimer=24;spawnParticles(this.x+20,this.y+24,'#fff',5);}
      if(!keys[this.keys.dodge])this._dHeld=false;
    }
    this.vy+=GRAVITY; this.x+=this.vx; this.y+=this.vy;
    this.onGround=false;
    for(const p of currentPlatforms){
      if(this.x+this.w>p.x&&this.x<p.x+p.w&&this.y+this.h>p.y&&this.y+this.h<p.y+p.h+this.vy+8&&this.vy>=0){
        this.y=p.y-this.h;this.vy=0;this.onGround=true;this.jumps=2;
      }
    }
    if(this.x<-150||this.x>W+100||this.y>H+60||this.y<-200)this.die();
    if(this.attackBox&&other&&!other.dead&&other.dodgeTimer===0){
      const ab=this.attackBox;
      if(ab.x<other.x+other.w&&ab.x+ab.w>other.x&&ab.y<other.y+other.h&&ab.y+ab.h>other.y){
        this.attackBox=null;other.takeHit(ab.dmg,ab.kb,this.facing,ab.special);
        spawnParticles(other.x+20,other.y+24,other.color,10);spawnHitFlash(other.x+20,other.y+20,ab.special);
      }
    }
  }
  doAttack(type,other){
    const ad=this.char.attacks[type];const isSpecial=type==='special';
    this.attackTimer=isSpecial?35:22;
    const bx=this.facing===1?this.x+this.w:this.x-ad.w;
    this.attackBox={x:bx,y:this.y+(this.h-ad.h)/2,w:ad.w,h:ad.h,dmg:ad.dmg,kb:ad.kb,special:isSpecial};
    spawnParticles(bx+ad.w/2,this.y+this.h/2,isSpecial?'#fff':this.color,isSpecial?6:3);
  }
  takeHit(dmg,kb,dir,special){
    if(this.dodgeTimer>0)return;
    this.damage+=dmg;const kbMul=1+this.damage/80;
    this.vx=dir*kb*kbMul*(special?1.4:1);this.vy=-kb*0.6*kbMul;
    this.hitStun=Math.min(40,12+Math.floor(this.damage/10));this.attackBox=null;
  }
  die(){
    if(this.dead)return;this.dead=true;this.stocks--;this.damage=0;this.attackBox=null;
    this.respawnTimer=100;spawnParticles(this.x+20,this.y+20,this.color,20);showKO();
    if(this.stocks<0)this.stocks=0;
  }
  respawn(){
    this.dead=false;this.x=this.id===1?200:540;this.y=100;
    this.vx=0;this.vy=0;this.hitStun=60;this.dodgeTimer=0;
  }
  draw(){
    if(this.dead)return;
    const alpha=this.dodgeTimer>0?0.35:(this.hitStun>0&&Math.floor(this.frameCount/4)%2===0?0.5:1);
    ctx.globalAlpha=alpha;
    this.char.drawFn(ctx,this.x,this.y,this.facing===1,this.color,this.dark,Math.floor(this.frameCount/8));
    ctx.globalAlpha=1;
    if(this.attackBox){ctx.strokeStyle=this.color+'66';ctx.lineWidth=1;ctx.strokeRect(this.attackBox.x,this.attackBox.y,this.attackBox.w,this.attackBox.h);}
    ctx.fillStyle=this.color;ctx.font='7px "Press Start 2P"';ctx.textAlign='center';
    ctx.fillText(this.name,this.x+20,this.y-6);
  }
}

// ==============================
// GAME STATE
// ==============================
let p1,p2;let keysDown={};let gameTime=99;let timeInterval;let gameRunning=false;let frameId;
let currentStage=STAGES[0];
const KEY_P1={left:'a',right:'d',up:'w',down:'s',attack:'f',special:'g',dodge:'h'};
const KEY_P2={left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',attack:'l',special:';',dodge:"'"};
document.addEventListener('keydown',e=>{keysDown[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keysDown[e.key]=false;});

let koTimer=0;
function showKO(){document.getElementById('ko-overlay').style.opacity=1;koTimer=60;}
function updateKO(){if(koTimer>0){koTimer--;if(koTimer===0)document.getElementById('ko-overlay').style.opacity=0;}}

function gameLoop(){
  ctx.clearRect(0,0,W,H);
  currentStage.bgFn(currentStage.colors);
  drawStagePlatforms(currentStage);
  updateParticles();drawParticles();
  p1.update(keysDown,p2);p2.update(keysDown,p1);
  p1.draw();p2.draw();
  drawHitFlashes();updateKO();updateHUD();checkWin();
  frameId=requestAnimationFrame(gameLoop);
}

function updateHUD(){
  document.getElementById('p1-pct').textContent=Math.round(p1.damage)+'%';
  document.getElementById('p2-pct').textContent=Math.round(p2.damage)+'%';
  updateStocks('p1-stocks',p1);updateStocks('p2-stocks',p2);
}
function updateStocks(id,player){
  const el=document.getElementById(id);el.innerHTML='';
  for(let i=0;i<STOCKS;i++){const d=document.createElement('div');d.className='stock-dot';if(i>=player.stocks)d.style.background='transparent';el.appendChild(d);}
}
function checkWin(){if(gameTime<=0||p1.stocks<=0||p2.stocks<=0)endGame();}
function endGame(){
  if(!gameRunning)return;gameRunning=false;cancelAnimationFrame(frameId);clearInterval(timeInterval);
  let winner;
  if(p1.stocks>p2.stocks)winner=p1.name+' (P1)';
  else if(p2.stocks>p1.stocks)winner=p2.name+' (P2)';
  else if(p1.damage<p2.damage)winner=p1.name+' (P1)';
  else if(p2.damage<p1.damage)winner=p2.name+' (P2)';
  else winner='DRAW!';
  document.getElementById('winner-text').textContent=winner+' WINS!';
  document.getElementById('result-screen').style.display='flex';
}

// ==============================
// SELECT SCREEN SETUP
// ==============================
let sel1=0,sel2=1,selStage=0;

function buildCharSelect(){
  ['p1-grid','p2-grid'].forEach((gid,pi)=>{
    const grid=document.getElementById(gid);grid.innerHTML='';
    CHARS.forEach((c,i)=>{
      const card=document.createElement('div');
      card.className='char-card'+((pi===0&&i===sel1)||(pi===1&&i===sel2)?' selected':'');
      const cv=document.createElement('canvas');cv.width=40;cv.height=48;cv.style.width='40px';cv.style.height='48px';
      const cx=cv.getContext('2d');c.drawFn(cx,0,0,true,c.color,c.darkColor,0);
      const nm=document.createElement('div');nm.className='name';nm.textContent=c.name;
      card.appendChild(cv);card.appendChild(nm);
      card.addEventListener('click',()=>{if(pi===0)sel1=i;else sel2=i;buildCharSelect();});
      grid.appendChild(card);
    });
  });
}

function buildStageSelect(){
  const grid=document.getElementById('stage-grid');grid.innerHTML='';
  STAGES.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='stage-card'+(i===selStage?' selected':'');
    // Mini preview canvas
    const cv=document.createElement('canvas');cv.width=120;cv.height=68;cv.style.width='120px';cv.style.height='68px';
    const cx=cv.getContext('2d');
    // Draw mini stage preview
    drawMiniStage(cx,s);
    const nm=document.createElement('div');nm.className='sname';nm.textContent=s.name;
    card.appendChild(cv);card.appendChild(nm);
    card.addEventListener('click',()=>{selStage=i;buildStageSelect();});
    grid.appendChild(card);
  });
}

function drawMiniStage(cx, stage){
  const sw=120,sh=68,scaleX=sw/W,scaleY=sh/H;
  cx.save();cx.scale(scaleX,scaleY);
  stage.bgFn(stage.colors, cx);
  // Draw platforms simplified
  stage.platforms.forEach(p=>{
    cx.fillStyle=stage.colors.main; roundRect(cx,p.x,p.y,p.w,p.h,p.main?4:6); cx.fill();
    cx.strokeStyle=stage.colors.plat;cx.lineWidth=3;
    roundRect(cx,p.x,p.y,p.w,p.h,p.main?4:6);cx.stroke();
  });
  cx.restore();
}

buildCharSelect();buildStageSelect();

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('play-again-btn').addEventListener('click',()=>{
  document.getElementById('result-screen').style.display='none';
  startGame();
});
document.getElementById('char-select-btn').addEventListener('click',()=>{
  document.getElementById('result-screen').style.display='none';
  document.getElementById('title-screen').style.display='flex';
  document.getElementById('game-wrap').style.display='none';
  buildCharSelect();buildStageSelect();
});

function startGame(){
  currentStage=STAGES[selStage];
  currentPlatforms=currentStage.platforms;
  document.getElementById('title-screen').style.display='none';
  document.getElementById('game-wrap').style.display='flex';
  document.getElementById('p1-name-label').textContent=CHARS[sel1].name;
  document.getElementById('p2-name-label').textContent=CHARS[sel2].name;
  document.getElementById('p1-stocks').className='stock-bar p1';
  document.getElementById('p2-stocks').className='stock-bar p2';
  p1=new Player(1,CHARS[sel1],180,300,KEY_P1);
  p2=new Player(2,CHARS[sel2],580,300,KEY_P2);
  gameTime=99;document.getElementById('timer').textContent=gameTime;
  keysDown={};particles.length=0;hitflashes.length=0;gameRunning=true;
  clearInterval(timeInterval);
  timeInterval=setInterval(()=>{if(!gameRunning)return;gameTime--;document.getElementById('timer').textContent=gameTime;},1000);
  cancelAnimationFrame(frameId);
  gameLoop();
}
</script>
