<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomsday 95">
<meta name="theme-color" content="#008080">
<title>Doomsday 95: Tesla vs. Edison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== css: base.css ===== */
/* Win95 chrome, tokens and layout primitives. */
:root {
  color-scheme: light;
  --face: #c0c0c0; --light: #dfdfdf; --hi: #ffffff; --shadow: #808080; --dark: #0a0a0a;
  --title: #000080; --title2: #1084d0; --title-off: #808080; --title-off2: #b5b5b5;
  --desk: #008080; --desk2: #006e6e; --ink: #000000; --ink-soft: #3a3a3a; --field: #ffffff; --select: #000080; --select-ink: #ffffff;
  --res-E: #fde047; --res-O: #6bbf59; --res-M: #a855f7; --res-S: #7dd3fc; --res-X: #e0464e;
  --ui-font: Tahoma, Verdana, Geneva, "Segoe UI", sans-serif;
  --px-font: "Pixelify Sans", "Courier New", monospace;
  --taskbar-h: 38px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --face: #b3b3b3; --light: #cfcfcf; --hi: #ececec; --desk: #005a5a; --desk2: #004a4a; --field: #ececec; }
}
:root[data-theme="dark"] { color-scheme: dark; --face: #b3b3b3; --light: #cfcfcf; --hi: #ececec; --desk: #005a5a; --desk2: #004a4a; --field: #ececec; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--desk); color: var(--ink); font: 12px/1.3 var(--ui-font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { position: relative; height: 100%; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font: inherit; color: var(--ink); }
:focus-visible { outline: 1px dotted var(--ink); outline-offset: -4px; }

.raised { background: var(--face); box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shadow), inset 2px 2px var(--hi); }
.sunken { background: var(--field); box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--shadow), inset -2px -2px var(--light), inset 2px 2px var(--dark); }
.groove { box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--shadow); }

.btn { min-height: 44px; min-width: 44px; padding: 4px 12px; border: 0; background: var(--face); cursor: pointer;
  box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--hi), inset -2px -2px var(--shadow), inset 2px 2px var(--light); }
.btn:active:not(:disabled), .btn.on { box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--dark), inset -2px -2px var(--light), inset 2px 2px var(--shadow); padding: 5px 11px 3px 13px; }
.btn:disabled { color: var(--shadow); text-shadow: 1px 1px var(--hi); cursor: default; }
.btn.primary { outline: 1px solid var(--dark); outline-offset: -1px; }
.btn.small { min-height: 36px; padding: 2px 8px; }

.win { background: var(--face); padding: 3px; display: flex; flex-direction: column;
  box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shadow), inset 2px 2px var(--hi), 2px 2px 0 rgba(0,0,0,.35); }
.titlebar { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 3px 0 4px; color: #fff; font-weight: bold;
  background: linear-gradient(90deg, var(--title), var(--title2)); flex: none; }
.titlebar .ttl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--px-font); font-weight: 600; font-size: 13px; letter-spacing: .02em; }
.titlebar img.px { width: 16px; height: 16px; }
.tb-btn { width: 18px; height: 16px; min-width: 0; min-height: 0; padding: 0; font: bold 11px/1 var(--ui-font); display: grid; place-items: center; position: relative; }
.tb-btn::after { content: ""; position: absolute; inset: -14px -6px; } /* 44pt touch area, Win95 look */
.win-body { padding: 10px; overflow: auto; }

.layer { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; padding: 12px; background: rgba(0,0,0,.18); }
.layer:empty { display: none; }
.dialog { max-width: min(560px, 96vw); max-height: 92vh; min-width: min(300px, 92vw); }
.dialog .win-body { display: flex; flex-direction: column; gap: 10px; }
.dialog .btn-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog p { margin: 0; max-width: 60ch; }
.dialog.wide { max-width: min(860px, 96vw); }

#toast { position: fixed; left: 50%; bottom: calc(var(--taskbar-h) + 10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  padding: 6px 10px; background: #ffffe1; border: 1px solid var(--dark); max-width: 90vw; pointer-events: none; opacity: 0; transition: opacity .15s; }
#toast.show { opacity: 1; }

#rotate { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: var(--desk); padding: 20px; }
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: grid; } }

.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.reduced *, .reduced *::before, .reduced *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== css: desktop.css ===== */
/* Boot screen, desktop, taskbar and menu windows. */
.boot { position: absolute; inset: 0; background: #000; color: #c0c0c0; display: grid; place-items: center; font-family: var(--px-font); text-align: center; cursor: pointer; }
.boot h1 { font-size: clamp(28px, 6vw, 56px); margin: 0 0 8px; color: #fff; letter-spacing: .04em; }
.boot .bar { width: 220px; height: 16px; margin: 18px auto 8px; padding: 2px; border: 1px solid #c0c0c0; }
.boot .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #000080 0 10px, transparent 10px 12px); animation: load 1.4s steps(18) forwards; }
@keyframes load { to { width: 100%; } }

.desktop { position: absolute; inset: 0 0 var(--taskbar-h) 0; padding: 10px; background: var(--desk); }
.icons { display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 86px); gap: 6px; height: 100%; justify-content: start; }
.dicon { width: 86px; height: 82px; border: 0; background: none; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; cursor: pointer; text-align: center; }
.dicon img.px { width: 40px; height: 40px; }
.dicon span { padding: 1px 3px; font-size: 12px; }
.dicon:focus-visible span, .dicon:active span { background: var(--select); outline: 1px dotted #fff; }
.desk-title { position: absolute; right: 18px; bottom: 14px; text-align: right; color: rgba(255,255,255,.88); font-family: var(--px-font); }
.desk-title b { display: block; font-size: clamp(26px, 5vw, 48px); line-height: 1; font-weight: 700; }
.desk-title span { font-size: 14px; }

.taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px)); padding: 3px 3px calc(3px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; background: var(--face); box-shadow: inset 0 1px var(--light), inset 0 2px var(--hi); z-index: 40; }
.taskbar .btn { min-height: 32px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.taskbar .btn img.px { width: 16px; height: 16px; }
.scheme { font-weight: bold; }
.tray { margin-left: auto; padding: 0 8px; height: 30px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.menu { position: fixed; left: 3px; bottom: calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; min-width: 210px; }
.menu .stripe { width: 24px; background: linear-gradient(0deg, var(--title), var(--title2)); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font: bold 15px var(--px-font); padding: 8px 2px; }
.menu ul { list-style: none; margin: 0; padding: 2px; flex: 1; }
.menu li button { width: 100%; min-height: 40px; border: 0; background: none; text-align: left; padding: 4px 10px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.menu li button:hover, .menu li button:focus-visible { background: var(--select); color: var(--select-ink); }
.menu img.px { width: 20px; height: 20px; }

.villains { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dossier { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.dossier header { display: flex; gap: 10px; align-items: center; }
.dossier header img.px { width: 64px; height: 64px; }
.dossier h3 { margin: 0; font: 600 18px var(--px-font); }
.dossier p { margin: 0; }
.howto { max-width: 62ch; }
.howto h3 { font: 600 14px var(--px-font); margin: 10px 0 4px; }
.howto p, .howto li { margin: 0 0 6px; }
.field-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.field-row input { width: 20px; height: 20px; }
@media (max-width: 560px) { .villains { grid-template-columns: 1fr; } }
.taskbar:empty { display: none; }

/* ===== css: match.css ===== */
/* Match window: side panels, 3x4 board, inspector and hand. */
.match { position: absolute; inset: 0 0 calc(var(--taskbar-h) + env(safe-area-inset-bottom, 0px)) 0; }
.match > .win { position: absolute; inset: 0; }
.match {
  --cell-h: clamp(54px, calc((100dvh - var(--taskbar-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 64px) / 4), 168px);
  --cell-w: calc(var(--cell-h) * 0.74);
}
.match-body { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(170px, 23vw, 270px) auto minmax(0, 1fr); gap: 6px; padding: 4px; }

.side { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.pbox { flex: 1; min-height: 0; padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.pbox.active { outline: 2px solid var(--title); outline-offset: -2px; }
.pbox header { display: flex; align-items: center; gap: 6px; font: 600 clamp(12px, 1.5vw, 15px) var(--px-font); }
.pbox header img.px { width: 20px; height: 20px; }
.pbox header .who { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font: 11px var(--ui-font); padding: 0 4px; border: 1px solid var(--dark); background: #ffffe1; }
.badge.shield { background: #dbeafe; }
.dev { display: flex; align-items: center; gap: 6px; padding: 2px; min-height: 26px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.dev img.px { width: 24px; height: 24px; }
.dev .dname { font-weight: bold; font-size: 11px; line-height: 1.15; }
.meters { display: grid; gap: 2px; }
.meter { display: grid; grid-template-columns: 14px 1fr 38px; gap: 4px; align-items: center; font-size: 11px; min-height: 15px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.meter.tap { cursor: pointer; }
.meter.tap .bar { outline: 1px dotted var(--title); }
.meter img.px { width: 12px; height: 12px; }
.meter .bar { height: 10px; position: relative; }
.meter .bar i { position: absolute; inset: 2px auto 2px 2px; background: var(--c, var(--title)); transition: width .4s steps(8); max-width: calc(100% - 4px); }
.meter .num { text-align: right; font-variant-numeric: tabular-nums; }
.meter.done .num { font-weight: bold; }
.resrow { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.rq { display: inline-flex; align-items: center; gap: 2px; }
.rq img.px { width: 12px; height: 12px; }
.stats { display: flex; gap: 8px; font-size: 11px; color: var(--ink-soft); flex-wrap: wrap; align-items: center; }
.stats img.px { width: 14px; height: 14px; display: inline-block; vertical-align: -3px; }

.board-wrap { padding: 4px; background: var(--desk2); display: flex; align-items: center; }
.board { display: grid; grid-template-columns: repeat(3, var(--cell-w)); grid-template-rows: repeat(4, var(--cell-h)); gap: 4px; }
.cell { position: relative; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 6px; }
.cell::before { content: ""; position: absolute; inset: 1px; border: 1px dashed rgba(255,255,255,.35); border-radius: 6px; pointer-events: none; }
.cell.zone-rival { background: rgba(224, 70, 78, .16); }
.cell.zone-you { background: rgba(253, 224, 71, .14); }
.cell .zlabel { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.6); font: 10px var(--px-font); text-align: center; padding: 4px; pointer-events: none; }
.cell.filled::before { display: none; }
.cell.can-build { box-shadow: 0 0 0 2px var(--res-E); animation: pulse 1s steps(2) infinite; }
.cell.can-work { box-shadow: 0 0 0 2px #fff; }
.cell.can-target { box-shadow: 0 0 0 2px var(--res-X); animation: pulse 1s steps(2) infinite; }
.cell.can-scrap { box-shadow: 0 0 0 2px #ff9f43; animation: pulse 1s steps(2) infinite; }
.cell.picked { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--res-X); }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px transparent; } }

/* The card lies back on the table; its sprite and name stand up off it. */
.cell .plane { position: absolute; inset: 0; transform: perspective(240px) rotateX(26deg); transform-origin: 50% 100%; }
.cell .plane .card { position: absolute; inset: 0; --cw: var(--cell-w); }
.popup { position: absolute; left: 0; right: 0; bottom: 30%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.popup img.px { width: 70%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); animation: bob 1.2s steps(2) infinite; }
.popup .pname { margin-top: 1px; font: 600 clamp(8px, calc(var(--cell-w) * 0.11), 14px)/1.05 var(--px-font); color: #fff; text-align: center; padding: 0 2px;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; max-width: 100%; }
.popup::after { content: ""; position: absolute; bottom: -4px; left: 30%; right: 30%; height: 5px; background: rgba(0,0,0,.28); border-radius: 50%; z-index: -1; }
.lean-l img.px { transform: translateX(-3px) rotate(-10deg); animation: none; }
.lean-r img.px { transform: translateX(3px) rotate(10deg); animation: none; }
.lean-u img.px { transform: translateY(-4px); animation: none; }
.lean-d img.px { transform: translateY(3px); animation: none; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.cell .out { position: absolute; left: 3px; right: 3px; bottom: 5px; display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; font: bold 10px var(--ui-font); color: #fff;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; pointer-events: none; }
.cell .out img.px { width: 10px; height: 10px; }
.cell .minion { position: absolute; right: 2px; top: 2px; width: 26%; animation: hop .3s steps(3); }
@keyframes hop { 0% { transform: translateY(-10px); } 60% { transform: translateY(2px); } }
.cell .owner { position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border: 1px solid #000; background: var(--own); }
.cell .stamp { position: absolute; left: 6%; right: 6%; top: 38%; transform: rotate(-14deg); border: 2px solid var(--res-X); color: var(--res-X); background: rgba(255,255,255,.85);
  font: 700 clamp(9px, calc(var(--cell-w) * .14), 14px) var(--px-font); text-align: center; pointer-events: none; }
.cell.fresh .plane { opacity: .8; }
.cell .fresh-tag { position: absolute; top: 3px; left: 14px; font-size: 9px; color: #fff; text-shadow: 1px 1px 0 #000; pointer-events: none; }
.cell.arrive .plane, .cell.arrive .popup { animation: arrive .35s steps(4); }
@keyframes arrive { 0% { transform: translateY(-30px) scale(1.3); opacity: 0; } }

.rpanel { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.inspector { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 8px; }
.inspector .bigcard { --cw: calc(min(var(--cell-h) * 1.75, 30vh) * 0.72); width: var(--cw); height: calc(var(--cw) / 0.72); align-self: start; background: var(--desk2); border-radius: 8px; }
.info { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.info .msg { font-size: 12px; }
.info .msg b { font-family: var(--px-font); font-size: 14px; font-weight: 600; }
.info .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.info .acts .btn.small { display: inline-flex; gap: 4px; align-items: center; min-height: 40px; }
.info .acts img.px { width: 12px; height: 12px; }
.log { flex: 1; min-height: 40px; overflow-y: auto; padding: 4px 6px; font-size: 11px; color: var(--ink); }
.log p { margin: 0 0 2px; }
.handbox { flex: none; padding: 14px 6px 6px; position: relative; }
.handbox .legend { position: absolute; top: -1px; left: 8px; background: var(--face); padding: 0 4px; font-size: 11px; }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 4px 4px; min-height: calc(var(--cell-h) * 1.05 + 14px); background: var(--desk2); }
.hand .hcard { flex: none; border: 0; padding: 0; background: none; cursor: pointer; --cw: calc(var(--cell-h) * 1.05 * 0.72); width: var(--cw); height: calc(var(--cw) / 0.72); position: relative; }
.hand .hcard.sel { transform: translateY(-6px); }
.hand .hcard.sel .card { box-shadow: 0 0 0 2px #fff; }
.hand .hcard.picked .card { box-shadow: 0 0 0 2px var(--res-X); }
.hand .hcard.cant .card { filter: grayscale(.7) brightness(.85); }
.hand .empty { color: rgba(255,255,255,.7); align-self: center; padding: 8px; }
.phase-label { padding: 0 8px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }

@media (max-height: 430px) {
  .inspector .bigcard { --cw: calc(var(--cell-h) * 1.55 * 0.72); }
  .pbox { padding: 4px 6px; gap: 2px; }
  .meter { min-height: 12px; }
  .stats { font-size: 10px; }
}
@media (max-width: 900px) { .phase-label { display: none; } }

/* ===== css: cards.css ===== */
/* Card frame: black border, transparent body, thin rarity border inset, rarity effects. */
.card { position: relative; width: 100%; height: 100%; border: 3px solid #000; border-radius: 7px; background: transparent; color: #fff; overflow: hidden;
  --rar: #c0c0c0; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; font-size: calc(var(--cw) * 0.075); }
.card::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--rar); border-radius: 3px; pointer-events: none; z-index: 2; }
.card.rar-uncommon { --rar: #cd7f32; }
.card.rar-rare { --rar: #ffd700; }
.card.rar-legendary::before { border-color: transparent; background: linear-gradient(135deg, #ff4d4d, #ffd84d, #5dff7a, #4dd8ff, #8f6bff, #ff5dd8) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0); }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.card.rar-uncommon::after { background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.4) 50%, transparent 58%) no-repeat; background-size: 300% 100%; animation: sweep 4.5s linear infinite; }
@keyframes sweep { 0% { background-position: 120% 0; } 35%, 100% { background-position: -40% 0; } }
.card.rar-rare::after { background:
  radial-gradient(circle at 18% 22%, #fff 0 1.2px, transparent 1.8px), radial-gradient(circle at 80% 15%, #fff7a8 0 1.4px, transparent 2px),
  radial-gradient(circle at 70% 70%, #fff 0 1.2px, transparent 1.8px), radial-gradient(circle at 26% 82%, #fff7a8 0 1.4px, transparent 2px),
  radial-gradient(circle at 50% 45%, #fff 0 1px, transparent 1.6px); animation: twinkle 1.6s steps(3) infinite alternate; }
@keyframes twinkle { 0% { opacity: .15; } 100% { opacity: 1; } }
.card.rar-legendary::after { background: linear-gradient(125deg, rgba(255,60,60,.28), rgba(255,220,60,.28), rgba(60,255,120,.28), rgba(60,220,255,.28), rgba(140,90,255,.28), rgba(255,60,200,.28), rgba(255,60,60,.28));
  background-size: 400% 400%; background-position: var(--hx, 0%) var(--hy, 0%); mix-blend-mode: screen; animation: holo 7s linear infinite; }
.card.rar-legendary.tilted::after { animation: none; }
@keyframes holo { to { background-position: 400% 400%; } }

.card .c-top { position: absolute; top: 6%; left: 7%; right: 7%; display: flex; justify-content: space-between; align-items: flex-start; gap: 2px; z-index: 1; }
.pips { display: flex; flex-wrap: wrap; gap: 1px; max-width: 70%; }
.pip { min-width: calc(var(--cw) * .13); height: calc(var(--cw) * .13); padding: 0 1px; display: inline-grid; place-items: center; border: 1px solid #000; color: #000; text-shadow: none;
  font: bold calc(var(--cw) * .085)/1 var(--ui-font); background: var(--pc); }
.pip.free { background: #fff; }

<script>
/* ===== js: state.js ===== */
// Single app state object for the UI layer. The game itself lives in appState.game.
const appState = {
  screen: "boot",
  game: null,
  settings: { sound: true, reducedMotion: false, difficulty: "normal" },
  ui: { selected: null, mode: null, picks: [], inspect: null, busy: false, cardMode: null, message: "" },
};
function resetUi() {
  Object.assign(appState.ui, { selected: null, mode: null, picks: [], inspect: null, cardMode: null, message: "" });
}

/* ===== js: registry.js ===== */
// Registry: the only way logic reaches card data. Validates DATA at startup.
const Registry = {
  cards: {},
  errors: [],
  init() {
    this.cards = {};
    this.errors = [];
    const need = ["id", "name", "deck", "type", "rarity", "copies", "cost", "produces", "effects", "sprite"];
    for (const c of DATA.cards) {
      for (const k of need) if (!(k in c)) this.errors.push(`Card ${c.id || "?"} is missing "${k}"`);
      if (c.copies > DATA.config.maxCopies) this.errors.push(`${c.id}: ${c.copies} copies is over the limit of ${DATA.config.maxCopies}`);
      if (!DATA.sprites.sprites[c.sprite]) this.errors.push(`${c.id}: sprite "${c.sprite}" not found`);
      this.cards[c.id] = c;
    }
    for (const deck of Object.keys(DATA.decks)) {
      const n = this.deckList(deck).length;
      if (n !== DATA.config.deckSize) this.errors.push(`Deck ${deck} has ${n} cards, expected ${DATA.config.deckSize}`);
    }
    return this.errors.length === 0;
  },
  card(id) {
    const c = this.cards[id];
    if (!c) throw new Error(`Unknown card ${id}`);
    return c;
  },
  deckCards(deck) { return DATA.cards.filter((c) => c.deck === deck); },
  deckList(deck) {
    const out = [];
    for (const c of this.deckCards(deck)) for (let i = 0; i < c.copies; i++) out.push(c.id);
    return out;
  },
};

/* ===== js: rng.js ===== */
// Seeded RNG (mulberry32). State lives in game.rng so matches replay exactly.
function rngNext(game) {
  let t = (game.rng = (game.rng + 0x6d2b79f5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rngInt(game, n) { return Math.floor(rngNext(game) * n); }
function rngShuffle(game, arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rngInt(game, i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===== js: engine-core.js ===== */
// Engine core: constants and pure helpers over a game object. No DOM.
const RES = ["E", "O", "M", "S", "X"];
const RES_NAME = { E: "Electricity", O: "Organic matter", M: "Magic", S: "Spirit essence", X: "MacGuffin" };
const COLS = 3, ROWS = 4;

function cfg(k) { return DATA.config[k]; }
function emptyRes() { return { E: 0, O: 0, M: 0, S: 0, X: 0 }; }
function rowOf(i) { return Math.floor(i / COLS); }
function colOf(i) { return i % COLS; }
function backRow(p) { return p === 0 ? 0 : ROWS - 1; }
function isPublicRow(r) { return r > 0 && r < ROWS - 1; }
function neighborsOf(i) {
  const r = rowOf(i), c = colOf(i), out = [];
  if (r > 0) out.push(i - COLS);
  if (r < ROWS - 1) out.push(i + COLS);
  if (c > 0) out.push(i - 1);
  if (c < COLS - 1) out.push(i + 1);
  return out;
}
function sumRes(r) { return RES.reduce((a, k) => a + (r[k] || 0), 0); }
function cardOf(game, inst) { return Registry.card(game.insts[inst].cardId); }
function cellCard(game, i) { const cell = game.board[i]; return cell ? cardOf(game, cell.inst) : null; }
function firstRes(card) { return RES.find((k) => card.produces[k]) || "E"; }
function canAfford(pl, cost) { return RES.every((k) => (pl.res[k] || 0) >= (cost[k] || 0)); }
function payCost(pl, cost) { RES.forEach((k) => { pl.res[k] -= cost[k] || 0; }); }
function addRes(pl, r) { RES.forEach((k) => { if (r[k]) pl.res[k] += r[k]; }); }
function rival(p) { return 1 - p; }

function deviceCard(game, p) { const d = game.players[p].device; return d ? cardOf(game, d.inst) : null; }
function deviceNeed(game, p) {
  const n = emptyRes(), c = deviceCard(game, p);
  if (!c) return n;
  const ch = game.players[p].device.charge;
  RES.forEach((k) => { n[k] = Math.max(0, (c.cost[k] || 0) - (ch[k] || 0)); });
  return n;
}
function chargePct(game, p) {
  const c = deviceCard(game, p);
  if (!c) return 0;
  const total = sumRes(c.cost);
  return total ? (total - sumRes(deviceNeed(game, p))) / total : 0;
}
function deviceFull(game, p) { return !!deviceCard(game, p) && sumRes(deviceNeed(game, p)) === 0; }
function passives(game, p) {
  const c = deviceCard(game, p);
  return c ? c.effects.filter((e) => e.trigger === "passive") : [];
}
function passive(game, p, action) { return passives(game, p).find((e) => e.action === action); }
function minionCap(game, p) { const m = passive(game, p, "minionCap"); return m ? m.params.amount : cfg("minionCap"); }
function placedCount(game, p) { return game.board.filter((c) => c && c.worker === p).length; }
function availableMinions(game, p) {
  const pl = game.players[p];
  return pl.minions + pl.tempMinions - placedCount(game, p);
}
function canBuildAt(game, p, i) {
  if (game.board[i]) return false;
  const r = rowOf(i);
  return r === backRow(p) || isPublicRow(r);
}
function isJammed(game, i) { const c = game.board[i]; return !!c && c.jamTurn === game.turn; }
function canWork(game, p, i) {
  const cell = game.board[i];
  if (!cell || cell.worker !== null) return false;
  if (cell.playedTurn === game.turn || cell.jamTurn === game.turn) return false;
  const r = rowOf(i);
  if (isPublicRow(r)) return true;
  return r === backRow(p) && cell.owner === p;
}
function workableCells(game, p) { return game.board.map((_, i) => i).filter((i) => canWork(game, p, i)); }
function rivalCells(game, p) { return game.board.map((c, i) => (c && c.owner === rival(p) ? i : -1)).filter((i) => i >= 0); }
function gameLog(game, msg) {
  game.log.push({ t: game.turn, msg });
  if (game.log.length > 150) game.log.shift();
}
function pname(game, p) { return game.players[p].short; }

/* ===== js: engine-effects.js ===== */
// Effects: production (with combos) and on-play card effects. Mutates the game, returns events.

// Output of one contraption at cell i, given the set of cells worked this turn.
function cellOutput(game, i, worked) {
  const cell = game.board[i], card = cardOf(game, cell.inst), owner = cell.owner;
  const out = Object.assign(emptyRes(), card.produces);
  const combos = [];
  const nbrs = neighborsOf(i).filter((n) => game.board[n]);
  const tagsOf = (n) => cellCard(game, n).tags || [];

  for (const e of card.effects) {
    if (e.trigger !== "onWork") continue;
    if (e.action === "gain") {
      const tag = e.condition && e.condition.adjacentTag;
      const partner = tag ? nbrs.find((n) => tagsOf(n).includes(tag)) : null;
      if (!tag || partner !== undefined) {
        RES.forEach((k) => { out[k] += e.params[k] || 0; });
        if (tag) combos.push([i, partner]);
      }
    }
    if (e.action === "gainPerAdjacentOwned") {
      const owned = nbrs.filter((n) => game.board[n].owner === owner).slice(0, e.params.max);
      out[e.params.res] += owned.length;
      owned.forEach((n) => combos.push([i, n]));
    }
  }
  // Auras from neighbors (Wireless Pylon, Pearl Street Station).
  for (const n of nbrs) {
    for (const e of cellCard(game, n).effects) {
      if (e.trigger !== "aura" || e.action !== "boostAdjacent") continue;
      if (e.params.tag && !(card.tags || []).includes(e.params.tag)) continue;
      if (e.params.owned && game.board[n].owner !== owner) continue;
      out[e.params.res || firstRes(card)] += e.params.amount || 1;
      combos.push([n, i]);
    }
  }
  // Device passives that boost the owner's tagged cards.
  for (const e of passives(game, owner)) {
    if (e.action === "boostTag" && (card.tags || []).includes(e.params.tag)) out[e.params.res] += e.params.amount;
  }
  // Resonance: adjacent worked contraptions sharing an output resource.
  const own = card.effects.find((e) => e.action === "resonanceBonus");
  const dev = passive(game, owner, "resonanceBonus");
  const bonus = own ? own.params.amount : dev ? dev.params.amount : 1;
  for (const n of nbrs) {
    if (!worked.has(n)) continue;
    const nc = cellCard(game, n);
    for (const k of RES) if (card.produces[k] && nc.produces[k]) { out[k] += bonus; combos.push([i, n]); }
  }
  return { out, combos };
}

function resolveCollect(game, p, events) {
  const worked = new Set(game.board.map((c, i) => (c && c.worker === p ? i : -1)).filter((i) => i >= 0));
  const seen = new Set();
  for (const i of worked) {
    const cell = game.board[i], card = cardOf(game, cell.inst);
    const { out, combos } = cellOutput(game, i, worked);
    addRes(game.players[p], out);
    events.push({ type: "produce", cell: i, p, res: out });
    for (const [a, b] of combos) {
      const key = a < b ? a + "-" + b : b + "-" + a;
      if (!seen.has(key)) { seen.add(key); events.push({ type: "combo", a, b }); }
    }
    if (cell.owner !== p) {
      const tax = passive(game, cell.owner, "rivalTax");
      const amt = tax ? tax.params.amount : 1, k = firstRes(card);
      game.players[cell.owner].res[k] += amt;
      events.push({ type: "tax", cell: i, p: cell.owner, res: { [k]: amt } });
    }
    if (card.effects.some((e) => e.trigger === "onWork" && e.action === "shield")) {
      game.players[cell.owner].shield = true;
      events.push({ type: "shield", p: cell.owner });
    }
  }
  const total = events.filter((e) => e.type === "produce").reduce((a, e) => a + sumRes(e.res), 0);
  gameLog(game, `${pname(game, p)} collects ${total} resource${total === 1 ? "" : "s"}.`);
}

function drawCards(game, p, n, events) {
  const pl = game.players[p];
  for (let i = 0; i < n; i++) {
    if (!pl.library.length) {
      if (!pl.discard.length) break;
      pl.library = rngShuffle(game, pl.discard);
      pl.discard = [];
      pl.minions = Math.max(1, pl.minions - 1);
      gameLog(game, `${pname(game, p)} ran out of cards: discard reshuffled, 1 minion lost.`);
      events.push({ type: "deckout", p });
    }
    pl.hand.push(pl.library.pop());
    events.push({ type: "draw", p });
  }
}

function jamCell(game, i, events) {
  game.board[i].jamTurn = game.turn + 1;
  game.board[i].worker = null;
  events.push({ type: "jam", cell: i });
}

function sabotage(game, target, amount, events) {
  const pl = game.players[target];
  if (pl.shield) {
    pl.shield = false;
    events.push({ type: "blocked", p: target });
    gameLog(game, `${pname(game, target)}'s Shield blocks the sabotage.`);
    return;
  }
  const ch = pl.device.charge;
  let left = amount, removed = 0;
  while (left > 0) {
    const k = RES.slice().sort((a, b) => (ch[b] || 0) - (ch[a] || 0))[0];
    if (!ch[k]) break;
    ch[k]--; left--; removed++;
  }
  events.push({ type: "sabotage", p: target, amount: removed });
  gameLog(game, `Sabotage! ${pname(game, target)}'s device loses ${removed} charge.`);
}

// Resolve a played distraction or worker. targets: board indices; mode: chosen mode.
function resolveOnPlay(game, p, card, targets, mode, events) {
  const pl = game.players[p], foe = rival(p), fp = game.players[foe];
  for (const e of card.effects) {
    if (e.trigger !== "onPlay") continue;
    if (e.mode && e.mode !== mode) continue;
    const prm = e.params || {};
    switch (e.action) {
      case "gain": addRes(pl, prm); events.push({ type: "gain", p, res: prm }); break;
      case "recruit": pl.minions = Math.min(minionCap(game, p), pl.minions + (prm.amount || 1)); events.push({ type: "recruit", p }); break;
      case "draw": drawCards(game, p, prm.amount || 1, events); break;
      case "shield": pl.shield = true; events.push({ type: "shield", p }); break;
      case "jam": {
        if (targets[0] === undefined) break;
        jamCell(game, targets[0], events);
        if (prm.adjacent) {
          const n = neighborsOf(targets[0]).find((x) => game.board[x] && game.board[x].owner === foe);
          if (n !== undefined) jamCell(game, n, events);
        }
        break;
      }
      case "sabotage": sabotage(game, foe, prm.amount || 3, events); break;
      case "steal": {
        const k = prm.res || RES.slice().sort((a, b) => fp.res[b] - fp.res[a])[0];
        const amt = Math.min(prm.amount || 2, fp.res[k]);
        fp.res[k] -= amt; pl.res[k] += amt;
        events.push({ type: "steal", from: foe, to: p, res: { [k]: amt } });
        gameLog(game, `${pname(game, p)} steals ${amt} ${RES_NAME[k]}.`);
        break;
      }
      case "swap": {
        const [a, b] = targets;
        [game.board[a], game.board[b]] = [game.board[b], game.board[a]];
        game.board[a].worker = null; game.board[b].worker = null;
        events.push({ type: "swap", a, b });
        if (passive(game, p, "swapAlsoJams")) jamCell(game, a, events);
        break;
      }
      case "bounce": {
        const i = targets[0], cell = game.board[i];
        game.players[cell.owner].hand.push(cell.inst);
        game.board[i] = null;
        events.push({ type: "bounce", cell: i });
        break;
      }
    }
  }
}

/* ===== js: engine-actions.js ===== */
// Engine actions: newGame and applyAction(game, action) -> { ok, error?, events }.
// Every handler validates first and mutates only once the action is legal.

function newGame(seed, humanDeck) {
  const decks = [humanDeck, humanDeck === "tesla" ? "edison" : "tesla"];
  const game = { v: 1, seed, rng: seed >>> 0, turn: 0, active: 0, phase: "setup", first: 0,
    players: [], board: Array(COLS * ROWS).fill(null), insts: {}, nextInst: 1, log: [], winner: null, actions: [] };
  decks.forEach((deck, p) => {
    const lib = [];
    for (const id of Registry.deckList(deck)) {
      const inst = "c" + game.nextInst++;
      game.insts[inst] = { cardId: id, owner: p };
      lib.push(inst);
    }
    const isDev = (i) => cardOf(game, i).type === "doomsday";
    game.players.push({ deck, short: DATA.decks[deck].short, villain: DATA.decks[deck].villain, ai: p === 1,
      deviceChoices: lib.filter(isDev), library: rngShuffle(game, lib.filter((i) => !isDev(i))), hand: [], discard: [],
      res: Object.assign(emptyRes(), cfg("startRes")), minions: cfg("minionStart"), tempMinions: 0,
      device: null, shield: false, setup: "device" });
  });
  game.first = rngInt(game, 2);
  gameLog(game, `${pname(game, game.first)} will go first.`);
  return game;
}

function startTurn(game, p, events) {
  game.turn++;
  game.active = p;
  game.phase = "main";
  game.players[p].tempMinions = 0;
  events.push({ type: "turn", p });
  if (deviceFull(game, p)) return endGame(game, p, events, "fires the doomsday device");
  if (game.turn > cfg("maxTurns")) {
    const w = chargePct(game, 0) >= chargePct(game, 1) ? 0 : 1;
    return endGame(game, w, events, "wins on time with the most charge");
  }
  gameLog(game, `Turn ${Math.ceil(game.turn / 2)}: ${pname(game, p)}.`);
  drawCards(game, p, 1, events);
}

function endGame(game, p, events, how) {
  game.winner = p;
  game.phase = "over";
  gameLog(game, `${pname(game, p)} ${how}. The world ends.`);
  events.push({ type: "win", p });
}

const Actions = {
  chooseDevice(game, a, ev) {
    const pl = game.players[a.p];
    if (game.phase !== "setup" || pl.setup !== "device") return "Not choosing a device now.";
    if (!pl.deviceChoices.includes(a.inst)) return "That device isn't an option.";
    pl.device = { inst: a.inst, charge: emptyRes() };
    pl.library.push(...pl.deviceChoices.filter((i) => i !== a.inst));
    rngShuffle(game, pl.library);
    pl.deviceChoices = [];
    drawCards(game, a.p, cfg("startHand"), ev);
    pl.setup = "mulligan";
  },
  mulligan(game, a, ev) {
    const pl = game.players[a.p];
    if (game.phase !== "setup" || pl.setup !== "mulligan") return "Not deciding a mulligan now.";
    if (a.redraw) {
      pl.library.push(...pl.hand);
      pl.hand = [];
      rngShuffle(game, pl.library);
      drawCards(game, a.p, cfg("startHand"), ev);
    }
    pl.setup = "ready";
    if (game.players.every((x) => x.setup === "ready")) game.phase = "bonus";
  },
  bonus(game, a, ev) {
    const second = rival(game.first);
    if (game.phase !== "bonus" || a.p !== second) return "No bonus to take.";
    if (!RES.includes(a.res)) return "Unknown resource.";
    if (a.res === "X") return "The going-second bonus can't be MacGuffin.";
    game.players[second].res[a.res] += 1;
    gameLog(game, `${pname(game, second)} takes 1 ${RES_NAME[a.res]} for going second.`);
    startTurn(game, game.first, ev);
  },
  play(game, a, ev) {
    if (game.phase !== "main" || game.active !== a.p) return "You can only play cards during your build step.";
    const pl = game.players[a.p];
    if (!pl.hand.includes(a.inst)) return "That card isn't in your hand.";
    const card = cardOf(game, a.inst);
    const targets = a.targets || [];
    if (card.type !== "doomsday" && !canAfford(pl, card.cost)) return "Not enough resources.";
    if (card.type === "contraption" && (a.cell === undefined || !canBuildAt(game, a.p, a.cell))) return "Build in your lab or in Public Works.";
    if (card.type === "worker" && pl.minions >= minionCap(game, a.p)) return "You're at your minion cap.";
    if (card.modes && !card.modes.includes(a.mode)) return "Choose a mode first.";
    if (card.target && (!card.target.mode || card.target.mode === a.mode)) {
      const legal = rivalCells(game, a.p);
      const need = Math.min(card.target.count, card.target.optional ? legal.length : card.target.count);
      if (targets.length < need) return legal.length < card.target.count && !card.target.optional ? "Not enough rival contraptions to target." : "Choose a target.";
      if (new Set(targets).size !== targets.length || !targets.every((t) => legal.includes(t))) return "Target a rival contraption.";
    }
    pl.hand.splice(pl.hand.indexOf(a.inst), 1);
    if (card.type !== "doomsday") payCost(pl, card.cost);
    ev.push({ type: "play", p: a.p, inst: a.inst, cell: a.cell, targets });
    if (card.type === "contraption") {
      game.board[a.cell] = { inst: a.inst, owner: a.p, playedTurn: game.turn, jamTurn: -1, worker: null };
      gameLog(game, `${pname(game, a.p)} builds ${card.name}.`);
      resolveOnPlay(game, a.p, card, [], null, ev);
    } else if (card.type === "doomsday") {
      const old = pl.device, nc = emptyRes();
      RES.forEach((k) => { nc[k] = Math.min(Math.floor((old.charge[k] || 0) / 2), card.cost[k] || 0); });
      pl.discard.push(old.inst);
      pl.device = { inst: a.inst, charge: nc };
      gameLog(game, `${pname(game, a.p)} swaps in the ${card.name}.`);
    } else {
      gameLog(game, `${pname(game, a.p)} plays ${card.name}.`);
      resolveOnPlay(game, a.p, card, targets, a.mode, ev);
      pl.discard.push(a.inst);
    }
  },
  place(game, a, ev) {
    if (game.phase !== "main" || game.active !== a.p) return "Place minions during your turn.";
    if (availableMinions(game, a.p) <= 0) return "No minions left this turn.";
    if (!canWork(game, a.p, a.cell)) return "That contraption can't be worked right now.";
    game.board[a.cell].worker = a.p;
    ev.push({ type: "place", cell: a.cell, p: a.p });
  },
  recall(game, a, ev) {
    const cell = game.board[a.cell];
    if (game.phase !== "main" || game.active !== a.p || !cell || cell.worker !== a.p) return "No minion of yours there.";
    cell.worker = null;
    ev.push({ type: "recall", cell: a.cell });
  },
  recruit(game, a, ev) {
    const pl = game.players[a.p];
    if (game.phase !== "main" || game.active !== a.p) return "Recruit during your turn.";
    if (pl.minions >= minionCap(game, a.p)) return "You're at your minion cap.";
    if (sumRes(pl.res) < cfg("recruitCost")) return `Recruiting costs ${cfg("recruitCost")} resources.`;
    for (let n = cfg("recruitCost"); n > 0; n--) {
      const k = ["E", "O", "M", "S"].sort((x, y) => pl.res[y] - pl.res[x])[0];
      pl.res[pl.res[k] > 0 ? k : "X"]--;
    }
    pl.minions++;
    gameLog(game, `${pname(game, a.p)} recruits a minion.`);
    ev.push({ type: "recruit", p: a.p });
  },
  // MacGuffin Exchange: trade resources (never MacGuffin) for 1 MacGuffin, once per turn.
  exchange(game, a, ev) {
    const pl = game.players[a.p], cost = cfg("exchangeCost"), kinds = ["E", "O", "M", "S"];
    if (game.phase !== "main" || game.active !== a.p) return "Exchange during your build step.";
    if (pl.exchangedTurn === game.turn) return "You can exchange once per turn.";
    if (kinds.reduce((s, k) => s + pl.res[k], 0) < cost) return `The exchange costs ${cost} resources (not MacGuffin).`;
    for (let n = cost; n > 0; n--) pl.res[kinds.slice().sort((x, y) => pl.res[y] - pl.res[x])[0]]--;
    pl.res.X++;
    pl.exchangedTurn = game.turn;
    gameLog(game, `${pname(game, a.p)} trades ${cost} resources for 1 MacGuffin.`);
    ev.push({ type: "exchange", p: a.p });
  },
  burn(game, a, ev) {
    const pl = game.players[a.p], ids = a.insts || [];
    if (game.phase !== "main" || game.active !== a.p) return "Burn cards during your turn.";
    if (ids.length !== cfg("burnCards") || new Set(ids).size !== ids.length || !ids.every((i) => pl.hand.includes(i))) return `Choose ${cfg("burnCards")} cards from your hand.`;
    for (const i of ids) { pl.hand.splice(pl.hand.indexOf(i), 1); pl.discard.push(i); }
    pl.tempMinions++;
    gameLog(game, `${pname(game, a.p)} burns ${ids.length} cards for a temporary minion.`);
    ev.push({ type: "burn", p: a.p });
  },
  scrap(game, a, ev) {
    const cell = game.board[a.cell];
    if (game.phase !== "main" || game.active !== a.p) return "Scrap during your build step.";
    if (!cell || cell.owner !== a.p) return "You can only scrap your own contraptions.";
    game.players[a.p].discard.push(cell.inst);
    game.board[a.cell] = null;
    gameLog(game, `${pname(game, a.p)} scraps ${cardOf(game, cell.inst).name}.`);
    ev.push({ type: "scrap", cell: a.cell });
  },
  collect(game, a, ev) {
    if (game.phase !== "main" || game.active !== a.p) return "Nothing to collect right now.";
    // Each unused minion earns 1 resource of the player's choice.
    const idle = Math.max(0, availableMinions(game, a.p)), pick = a.idle || {};
    if (Object.keys(pick).some((k) => !RES.includes(k) || !(pick[k] >= 0))) return "Unknown resource choice.";
    if (pick.X) return "Idle minions can't gather MacGuffin.";
    const n = RES.reduce((s, k) => s + (pick[k] || 0), 0);
    if (n !== idle) return `Choose ${idle} resource${idle === 1 ? "" : "s"} for your unused minions.`;
    resolveCollect(game, a.p, ev);
    if (n) {
      addRes(game.players[a.p], pick);
      ev.push({ type: "idle", p: a.p, res: pick });
      gameLog(game, `${pname(game, a.p)}'s ${n} idle minion${n === 1 ? "" : "s"} gather ${RES.filter((k) => pick[k]).map((k) => `${pick[k]} ${RES_NAME[k]}`).join(", ")}.`);
    }
    game.phase = "charge";
  },
  charge(game, a, ev) {
    if (game.phase !== "charge" || game.active !== a.p) return "Charge after collecting.";
    const pl = game.players[a.p], need = deviceNeed(game, a.p);
    const keys = a.res ? [a.res] : RES;
    let moved = 0;
    for (const k of keys) {
      const amt = Math.min(pl.res[k], need[k], a.amount === undefined ? Infinity : a.amount);
      if (amt > 0) { pl.res[k] -= amt; pl.device.charge[k] += amt; moved += amt; ev.push({ type: "charge", p: a.p, res: k, amount: amt }); }
    }
    if (!moved) return "Nothing you hold can charge the device.";
  },
  endTurn(game, a, ev) {
    if (game.phase !== "charge" || game.active !== a.p) return "Collect before ending your turn.";
    const pl = game.players[a.p], dis = a.discards || [];
    if (!dis.every((i) => pl.hand.includes(i)) || new Set(dis).size !== dis.length) return "Discard cards from your hand.";
    if (pl.hand.length - dis.length > cfg("handLimit")) return `Discard down to ${cfg("handLimit")} cards.`;
    for (const i of dis) { pl.hand.splice(pl.hand.indexOf(i), 1); pl.discard.push(i); }
    RES.forEach((k) => { pl.res[k] = Math.min(pl.res[k], cfg("carryCap")); });
    game.board.forEach((c) => { if (c) c.worker = null; });
    pl.tempMinions = 0;
    ev.push({ type: "endTurn", p: a.p });
    startTurn(game, rival(a.p), ev);
  },
};

function applyAction(game, action) {
  const h = Actions[action.type];
  if (!h) return { ok: false, error: `Unknown action ${action.type}`, events: [] };
  if (game.phase === "over") return { ok: false, error: "The game is over.", events: [] };
  const events = [];
  const err = h(game, action, events);
  if (err) return { ok: false, error: err, events: [] };
  game.actions.push(action);
  return { ok: true, events };
}

/* ===== js: ai.js ===== */
// AI: a greedy scorer that plays through the same actions as the player. No bluffing in v1.
const AI = {
  weights(game, p) {
    const need = deviceNeed(game, p), w = {};
    RES.forEach((k) => { w[k] = 1 + (need[k] > 0 ? 0.7 : 0) + (k === "X" ? 1.5 : 0); });
    return w;
  },
  val(r, w) { return RES.reduce((a, k) => a + (r[k] || 0) * w[k], 0); },

  setupAction(game, p) {
    const pl = game.players[p];
    if (pl.setup === "device") return { type: "chooseDevice", p, inst: pl.deviceChoices[rngInt(game, pl.deviceChoices.length)] };
    if (pl.setup === "mulligan") {
      const cheap = pl.hand.some((i) => { const c = cardOf(game, i); return c.type === "contraption" && sumRes(c.cost) <= 2; });
      return { type: "mulligan", p, redraw: !cheap };
    }
    return null;
  },

  slotScore(game, p, card, i) {
    let s = rowOf(i) === backRow(p) ? 1 : 0;
    for (const n of neighborsOf(i)) {
      const nc = cellCard(game, n);
      if (!nc) continue;
      if (RES.some((k) => card.produces[k] && nc.produces[k])) s += 0.8;
      const tagCombo = card.effects.some((e) => e.condition && (nc.tags || []).includes(e.condition.adjacentTag))
        || nc.effects.some((e) => e.trigger === "aura" && ((e.params.tag && (card.tags || []).includes(e.params.tag)) || (e.params.owned && game.board[n].owner === p)));
      if (tagCombo) s += 1.2;
      if (card.effects.some((e) => e.action === "gainPerAdjacentOwned") && game.board[n].owner === p) s += 0.8;
    }
    return s;
  },

  // Score every non-placement option; return the best { score, action }.
  bestMain(game, p) {
    const pl = game.players[p], foe = rival(p), w = this.weights(game, p);
    const opts = [];
    const late = Math.max(0.25, 1 - game.turn / 44);
    const foeCells = rivalCells(game, p);
    const cellVal = (i) => sumRes(cellCard(game, i).produces) + (cellCard(game, i).produces.X ? 2 : 0);
    const bestFoe = foeCells.slice().sort((a, b) => cellVal(b) - cellVal(a));
    const myPct = chargePct(game, p), foePct = chargePct(game, foe);
    for (const inst of pl.hand) {
      const c = cardOf(game, inst);
      if (c.type === "doomsday" || !canAfford(pl, c.cost)) continue;
      const costPenalty = sumRes(c.cost) * 0.25;
      if (c.type === "worker" && pl.minions < minionCap(game, p)) {
        const machines = game.board.filter((cell, i) => cell && (cell.owner === p || isPublicRow(rowOf(i)))).length;
        opts.push({ score: machines >= pl.minions ? 5 * late + 1 : 0.8, action: { type: "play", p, inst } });
      }
      if (c.type === "contraption") {
        const slots = game.board.map((_, i) => i).filter((i) => canBuildAt(game, p, i));
        if (!slots.length) {
          // Board full: scrap our weakest machine if this card is clearly better.
          const mine = game.board.map((cell, i) => (cell && cell.owner === p ? i : -1)).filter((i) => i >= 0);
          mine.sort((a, b) => this.val(cellCard(game, a).produces, w) - this.val(cellCard(game, b).produces, w));
          if (mine.length && this.val(c.produces, w) - this.val(cellCard(game, mine[0]).produces, w) >= 1.5)
            opts.push({ score: 2 + this.val(c.produces, w) * 0.5, action: { type: "scrap", p, cell: mine[0] } });
          continue;
        }
        slots.sort((a, b) => this.slotScore(game, p, c, b) - this.slotScore(game, p, c, a));
        const score = this.val(c.produces, w) * 2.4 * late + this.slotScore(game, p, c, slots[0]) - costPenalty;
        opts.push({ score, action: { type: "play", p, inst, cell: slots[0] } });
      }
      if (c.type === "distraction") {
        const acts = c.effects.map((e) => e.action);
        let score = 0, targets = [], mode;
        if (c.modes) {
          if (game.players[foe].res.X >= 1) { mode = "steal"; score = 4 + game.players[foe].res.X; }
          else if (bestFoe.length) { mode = "bounce"; targets = [bestFoe[0]]; score = 3.5; }
        } else if (acts.includes("sabotage")) {
          score = game.players[foe].shield ? 2 : foePct >= 0.3 ? 6 + foePct * 6 : 0;
          targets = bestFoe.slice(0, 1);
        } else if (acts.includes("shield")) {
          score = !pl.shield && myPct > 0.3 ? 5 : pl.hand.length < 3 ? 2 : 0;
        } else if (acts.includes("jam")) {
          if (bestFoe.length) { score = 2.5 + cellVal(bestFoe[0]) * 0.4; targets = [bestFoe[0]]; }
        } else if (acts.includes("steal")) {
          const most = Math.max(...RES.map((k) => game.players[foe].res[k]));
          if (most >= 2) score = 2.5 + most * 0.5;
        } else if (acts.includes("swap")) {
          if (bestFoe.length >= 2) { score = 3; targets = [bestFoe[0], bestFoe[bestFoe.length - 1]]; }
        }
        if (score > 0) opts.push({ score: score - costPenalty, action: { type: "play", p, inst, targets, mode } });
      }
    }
    const work = workableCells(game, p).length, avail = availableMinions(game, p);
    if (pl.minions < minionCap(game, p) && sumRes(pl.res) >= cfg("recruitCost") + 2 && work > avail && game.turn < 30)
      opts.push({ score: 3.5, action: { type: "recruit", p } });
    if (pl.hand.length >= 5 && work > avail && game.turn < 50) {
      const cheap = pl.hand.slice().sort((a, b) => this.keepValue(game, p, a) - this.keepValue(game, p, b)).slice(0, cfg("burnCards"));
      opts.push({ score: 2.2, action: { type: "burn", p, insts: cheap } });
    }
    const nonX = pl.res.E + pl.res.O + pl.res.M + pl.res.S;
    if (deviceNeed(game, p).X > 0 && pl.exchangedTurn !== game.turn && nonX >= cfg("exchangeCost"))
      opts.push({ score: 2 + game.turn / 10, action: { type: "exchange", p } });
    opts.sort((a, b) => b.score - a.score);
    return opts.find((o) => o.score > 1.2) || null;
  },

  bestPlacement(game, p) {
    if (availableMinions(game, p) <= 0) return null;
    const w = this.weights(game, p);
    const worked = new Set(game.board.map((c, i) => (c && c.worker === p ? i : -1)).filter((i) => i >= 0));
    let best = null;
    for (const i of workableCells(game, p)) {
      worked.add(i);
      let v = this.val(cellOutput(game, i, worked).out, w);
      worked.delete(i);
      if (game.board[i].owner !== p) v -= 0.6;
      if (!best || v > best.v) best = { v, i };
    }
    const need = deviceNeed(game, p);
    const idleVal = Math.max(...RES.filter((x) => x !== "X").map((k) => (need[k] > 0 ? w[k] : 1)));
    return best && best.v >= idleVal ? { type: "place", p, cell: best.i } : null;
  },

  // One resource per unused minion: favor what the device still needs most.
  idlePicks(game, p) {
    const need = deviceNeed(game, p), w = this.weights(game, p), pick = {};
    for (let n = availableMinions(game, p); n > 0; n--) {
      const k = RES.filter((x) => x !== "X").sort((a, b) => (need[b] > 0) * w[b] - (need[a] > 0) * w[a] || need[b] - need[a])[0];
      pick[k] = (pick[k] || 0) + 1;
      need[k] = Math.max(0, need[k] - 1);
    }
    return pick;
  },

  keepValue(game, p, inst) {
    const c = cardOf(game, inst);
    if (c.type === "doomsday") return 0;
    if (c.type === "worker") return game.players[p].minions < minionCap(game, p) ? 4 : 0.5;
    if (c.type === "distraction") return 2.5;
    return sumRes(c.produces) + (c.produces.X ? 2 : 0);
  },

  // The next action for p this turn, or null when the turn is over.
  next(game, p, difficulty) {
    if (game.phase === "main") {
      let m = this.bestMain(game, p);
      if (m && difficulty === "easy" && Math.random() < 0.3) m = null;
      if (m) return m.action;
      return this.bestPlacement(game, p) || { type: "collect", p, idle: this.idlePicks(game, p) };
    }
    if (game.phase === "charge") {
      const need = deviceNeed(game, p), pl = game.players[p];
      const reserve = game.turn < 14 ? 3 : 0;
      for (const k of RES) {
        const amt = Math.min(need[k], pl.res[k] - (k === "X" ? 0 : reserve));
        if (amt > 0) return { type: "charge", p, res: k, amount: amt };
      }
      const over = pl.hand.length - cfg("handLimit");
      const discards = over > 0 ? pl.hand.slice().sort((a, b) => this.keepValue(game, p, a) - this.keepValue(game, p, b)).slice(0, over) : [];
      return { type: "endTurn", p, discards };
    }
    return null;
  },
};

/* ===== js: sprites.js ===== */
// Rasterize primitive-shape sprites (src/data/sprites.json) into crisp pixel images, cached as data URLs.
const Sprites = {
  cache: {},
  raster(def) {
    const n = def.size, px = Array.from({ length: n }, () => Array(n).fill(-1));
    const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < n && y < n) px[y][x] = c; };
    const line = (x0, y0, x1, y1, c) => {
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (;;) { set(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    };
    for (const op of def.ops) {
      const [t, ...a] = op;
      if (t === "r") { for (let y = a[1]; y < a[1] + a[3]; y++) for (let x = a[0]; x < a[0] + a[2]; x++) set(x, y, a[4]); }
      else if (t === "p") set(a[0], a[1], a[2]);
      else if (t === "l") line(a[0], a[1], a[2], a[3], a[4]);
      else if (t === "c" || t === "o") {
        const [cx, cy, r, c] = a;
        for (let y = cy - r - 1; y <= cy + r + 1; y++) for (let x = cx - r - 1; x <= cx + r + 1; x++) {
          const d = (x - cx) ** 2 + (y - cy) ** 2;
          if (t === "c" ? d <= r * r + r * 0.6 : d <= r * r + r * 0.6 && d >= (r - 1) * (r - 1) + (r - 1) * 0.6) set(x, y, c);
        }
      } else if (t === "e") {
        const [cx, cy, rx, ry, c] = a;
        for (let y = cy - ry; y <= cy + ry; y++) for (let x = cx - rx; x <= cx + rx; x++)
          if (((x - cx) / (rx + 0.4)) ** 2 + ((y - cy) / (ry + 0.4)) ** 2 <= 1) set(x, y, c);
      } else if (t === "t") {
        const [x1, y1, x2, y2, x3, y3, c] = a;
        const minX = Math.min(x1, x2, x3), maxX = Math.max(x1, x2, x3), minY = Math.min(y1, y2, y3), maxY = Math.max(y1, y2, y3);
        const area = (x2 - x1) * (y3 - y1) - (x3 - x1) * (y2 - y1);
        for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
          const w1 = ((x2 - x) * (y3 - y) - (x3 - x) * (y2 - y)) / area, w2 = ((x3 - x) * (y1 - y) - (x1 - x) * (y3 - y)) / area;
          if (w1 >= -0.02 && w2 >= -0.02 && 1 - w1 - w2 >= -0.02) set(x, y, c);
        }
      }
    }
    // Auto-outline in palette color 0 so every sprite reads at small sizes.
    const out = px.map((r) => r.slice());
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (px[y][x] !== -1) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = (px[y + dy] || [])[x + dx]; return v !== undefined && v > 0; })) out[y][x] = 0;
    }
    return out;
  },
  url(name) {
    if (this.cache[name]) return this.cache[name];
    const def = DATA.sprites.sprites[name];
    if (!def) return "";
    const pal = DATA.sprites.palettes[def.pal], px = this.raster(def), n = def.size;
    const cv = document.createElement("canvas");
    cv.width = n; cv.height = n;
    const ctx = cv.getContext("2d");
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (px[y][x] >= 0) { ctx.fillStyle = pal[px[y][x]]; ctx.fillRect(x, y, 1, 1); }
    return (this.cache[name] = cv.toDataURL());
  },
  img(name, cls = "", alt = "") { return `<img class="px ${cls}" src="${this.url(name)}" alt="${alt}" draggable="false">`; },
};

/* ===== js: audio.js ===== */
// Tiny square-wave sound effects via Web Audio. Silent if unsupported or muted.
const Sound = {
  ctx: null,
  play(kind) {
    if (!appState.settings.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const seq = { click: [[660, 0.04]], play: [[440, 0.05], [660, 0.06]], place: [[330, 0.05]], zap: [[880, 0.03], [1320, 0.05]],
        error: [[220, 0.08], [160, 0.12]], collect: [[523, 0.05], [659, 0.05], [784, 0.07]], hero: [[392, 0.05], [523, 0.05], [392, 0.08]],
        win: [[523, 0.1], [659, 0.1], [784, 0.1], [1046, 0.3]], lose: [[392, 0.15], [330, 0.15], [262, 0.4]], charge: [[294, 0.04], [392, 0.06]] }[kind] || [[440, 0.05]];
      let t = this.ctx.currentTime;
      for (const [f, d] of seq) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.01);
        t += d;
      }
    } catch (e) { /* audio is optional */ }
  },
};

// Persistence: the match autosaves to localStorage after every action; settings save separately.
const Store = {
  KEY: "doomsday95.match", SKEY: "doomsday95.settings",
  saveGame() { try { if (appState.game) localStorage.setItem(this.KEY, JSON.stringify(appState.game)); } catch (e) { /* storage full or blocked */ } },
  loadGame() { try { const s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  clearGame() { try { localStorage.removeItem(this.KEY); } catch (e) { /* ignore */ } },
  hasGame() { const g = this.loadGame(); return !!(g && g.phase !== "over" && g.v === 1); },
  saveSettings() { try { localStorage.setItem(this.SKEY, JSON.stringify(appState.settings)); } catch (e) { /* ignore */ } },
  loadSettings() { try { const s = localStorage.getItem(this.SKEY); if (s) Object.assign(appState.settings, JSON.parse(s)); } catch (e) { /* ignore */ } },
};

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RES_COLOR = { E: "var(--res-E)", O: "var(--res-O)", M: "var(--res-M)", S: "var(--res-S)", X: "var(--res-X)" };
const TYPE_NAME = { contraption: "Contraption", distraction: "Distraction", worker: "Worker", doomsday: "Doomsday device" };
const RARITY_NAME = { common: "Common", uncommon: "Uncommon", rare: "Rare", legendary: "Legendary" };

function resIcon(k) { return Sprites.img("res_" + k, "", RES_NAME[k]); }
function resChips(r, showZero = false) {
  return RES.filter((k) => showZero || r[k]).map((k) => `<span class="rq" title="${RES_NAME[k]}">${resIcon(k)}${r[k] || 0}</span>`).join("");
}
function costPips(cost) {
  const ks = RES.filter((k) => cost[k]);
  if (!ks.length) return `<span class="pip free" title="Free">0</span>`;
  return ks.map((k) => `<span class="pip" style="--pc:${RES_COLOR[k]}" title="${cost[k]} ${RES_NAME[k]}">${cost[k]}</span>`).join("");
}
function costText(cost) {
  const ks = RES.filter((k) => cost[k]);
  return ks.length ? ks.map((k) => `${cost[k]} ${RES_NAME[k]}`).join(", ") : "free";
}

// variant: "full" (hand/inspector), "mini" (small), "plane" (board plane: frame, pips, effects only)
function cardHtml(card, variant = "full") {
  const cls = `card rar-${card.rarity} deck-${card.deck}${variant === "mini" ? " mini" : ""}${variant === "plane" ? " plane-card" : ""}`;
  const out = sumRes(card.produces) ? resChips(card.produces) : "";

    <div class="c-name">${esc(card.name)}</div>

}

function winHtml(title, body, { icon = "icon_skull", cls = "", close = true } = {}) {
  return `<div class="win ${cls}" role="dialog" aria-label="${esc(title)}">
    <div class="titlebar">${Sprites.img(icon)}<span class="ttl">${esc(title)}</span>

    <div class="win-body">${body}</div></div>`;
}

// buttons: [{ label, primary, onClick, keepOpen }]. Returns a close function.
function showDialog(title, body, buttons = [], opts = {}) {
  const layer = $("#dialogs");
  const wrap = document.createElement("div");
  wrap.className = "layer";
  wrap.innerHTML = winHtml(title, `${body}<div class="btn-row">${buttons.map((b, i) => `<button class="btn${b.primary ? " primary" : ""}" data-db="${i}">${esc(b.label)}</button>`).join("")}</div>`,
    { cls: "dialog" + (opts.wide ? " wide" : ""), close: opts.close !== false, icon: opts.icon });
  const close = () => wrap.remove();
  wrap.addEventListener("click", (e) => {
    const b = e.target.closest("[data-db]");
    if (b) { Sound.play("click"); const def = buttons[+b.dataset.db]; if (!def.keepOpen) close(); if (def.onClick) def.onClick(); return; }
    if (e.target.closest("[data-close]")) { close(); if (opts.onClose) opts.onClose(); }
    const h = e.target.closest("[data-pick]");
    if (h && opts.onPick) { opts.onPick(h.dataset.pick, close); }
  });
  layer.appendChild(wrap);
  const first = wrap.querySelector(".btn.primary") || wrap.querySelector(".btn");
  if (first) first.focus({ preventScroll: true });
  return close;
}
function closeDialogs() { $("#dialogs").innerHTML = ""; }

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function errorFeedback(msg, el) {
  Sound.play("error");
  toast(msg);
  const target = el || $(".match .win") || document.body;
  target.classList.remove("shake"); void target.offsetWidth; target.classList.add("shake");
}
