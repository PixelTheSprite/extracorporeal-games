// Match screen rendering. Reads appState.game + appState.ui; input lives in controller.js.
const Match = {
  YOU: 0, FOE: 1,
  myTurn() { const g = appState.game; return g && g.active === 0 && !appState.ui.busy && (g.phase === "main" || g.phase === "charge"); },

  render() {
    const g = appState.game;
    if (!g) return;
    appState.screen = "match";
    const title = `Doomsday.exe: ${g.players[0].short} vs. ${g.players[1].short}`;
    const round = Math.max(1, Math.ceil(g.turn / 2));
    $("#screen").innerHTML = `<div class="match"><div class="win">
      <div class="titlebar">${Sprites.img("icon_skull")}<span class="ttl">${esc(title)}</span><span style="font-weight:normal;font-size:11px;padding-right:4px">Round ${round}</span></div>
      <div class="match-body">
        <div class="side">${this.pbox(1)}${this.pbox(0)}</div>
        <div class="board-wrap sunken"><div class="board" role="grid" aria-label="Board">${[3, 2, 1, 0].map((r) => [0, 1, 2].map((c) => this.cell(r * COLS + c)).join("")).join("")}</div></div>
        <div class="rpanel">${this.inspector()}${this.hand()}</div>
      </div></div></div>`;
    this.taskbar();
  },

  pbox(p) {
    const g = appState.game, pl = g.players[p], dev = deviceCard(g, p), ui = appState.ui;
    const chargeable = p === 0 && g.phase === "charge" && this.myTurn();
    const need = deviceNeed(g, p);
    const meters = dev ? RES.filter((k) => dev.cost[k]).map((k) => {
      const have = pl.device.charge[k], tot = dev.cost[k], can = chargeable && need[k] > 0 && pl.res[k] > 0;
      const inner = `${resIcon(k)}<span class="bar sunken"><i style="width:${(have / tot) * 100}%;--c:${RES_COLOR[k]}"></i></span><span class="num">${have}/${tot}</span>`;
      return can ? `<button class="meter tap${have >= tot ? " done" : ""}" data-act="charge" data-res="${k}" aria-label="Charge ${RES_NAME[k]}" data-meter="${p}${k}">${inner}</button>`
        : `<div class="meter${have >= tot ? " done" : ""}" data-meter="${p}${k}">${inner}</div>`;
    }).join("") : `<div class="meter">Choosing a device</div>`;
    const active = g.active === p && g.phase !== "setup" && g.phase !== "over";
    const minions = active ? `${availableMinions(g, p)} free of ${pl.minions + pl.tempMinions}` : `${pl.minions}`;
    return `<section class="pbox raised${active ? " active" : ""}" data-pbox="${p}" aria-label="${esc(pl.villain)}">
      <header>${Sprites.img(DATA.decks[pl.deck].icon)}<span class="who">${p === 0 ? "You" : "Rival"}: ${esc(pl.short)}</span>
        ${pl.shield ? `<span class="badge shield" title="Blocks the next sabotage">Shield</span>` : ""}
        ${active && p === 1 ? `<span class="badge">Thinking</span>` : ""}</header>
      ${dev ? `<button class="dev" data-act="inspectDev" data-p="${p}">${Sprites.img(dev.sprite)}<span class="dname">${esc(dev.name)}<br><span style="font-weight:normal">${Math.round(chargePct(g, p) * 100)}% charged</span></span></button>` : ""}
      <div class="meters">${meters}</div>
      <div class="resrow" title="Resources">${resChips(pl.res, true)}</div>
      <div class="stats"><span title="Minions">${Sprites.img("minion")} ${minions}</span><span>Hand ${pl.hand.length}</span><span>Deck ${pl.library.length}</span></div>
    </section>`;
  },

  cell(i) {
    const g = appState.game, ui = appState.ui, cell = g.board[i], r = rowOf(i);
    const zone = r === 3 ? "zone-rival" : r === 0 ? "zone-you" : "zone-public";
    const cls = ["cell", zone];
    const mine = this.myTurn() && g.phase === "main";
    if (mine && ui.mode === "build" && canBuildAt(g, 0, i)) cls.push("can-build");
    if (mine && ui.mode === "target" && cell && cell.owner === 1) cls.push(ui.picks.includes(i) ? "picked" : "can-target");
    if (mine && ui.mode === "scrap" && cell && cell.owner === 0) cls.push("can-scrap");
    if (mine && !ui.mode && canWork(g, 0, i) && availableMinions(g, 0) > 0) cls.push("can-work");
    if (!cell) {
      const label = r === 3 ? "Rival lab" : r === 0 ? "Your lab" : "Public Works";
      return `<button class="${cls.join(" ")}" data-cell="${i}" aria-label="${label}, empty"><span class="zlabel">${label}</span></button>`;
    }
    cls.push("filled");
    if (cell.playedTurn === g.turn) cls.push("fresh");
    const card = cardOf(g, cell.inst), own = DATA.decks[g.players[cell.owner].deck].accent;
    const jammed = cell.jamTurn >= g.turn;
    return `<button class="${cls.join(" ")}" data-cell="${i}" aria-label="${esc(card.name)}, ${cell.owner === 0 ? "yours" : "rival's"}${cell.worker !== null ? ", worked" : ""}">
      <div class="plane">${cardHtml(card, "plane")}</div>
      <span class="owner" style="--own:${own}" title="${esc(g.players[cell.owner].short)}"></span>
      <div class="popup" data-pop="${i}">${Sprites.img(card.sprite)}<span class="pname">${esc(card.name)}</span></div>
      <div class="out">${resChips(card.produces)}</div>
      ${cell.worker !== null ? `<img class="px minion" src="${Sprites.url("minion")}" alt="minion">` : ""}
      ${cell.playedTurn === g.turn ? `<span class="fresh-tag">New</span>` : ""}
      ${jammed ? `<span class="stamp">Jammed</span>` : ""}
    </button>`;
  },

  inspector() {
    const g = appState.game, ui = appState.ui, pl = g.players[0];
    let card = null, msg = "", acts = "";
    if (ui.inspect) card = ui.inspect.kind === "hand" || ui.inspect.kind === "card" ? Registry.card(ui.inspect.id) : null;
    if (!card) card = deviceCard(g, 0);
    if (g.phase === "over") msg = `<b>${g.winner === 0 ? "The world is yours." : "The world ended without you."}</b>`;
    else if (g.active !== 0 || ui.busy) msg = `<b>Rival's turn</b><br>${esc(g.players[1].short)} is scheming. Watch the board.`;
    else if (ui.mode === "burn") {
      msg = `<b>Burn cards</b><br>Pick ${cfg("burnCards")} cards to burn for one extra minion this turn.`;
      acts = `<button class="btn primary" data-act="confirmBurn" ${ui.picks.length === cfg("burnCards") ? "" : "disabled"}>Burn ${ui.picks.length}/${cfg("burnCards")}</button><button class="btn" data-act="cancel">Cancel</button>`;
    } else if (ui.mode === "scrap") {
      msg = `<b>Scrap</b><br>Tap one of your machines to scrap it and free the slot.`;
      acts = `<button class="btn" data-act="cancel">Cancel</button>`;
    } else if (ui.mode === "discard") {
      const over = pl.hand.length - cfg("handLimit");
      msg = `<b>Too many cards</b><br>Pick ${over} to discard. Your hand limit is ${cfg("handLimit")}.`;
      acts = `<button class="btn primary" data-act="confirmDiscard" ${ui.picks.length === over ? "" : "disabled"}>Discard and end turn</button><button class="btn" data-act="cancel">Cancel</button>`;
    } else if (ui.selected) {
      const c = cardOf(g, ui.selected), afford = c.type === "doomsday" || canAfford(pl, c.cost);
      msg = `<b>${esc(c.name)}</b><br>${afford || c.type === "doomsday" ? "" : `You can't afford this yet (costs ${costText(c.cost)}). `}`;
      if (afford) {
        if (c.type === "contraption") msg += "Tap a glowing slot in your lab or Public Works.";
        else if (c.modes && !ui.cardMode) { msg += "Choose one:"; acts = `<button class="btn" data-act="cardMode" data-mode="steal">Steal MacGuffin</button><button class="btn" data-act="cardMode" data-mode="bounce">Bounce a machine</button>`; }
        else if (ui.mode === "target") {
          const n = c.target.count, legal = rivalCells(g, 0).length;
          msg += legal ? `Tap ${n === 2 ? "two rival machines" : "a rival machine"} (${ui.picks.length}/${n}).` : "Your rival has no machines to target.";
          if (c.target.optional && !legal) acts = `<button class="btn primary" data-act="playSelected">Play anyway</button>`;
        } else if (c.type === "doomsday") { msg += "Swap this in as your device? It keeps half your current charge."; acts = `<button class="btn primary" data-act="playSelected">Swap device</button>`; }
        else acts = `<button class="btn primary" data-act="playSelected">Play ${esc(c.name)}</button>`;
      }
      acts += `<button class="btn" data-act="cancel">Cancel</button>`;
    } else if (ui.inspect && ui.inspect.kind === "card") {
      msg = `<b>${esc(card.name)}</b><br>${esc(card.rulesText || "")}<br><span class="flavor">${esc(card.flavor || "")}</span>`;
    } else if (g.phase === "main") {
      msg = `<b>Build and place</b><br>Tap a card to play it. Tap a glowing machine to send a minion (${availableMinions(g, 0)} free). Minions you leave unused each gather 1 resource of your choice (not MacGuffin) at Collect.`;
    } else if (g.phase === "charge") {
      msg = `<b>Charge your device</b><br>Move resources into your device, then End turn. Anything over ${cfg("carryCap")} of a kind is lost at end of turn.`;
      const need = deviceNeed(g, 0);
      acts = RES.filter((k) => need[k] > 0 && pl.res[k] > 0).map((k) => `<button class="btn small" data-act="charge" data-res="${k}">${resIcon(k)} Charge ${Math.min(need[k], pl.res[k])}</button>`).join("") || `<span>Nothing you hold fits the device right now.</span>`;
    }
    const log = g.log.slice(-6).reverse().map((l) => `<p>${esc(l.msg)}</p>`).join("");
    return `<section class="inspector raised"><div class="bigcard" data-tilt>${card ? cardHtml(card, "full") : ""}</div>
      <div class="info"><div class="msg" aria-live="polite">${msg}</div><div class="acts">${acts}</div><div class="log sunken" aria-label="Event log">${log}</div></div></section>`;
  },

  hand() {
    const g = appState.game, ui = appState.ui, pl = g.players[0];
    const cards = pl.hand.map((inst) => {
      const c = cardOf(g, inst), cls = ["hcard"];
      if (ui.selected === inst) cls.push("sel");
      if (ui.picks.includes(inst)) cls.push("picked");
      if (c.type !== "doomsday" && !canAfford(pl, c.cost)) cls.push("cant");
      return `<button class="${cls.join(" ")}" data-hand="${inst}" aria-label="${esc(c.name)}">${cardHtml(c, "mini")}</button>`;
    }).join("");
    return `<section class="handbox raised"><span class="legend">Your hand (${pl.hand.length})</span><div class="hand sunken">${cards || `<span class="empty">No cards in hand.</span>`}</div></section>`;
  },

  taskbar() {
    const g = appState.game, mine = this.myTurn(), pl = g.players[0], ui = appState.ui;
    const main = mine && g.phase === "main", charge = mine && g.phase === "charge";
    const label = g.phase === "over" ? "Game over" : !mine ? "Rival's turn" : main ? "Build and place" : "Charge";
    const btns = g.phase === "over" ? `<button class="btn primary" data-act="newGame">New game</button>` : `
      <button class="btn" data-act="recruit" ${main && pl.minions < minionCap(g, 0) && sumRes(pl.res) >= cfg("recruitCost") ? "" : "disabled"}>${Sprites.img("minion")}Recruit (${cfg("recruitCost")})</button>
      <button class="btn" data-act="exchange" title="Trade ${cfg("exchangeCost")} resources for 1 MacGuffin, once per turn" ${main && pl.exchangedTurn !== g.turn && pl.res.E + pl.res.O + pl.res.M + pl.res.S >= cfg("exchangeCost") ? "" : "disabled"}>${resIcon("X")}Exchange (${cfg("exchangeCost")})</button>
      <button class="btn${ui.mode === "burn" ? " on" : ""}" data-act="burnMode" ${main && pl.hand.length >= cfg("burnCards") ? "" : "disabled"}>Burn ${cfg("burnCards")}</button>
      <button class="btn${ui.mode === "scrap" ? " on" : ""}" data-act="scrapMode" ${main && g.board.some((c) => c && c.owner === 0) ? "" : "disabled"}>Scrap</button>
      ${charge ? `<button class="btn" data-act="chargeAll">Charge all</button><button class="btn primary" data-act="endTurn">End turn</button>`
        : `<button class="btn primary" data-act="collect" ${main ? "" : "disabled"}>Collect</button>`}`;
    Desktop.taskbar(`<span class="phase-label">${label}</span>${btns}`);
  },
};

/* ===== js: fx.js ===== */
// Animations driven by engine events, drawn on the #fx overlay after each render.
const Fx = {
  rect(el) { return el ? el.getBoundingClientRect() : null; },
  center(el) { const r = this.rect(el); return r ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null; },
  cellEl(i) { return $(`[data-cell="${i}"]`); },
  boxEl(p) { return $(`[data-pbox="${p}"]`); },
  float(el, html, bad = false, dy = 0) {
    const c = this.center(el);
    if (!c) return;
    const d = document.createElement("div");
    d.className = "float-txt" + (bad ? " bad" : "");
    d.style.left = c.x + "px"; d.style.top = c.y + dy + "px";
    d.innerHTML = html;
    $("#fx").appendChild(d);
    setTimeout(() => d.remove(), 1200);
  },
  zap(a, b) {
    const A = this.center(this.cellEl(a)), B = this.center(this.cellEl(b));
    if (!A || !B) return;
    const pts = [];
    for (let s = 0; s <= 6; s++) {
      const t = s / 6, j = s === 0 || s === 6 ? 0 : (s % 2 ? 6 : -6);
      const nx = -(B.y - A.y), ny = B.x - A.x, len = Math.hypot(nx, ny) || 1;
      pts.push(`${Math.round(A.x + (B.x - A.x) * t + (nx / len) * j)},${Math.round(A.y + (B.y - A.y) * t + (ny / len) * j)}`);
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.innerHTML = `<polyline points="${pts.join(" ")}" fill="none" stroke="#000" stroke-width="7" shape-rendering="crispEdges"/><polyline points="${pts.join(" ")}" fill="none" stroke="#fde047" stroke-width="3" shape-rendering="crispEdges"/>`;
    $("#fx").appendChild(svg);
    if (!appState.settings.reducedMotion) svg.animate([{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0 }], { duration: 700, easing: "steps(4)" });
    setTimeout(() => svg.remove(), 700);
    this.lean(a, b); this.lean(b, a);
  },
  lean(a, b) {
    const pa = $(`[data-pop="${a}"]`), A = this.center(this.cellEl(a)), B = this.center(this.cellEl(b));
    if (!pa || !A || !B) return;
    const cls = Math.abs(B.x - A.x) > Math.abs(B.y - A.y) ? (B.x > A.x ? "lean-r" : "lean-l") : (B.y > A.y ? "lean-d" : "lean-u");
    pa.classList.add(cls);
    setTimeout(() => pa.classList.remove(cls), 700);
  },
  fly(sprite, fromEl, toEl) {
    const A = this.center(fromEl), B = this.center(toEl);
    if (!A || !B || appState.settings.reducedMotion) return;
    const img = document.createElement("img");
    img.className = "px flyer"; img.src = Sprites.url(sprite); img.alt = "";
    $("#fx").appendChild(img);
    const anim = img.animate([{ transform: `translate(${A.x - 28}px, ${A.y - 28}px) scale(.6)` }, { transform: `translate(${(A.x + B.x) / 2 - 28}px, ${Math.min(A.y, B.y) - 70}px) scale(1.4)` },
      { transform: `translate(${B.x - 28}px, ${B.y - 28}px) scale(1)` }], { duration: 520, easing: "steps(10)" });
    anim.onfinish = () => img.remove();
  },
  flash(el) { if (!el) return; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); },

  async run(events) {
    const g = appState.game;
    const produced = events.filter((e) => e.type === "produce");
    if (produced.length) Sound.play("collect");
    for (const e of events) {
      switch (e.type) {
        case "play": {
          const c = cardOf(g, e.inst);
          if (c.type === "contraption") { const el = this.cellEl(e.cell); if (el) el.classList.add("arrive"); Sound.play("play"); }
          else if (c.type === "distraction") {
            Sound.play("hero");
            const to = e.targets && e.targets.length ? this.cellEl(e.targets[0]) : this.boxEl(c.effects.some((x) => x.action === "shield") ? e.p : 1 - e.p);
            this.fly(c.sprite, this.boxEl(e.p), to);
            await wait(380);
          } else Sound.play("play");
          break;
        }
        case "produce": this.float(this.cellEl(e.cell), resChips(e.res)); break;
        case "idle": this.float(this.boxEl(e.p), "Idle: +" + resChips(e.res), false, 20); break;
        case "tax": this.float(this.boxEl(e.p), "+" + resChips(e.res), false, 20); break;
        case "combo": this.zap(e.a, e.b); Sound.play("zap"); await wait(160); break;
        case "jam": this.flash(this.cellEl(e.cell)); break;
        case "swap": this.flash(this.cellEl(e.a)); this.flash(this.cellEl(e.b)); break;
        case "bounce": this.float(this.boxEl(1 - g.active), "Bounced!", true); break;
        case "sabotage": this.flash(this.boxEl(e.p)); this.float(this.boxEl(e.p), `-${e.amount} charge`, true); break;
        case "blocked": this.float(this.boxEl(e.p), "Shield blocked it!"); break;
        case "steal": this.float(this.boxEl(e.to), "Stole " + resChips(e.res)); break;
        case "shield": this.float(this.boxEl(e.p), "Shield up", false, -20); break;
        case "exchange": this.float(this.boxEl(e.p), "+" + resChips({ X: 1 })); Sound.play("charge"); break;
        case "recruit": this.float(this.boxEl(e.p), "+1 minion"); break;
        case "burn": this.float(this.boxEl(e.p), "+1 minion this turn"); break;
        case "deckout": this.float(this.boxEl(e.p), "Deck reshuffled, -1 minion", true); break;
        case "charge": this.flash($(`[data-meter="${e.p}${e.res}"]`)); Sound.play("charge"); break;
        case "place": Sound.play("place"); break;
      }
    }
  },
};

/* ===== js: controller.js ===== */
// Controller: turns taps into engine actions, runs setup dialogs and the AI's turns.
const Game = {
  async apply(action) {
    const g = appState.game;
    const r = applyAction(g, action);
    if (!r.ok) { if (action.p === 0) errorFeedback(r.error); return r; }
    Store.saveGame();
    Match.render();
    await Fx.run(r.events);
    if (g.phase === "over") this.finish();
    return r;
  },

  newMatch(deck) {
    closeDialogs();
    const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
    appState.game = newGame(seed, deck);
    resetUi();
    appState.ui.busy = false;
    Store.saveGame();
    Match.render();
    this.setupFlow();
  },
  continueMatch() {
    const g = Store.loadGame();
    if (!g) return toast("No saved match found.");
    appState.game = g;
    resetUi();
    appState.ui.busy = false;
    Match.render();
    this.setupFlow();
  },

  async setupFlow() {
    const g = appState.game;
    while (g.phase === "setup" && g.players[1].setup !== "ready") await this.apply(AI.setupAction(g, 1));
    if (g.phase === "setup") {
      if (g.players[0].setup === "device") return this.deviceDialog();
      if (g.players[0].setup === "mulligan") return this.mulliganDialog();
    }
    if (g.phase === "bonus") {
      if (rival(g.first) === 1) await this.apply({ type: "bonus", p: 1, res: "E" });
      else return this.bonusDialog();
    }
    if (g.active === 1 && g.phase !== "over") this.aiLoop();
  },
  deviceDialog() {
    const g = appState.game;
    const opts = g.players[0].deviceChoices.map((inst) => {
      const c = cardOf(g, inst);
      return `<div style="display:flex;flex-direction:column;gap:6px;align-items:center;width:150px">
        <div style="--cw:130px;width:130px;height:180px;background:var(--desk2);border-radius:8px">${cardHtml(c, "full")}</div>
        <div style="font-size:11px;text-align:center">Needs ${esc(costText(c.cost))}</div>
        <button class="btn primary" data-pick="${inst}">Choose</button></div>`;
    }).join("");
    showDialog("Choose your doomsday device", `<p>This device sits beside your lab. The other two shuffle into your deck.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${opts}</div>`, [],
      { wide: true, close: false, onPick: async (inst, close) => { close(); await this.apply({ type: "chooseDevice", p: 0, inst }); this.setupFlow(); } });
  },
  mulliganDialog() {
    const g = appState.game, pl = g.players[0];
    const hand = pl.hand.map((i) => `<div style="--cw:84px;width:84px;height:117px;background:var(--desk2);border-radius:7px">${cardHtml(cardOf(g, i), "mini")}</div>`).join("");
    const firstMsg = g.first === 0 ? "You go first." : `${esc(g.players[1].short)} goes first; you'll get 1 bonus resource.`;
    showDialog("Your opening hand", `<p>${firstMsg} Keep this hand, or shuffle it back and draw 5 new cards (once).</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${hand}</div>`,
      [{ label: "Keep hand", primary: true, onClick: async () => { await this.apply({ type: "mulligan", p: 0, redraw: false }); this.setupFlow(); } },
        { label: "Mulligan", onClick: async () => { await this.apply({ type: "mulligan", p: 0, redraw: true }); this.setupFlow(); } }], { close: false });
  },
  bonusDialog() {
    const btns = RES.filter((k) => k !== "X").map((k) => `<button class="btn" data-pick="${k}" style="display:flex;gap:6px;align-items:center">${resIcon(k)}${RES_NAME[k]}</button>`).join("");
    showDialog("Going second", `<p>Take 1 extra resource of your choice (anything but MacGuffin).</p><div style="display:flex;gap:6px;flex-wrap:wrap">${btns}</div>`, [],
      { close: false, onPick: async (res, close) => { close(); await this.apply({ type: "bonus", p: 0, res }); this.setupFlow(); } });
  },

  // Resolves with { res: count } once the player has picked n resources, or null if they go back.
  idleDialog(n) {
    return new Promise((resolve) => {
      const pick = {};
      const kinds = RES.filter((k) => k !== "X");
      const total = () => kinds.reduce((s, k) => s + (pick[k] || 0), 0);
      const body = () => `<p>You have ${n} unused minion${n === 1 ? "" : "s"}. Each one gathers 1 resource of your choice (anything but MacGuffin).</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px">${kinds.map((k) => `<div class="field-row sunken" style="padding:2px 6px;background:var(--face)">
          ${resIcon(k)}<span style="flex:1">${RES_NAME[k]}</span>
          <button class="btn small" data-pick="-${k}" aria-label="One less ${RES_NAME[k]}" ${pick[k] ? "" : "disabled"}>−</button>
          <b style="min-width:14px;text-align:center">${pick[k] || 0}</b>
          <button class="btn small" data-pick="+${k}" aria-label="One more ${RES_NAME[k]}" ${total() < n ? "" : "disabled"}>+</button></div>`).join("")}</div>
        <div class="btn-row"><button class="btn primary" data-pick="ok" ${total() === n ? "" : "disabled"}>Collect (${total()}/${n} chosen)</button><button class="btn" data-pick="back">Back</button></div>`;
      showDialog("Idle minions", `<div id="idle-body" style="display:flex;flex-direction:column;gap:10px">${body()}</div>`, [], {
        close: false, icon: "minion",
        onPick: (v, close) => {
          if (v === "ok") { close(); return resolve(pick); }
          if (v === "back") { close(); return resolve(null); }
          const k = v.slice(1);
          pick[k] = Math.max(0, (pick[k] || 0) + (v[0] === "+" ? 1 : -1));
          Sound.play("click");
          $("#idle-body").innerHTML = body();
        },
      });
    });
  },

  async aiLoop() {
    const g = appState.game;
    if (appState.ui.busy) return;
    appState.ui.busy = true;
    resetUi();
    Match.render();
    while (g.active === 1 && g.phase !== "over" && appState.game === g) {
      await wait(cfg("aiDelayMs"));
      const a = AI.next(g, 1, appState.settings.difficulty);
      if (!a) break;
      const r = await this.apply(a);
      if (!r.ok) { console.error("AI action failed", a, r.error); break; }
    }
    appState.ui.busy = false;
    if (appState.game === g && g.phase !== "over") Match.render();
  },

  finish() {
    const g = appState.game, won = g.winner === 0, dev = deviceCard(g, g.winner);
    Store.clearGame();
    Sound.play(won ? "win" : "lose");
    setTimeout(() => showDialog(won ? "Victory" : "Defeat", `<div class="result-art">${Sprites.img(dev.sprite)}</div>
      <div class="bigwin">${won ? "The world is yours." : `${esc(g.players[g.winner].short)} ended the world.`}</div>
      <p style="text-align:center">${esc(dev.name)} fired after ${Math.ceil(g.turn / 2)} rounds.</p>`,
      [{ label: "Play again", primary: true, onClick: () => Desktop.villainSelect() }, { label: "Back to desktop", onClick: () => Desktop.show() }]), 500);
  },

  // ---- Player input ----
  tapHand(inst) {
    const g = appState.game, ui = appState.ui, c = cardOf(g, inst);
    if (!Match.myTurn() || g.phase === "charge" && ui.mode !== "discard") { ui.inspect = { kind: "card", id: c.id }; return Match.render(); }
    if (ui.mode === "burn" || ui.mode === "discard") {
      const limit = ui.mode === "burn" ? cfg("burnCards") : g.players[0].hand.length - cfg("handLimit");
      if (ui.picks.includes(inst)) ui.picks = ui.picks.filter((x) => x !== inst);
      else if (ui.picks.length < limit) ui.picks.push(inst);
      ui.inspect = { kind: "card", id: c.id };
      Sound.play("click");
      return Match.render();
    }
    if (ui.selected === inst) { resetUi(); return Match.render(); }
    resetUi();
    ui.selected = inst;
    ui.inspect = { kind: "hand", id: c.id };
    const afford = c.type === "doomsday" || canAfford(g.players[0], c.cost);
    if (afford) {
      if (c.type === "contraption") ui.mode = "build";
      else if (c.target && !c.modes) ui.mode = "target";
    }
    Sound.play("click");
    Match.render();
  },
  async tapCell(i) {
    const g = appState.game, ui = appState.ui, cell = g.board[i];
    if (cell) ui.inspect = { kind: "card", id: cardOf(g, cell.inst).id };
    if (!Match.myTurn() || g.phase !== "main") return Match.render();
    if (ui.mode === "build") {
      if (!canBuildAt(g, 0, i)) return errorFeedback("Build in a glowing slot: your lab or Public Works.");
      const r = await this.apply({ type: "play", p: 0, inst: ui.selected, cell: i });
      if (r.ok) { resetUi(); Match.render(); }
      return;
    }
    if (ui.mode === "target") {
      const c = cardOf(g, ui.selected);
      if (!cell || cell.owner !== 1) return errorFeedback("Target a rival machine.");
      ui.picks = ui.picks.includes(i) ? ui.picks.filter((x) => x !== i) : ui.picks.concat(i);
      if (ui.picks.length >= c.target.count) {
        const r = await this.apply({ type: "play", p: 0, inst: ui.selected, targets: ui.picks, mode: ui.cardMode || undefined });
        if (r.ok) { resetUi(); Match.render(); } else { ui.picks = []; Match.render(); }
      } else Match.render();
      return;
    }
    if (ui.mode === "scrap") {
      if (!cell || cell.owner !== 0) return errorFeedback("Tap one of your own machines.");
      const r = await this.apply({ type: "scrap", p: 0, cell: i });
      if (r.ok) { resetUi(); Match.render(); }
      return;
    }
    if (!ui.selected && cell) {
      if (cell.worker === 0) return this.apply({ type: "recall", p: 0, cell: i });
      if (canWork(g, 0, i)) {
        if (availableMinions(g, 0) <= 0) return errorFeedback("No free minions. Recruit, or burn 2 cards.");
        return this.apply({ type: "place", p: 0, cell: i });
      }
      if (cell.playedTurn === g.turn) toast("New machines can be worked next turn.");
      else if (cell.jamTurn >= g.turn) toast("That machine is jammed this turn.");
      else if (cell.worker === null && rowOf(i) === backRow(1)) toast("That's your rival's private lab.");
    }
    Match.render();
  },
  async act(name, el) {
    const g = appState.game, ui = appState.ui;
    switch (name) {
      case "playSelected": { const r = await this.apply({ type: "play", p: 0, inst: ui.selected, targets: ui.picks, mode: ui.cardMode || undefined }); if (r.ok) { resetUi(); Match.render(); } break; }
      case "cardMode": {
        const c = cardOf(g, ui.selected), m = el.dataset.mode;
        ui.cardMode = m;
        if (c.target && c.target.mode === m) { ui.mode = "target"; Match.render(); }
        else { const r = await this.apply({ type: "play", p: 0, inst: ui.selected, mode: m }); if (r.ok) { resetUi(); Match.render(); } }
        break;
      }
      case "cancel": resetUi(); Match.render(); break;
      case "recruit": await this.apply({ type: "recruit", p: 0 }); break;
      case "exchange": await this.apply({ type: "exchange", p: 0 }); break;
      case "burnMode": { const on = ui.mode === "burn"; resetUi(); if (!on) ui.mode = "burn"; Match.render(); break; }
      case "confirmBurn": { const r = await this.apply({ type: "burn", p: 0, insts: ui.picks }); if (r.ok) { resetUi(); Match.render(); } break; }
      case "scrapMode": { const on = ui.mode === "scrap"; resetUi(); if (!on) ui.mode = "scrap"; Match.render(); break; }
      case "collect": {
        const n = availableMinions(g, 0);
        const idle = n > 0 ? await this.idleDialog(n) : {};
        if (!idle) break;
        const r = await this.apply({ type: "collect", p: 0, idle });
        if (r.ok) { resetUi(); Match.render(); }
        break;
      }
      case "charge": await this.apply({ type: "charge", p: 0, res: el.dataset.res }); break;
      case "chargeAll": await this.apply({ type: "charge", p: 0 }); break;
      case "endTurn": {
        if (g.players[0].hand.length > cfg("handLimit")) { resetUi(); ui.mode = "discard"; Match.render(); break; }
        const r = await this.apply({ type: "endTurn", p: 0, discards: [] });
        if (r.ok) this.aiLoop();
        break;
      }
      case "confirmDiscard": { const r = await this.apply({ type: "endTurn", p: 0, discards: ui.picks }); if (r.ok) this.aiLoop(); break; }
      case "inspectDev": { ui.inspect = { kind: "card", id: deviceCard(g, +el.dataset.p).id }; Match.render(); break; }
    }
  },
};

/* ===== js: main.js ===== */
// Startup and global input wiring.
function startApp() {
  if (!Registry.init()) {
    $("#screen").innerHTML = `<div class="layer">${winHtml("Card data error", `<p>The card data didn't pass validation:</p><ul>${Registry.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`, { close: false })}</div>`;
    return;
  }
  Store.loadSettings();
  document.documentElement.classList.toggle("reduced", appState.settings.reducedMotion);
  Desktop.boot();
  setInterval(() => Desktop.tick(), 20000);

  document.addEventListener("click", (e) => {
    const menuBtn = e.target.closest('[data-act="menu"]');
    if (!menuBtn && !e.target.closest(".menu")) Desktop.closeMenu();
    const el = e.target.closest("[data-act], [data-hand], [data-cell]");
    if (!el || e.target.closest(".layer") && !el.dataset.act) return;
    if (el.dataset.hand) { if (!appState.ui.busy) Game.tapHand(el.dataset.hand); return; }
    if (el.dataset.cell !== undefined) { Game.tapCell(+el.dataset.cell); return; }
    const act = el.dataset.act;
    switch (act) {
      case "skipBoot": Desktop.show(); return;
      case "menu": Sound.play("click"); Desktop.menu(); return;
      case "newGame":
        Desktop.closeMenu();
        if (appState.screen === "match" && appState.game && appState.game.phase !== "over")
          showDialog("Start a new game?", "<p>Your current match is saved. Starting a new one replaces it.</p>", [{ label: "New game", primary: true, onClick: () => Desktop.villainSelect() }, { label: "Cancel" }]);
        else Desktop.villainSelect();
        return;
      case "pickDeck": Game.newMatch(el.dataset.deck); return;
      case "continue": Game.continueMatch(); return;
      case "howto": Desktop.closeMenu(); Desktop.howto(); return;
      case "settings": Desktop.closeMenu(); Desktop.settings(); return;
      case "toDesktop": Desktop.closeMenu(); appState.ui.busy = false; appState.game = null; Desktop.show(); return;
    }
    if (!appState.ui.busy && appState.screen === "match") Game.act(act, el);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { Desktop.closeMenu(); if (appState.screen === "match" && !appState.ui.busy) { resetUi(); Match.render(); } }
  });

  // Legendary holo follows the pointer on the inspector card.
  document.addEventListener("pointermove", (e) => {
    const t = e.target.closest("[data-tilt] .card.rar-legendary");
    if (!t) return;
    const r = t.getBoundingClientRect();
    t.classList.add("tilted");
    t.style.setProperty("--hx", ((e.clientX - r.left) / r.width) * 300 + "%");
    t.style.setProperty("--hy", ((e.clientY - r.top) / r.height) * 300 + "%");
  });
}
startApp();
</script>
