// Core pet model: needs, mood, bond, XP, hatching and evolution.
const STAGE_LABELS = ['EGG', 'BABY', 'INFANT', 'TEEN', 'ADULT', 'LEGEND'];
const NEED_KEYS = ['hunger', 'clean', 'energy', 'fun'];

const activePet = () => appState.pets.find(p => p.id === appState.activeId) || null;
const beastOf = (pet) => registry.get('beasts', pet.speciesId);
const statTotal = (pet) => pet.stats.power + pet.stats.speed + pet.stats.charm;
const stageName = (pet) => pet.stage === 0 ? `${beastOf(pet).species} Egg` : beastOf(pet).stages[pet.stage - 1];

function petPalette(pet) {
  const b = beastOf(pet);
  return pet.stage === 5 ? Object.assign({}, b.palette, b.legendPalette) : b.palette;
}

function moodScore(pet) { return NEED_KEYS.reduce((s, k) => s + pet.needs[k], 0) / NEED_KEYS.length; }
function moodInfo(pet) {
  const m = moodScore(pet);
  if (m >= 85) return { label: 'Ecstatic', emoji: '😆', mult: 1.3, score: m };
  if (m >= 60) return { label: 'Happy', emoji: '😊', mult: 1.15, score: m };
  if (m >= 40) return { label: 'Okay', emoji: '🙂', mult: 1, score: m };
  if (m >= 20) return { label: 'Grumpy', emoji: '😠', mult: 0.7, score: m };
  return { label: 'Miserable', emoji: '😢', mult: 0.5, score: m };
}

function evoRequirements(pet) {
  if (pet.stage === 0 || pet.stage >= 5) return null;
  const t = registry.rule('evolve')[pet.stage - 1], need = registry.rule('evolveMood');
  const mood = moodScore(pet);
  const r = {
    stats: { have: statTotal(pet), need: t.stats }, bond: { have: Math.floor(pet.bond), need: t.bond },
    mood: { have: Math.floor(mood), need },
  };
  for (const k in r) r[k].ok = r[k].have >= r[k].need;
  r.ready = r.stats.ok && r.bond.ok && r.mood.ok;
  return r;
}

function clampNeeds(pet) { for (const k of NEED_KEYS) pet.needs[k] = Math.max(0, Math.min(100, pet.needs[k])); }
function changeNeeds(pet, delta) { for (const k in delta) pet.needs[k] += delta[k]; clampNeeds(pet); }

// Real-time decay for every hatched beast in the kennel. dt in seconds.
function tickPets(dt, floor = 0) {
  const rates = registry.rule('decayPerMin');
  for (const pet of appState.pets) {
    if (pet.stage === 0) continue;
    for (const k of NEED_KEYS) {
      const before = pet.needs[k];
      let v = before - rates[k] * dt / 60;
      if (floor && rates[k] > 0) v = Math.max(Math.min(before, floor), v);
      pet.needs[k] = v;
    }
    clampNeeds(pet);
    const rt = appState.rt, low = NEED_KEYS.find(k => pet.needs[k] < 20 && k !== 'energy');
    const key = pet.id + low;
    if (low && !rt.warned[key]) {
      rt.warned[key] = true;
      const what = { hunger: 'is hungry', clean: 'needs a bath', fun: 'is bored' }[low];
      showNotif(`${pet.name} ${what}!`, 'notif-lose');
    }
    for (const k of NEED_KEYS) if (pet.needs[k] > 40) delete rt.warned[pet.id + k];
  }
}

function catchUpOffline() {
  const mins = Math.min(registry.rule('offlineCapMinutes'), (Date.now() - appState.lastTick) / 60000);
  if (mins > 0.2) tickPets(mins * 60, registry.rule('offlineFloor'));
  if (mins > 10 && appState.pets.some(p => p.stage > 0)) showNotif('🌙 Your beasts missed you!', 'notif-level');
  appState.lastTick = Date.now();
}

function addCoins(n) { appState.coins = Math.max(0, appState.coins + n); }

function addXP(pet, n) {
  pet.xp += n;
  let need = pet.level * 20;
  while (pet.xp >= need) {
    pet.xp -= need; pet.level++; addCoins(10);
    showNotif(`🎉 ${pet.name} reached Lv.${pet.level}! +10 coins`, 'notif-level');
    need = pet.level * 20;
  }
}

function addBond(pet, n) {
  pet.bond = Math.min(100, pet.bond + n);
  if (pet.bond >= 100) unlockTrophy('bond100');
}

function unlockTrophy(id) {
  if (appState.trophies[id]) return;
  appState.trophies[id] = true;
  const t = registry.get('trophies', id);
  showNotif(`${t.icon} Trophy: ${t.title}!`, 'notif-evolve');
}

function hatch(pet) {
  pet.stage = 1;
  pet.name = beastOf(pet).stages[0];
  pet.stats = { power: 5, speed: 5, charm: 5 };
  for (const k in beastOf(pet).bias) pet.stats[k] += beastOf(pet).bias[k] * 2;
  pet.needs = { hunger: 70, clean: 90, energy: 90, fun: 70 };
  appState.speciesRaised[pet.speciesId] = true;
  if (registry.all('beasts').every(b => appState.speciesRaised[b.id])) unlockTrophy('collector');
  spawnConfetti(); sfx('hatch');
  showNotif(`🥚 A ${beastOf(pet).species} hatched! Give it a name.`, 'notif-level');
}

function evolve(pet) {
  const req = evoRequirements(pet);
  if (!req || !req.ready) return false;
  const oldName = stageName(pet);
  pet.stage++;
  if (!pet.named) pet.name = stageName(pet);
  spawnConfetti(); sfx('evolve');
  showNotif(`💫 ${oldName} evolved into ${stageName(pet)}!`, 'notif-evolve');
  unlockTrophy('evolve');
  if (pet.stage === 5) unlockTrophy('legend');
  appState.rt.flash = 1.2;
  return true;
}

/* ===== js: room.js ===== */
// The pet's room: canvas render loop, idle wandering, pointer input (tap, rub), particles.
// Mode-specific behaviour lives in MODES (care.js); this file calls their update/draw hooks.
const ROOM_W = 256, ROOM_H = 192, FLOOR = 166, SC = 4;
let roomCtx = null, roomBg = null, lastFrame = 0;

const HEART = ['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'];
const SPARK = ['..X..', '.XXX.', 'XXXXX', '.XXX.', '..X..'];

function initRoom() {
  const cv = document.getElementById('room');
  cv.width = ROOM_W; cv.height = ROOM_H;
  roomCtx = cv.getContext('2d');
  roomCtx.imageSmoothingEnabled = false;
  roomBg = buildRoomBg();
  cv.addEventListener('pointerdown', onRoomDown);
  cv.addEventListener('pointermove', onRoomMove);
  cv.addEventListener('pointerup', onRoomUp);
  cv.addEventListener('pointercancel', onRoomUp);
  cv.addEventListener('pointerleave', () => { appState.rt.rubbing = false; });
  requestAnimationFrame(roomFrame);
}

function buildRoomBg() {
  const c = document.createElement('canvas'); c.width = ROOM_W; c.height = ROOM_H;
  const x = c.getContext('2d');
  x.fillStyle = '#1d1838'; x.fillRect(0, 0, ROOM_W, ROOM_H);
  x.fillStyle = '#231d44'; for (let i = 0; i < ROOM_W; i += 16) x.fillRect(i, 0, 8, 120); // wallpaper stripes
  x.fillStyle = '#2d2552'; x.fillRect(0, 112, ROOM_W, 8);                                 // skirting
  // window with stars
  x.fillStyle = '#3a2f66'; x.fillRect(22, 18, 52, 44);
  x.fillStyle = '#0b0b24'; x.fillRect(26, 22, 44, 36);
  x.fillStyle = '#3a2f66'; x.fillRect(47, 22, 2, 36); x.fillRect(26, 39, 44, 2);
  x.fillStyle = '#fff6b0'; [[31, 27], [58, 31], [37, 48], [64, 50], [53, 26]].forEach(([a, b]) => x.fillRect(a, b, 2, 2));
  x.fillStyle = '#ffe680'; x.fillRect(60, 44, 6, 6); x.fillStyle = '#0b0b24'; x.fillRect(62, 43, 5, 5); // moon
  // shelf with a trophy
  x.fillStyle = '#4a3a7a'; x.fillRect(176, 52, 56, 4);
  x.fillStyle = '#ffd700'; x.fillRect(190, 40, 8, 8); x.fillRect(193, 48, 2, 4);
  x.fillStyle = '#ff3cac'; x.fillRect(210, 42, 10, 10); x.fillStyle = '#7b2fff'; x.fillRect(222, 46, 6, 6);
  // floor planks
  x.fillStyle = '#3b2a4e'; x.fillRect(0, 120, ROOM_W, ROOM_H - 120);
  x.fillStyle = '#33243f'; for (let y = 128; y < ROOM_H; y += 10) x.fillRect(0, y, ROOM_W, 2);
  // rug
  x.fillStyle = '#5a2d6e';
  for (let y = 0; y < 24; y++) { const w = Math.sqrt(1 - ((y - 12) / 12) ** 2) * 90; x.fillRect(128 - w, 148 + y, w * 2, 1); }
  x.fillStyle = '#7b3f8f';
  for (let y = 0; y < 16; y++) { const w = Math.sqrt(1 - ((y - 8) / 8) ** 2) * 66; x.fillRect(128 - w, 152 + y, w * 2, 1); }
  return c;
}

// ---------- input ----------
function roomPoint(e) {
  const r = e.target.getBoundingClientRect();
  return { x: (e.clientX - r.left) * ROOM_W / r.width, y: (e.clientY - r.top) * ROOM_H / r.height };
}

function petDrawPos() {
  const rt = appState.rt, pet = activePet();
  const hopY = rt.hop > 0 ? -Math.sin((rt.hop / 0.45) * Math.PI) * 12 : 0;
  const shake = pet && pet.stage === 0 && rt.hop > 0 ? Math.sin(rt.hop * 60) * 3 : 0;
  return { x: Math.round(rt.petX - 16 * SC + shake), y: Math.round(FLOOR - 31 * SC + hopY) };
}

function hitPet(pt) {
  const pet = activePet(); if (!pet) return false;
  const { x, y } = petDrawPos();
  const grid = getSprite(pet.speciesId, pet.stage);
  const sx0 = Math.floor((pt.x - x) / SC), sy = Math.floor((pt.y - y) / SC);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    let sx = sx0 + dx; if (appState.rt.facing < 0) sx = SPR - 1 - sx;
    const row = grid[sy + dy]; if (row && row[sx]) return true;
  }
  return false;
}

function onRoomDown(e) {
  e.target.setPointerCapture?.(e.pointerId);
  const p = roomPoint(e);
  appState.rt.pointer = { ...p, sx: p.x, sy: p.y, t: performance.now(), moved: 0 };
}

function onRoomMove(e) {
  const rt = appState.rt, ptr = rt.pointer;
  if (!ptr) return;
  const p = roomPoint(e), d = Math.hypot(p.x - ptr.x, p.y - ptr.y);
  ptr.moved += d; ptr.x = p.x; ptr.y = p.y;
  const pet = activePet();
  if (!pet || pet.stage === 0 || ptr.moved < 6) return;
  const m = MODES[rt.mode];
  if (hitPet(p) && m && m.onRub) {
    rt.rubbing = true; rt.rubDist += d;
    if (rt.rubDist > 28) { rt.rubDist = 0; m.onRub(pet, p); }
  } else rt.rubbing = false;
}

function onRoomUp(e) {
  const rt = appState.rt, ptr = rt.pointer;
  rt.pointer = null; rt.rubbing = false;
  if (!ptr || ptr.moved > 8 || performance.now() - ptr.t > 400) return;
  const pet = activePet(); if (!pet) return;
  const p = { x: ptr.x, y: ptr.y }, m = MODES[rt.mode];
  if (m && m.onTap) m.onTap(pet, p, hitPet(p));
}

// ---------- particles ----------
function addParticle(type, x, y, opts = {}) {
  appState.rt.particles.push(Object.assign({ type, x, y, vx: (Math.random() - 0.5) * 20, vy: -30, life: 1, max: 1, color: '#ff5c9a' }, opts));
}

function drawPattern(ctx, pat, x, y, s, color) {
  ctx.fillStyle = color;
  pat.forEach((row, j) => [...row].forEach((c, i) => { if (c === 'X') ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); }));
}

function updateParticles(dt) {
  const ps = appState.rt.particles;
  for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.grav) p.vy += p.grav * dt; }
  appState.rt.particles = ps.filter(p => p.life > 0);
}

function drawParticles(ctx) {
  for (const p of appState.rt.particles) {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
    if (p.type === 'heart') drawPattern(ctx, HEART, p.x, p.y, 2, p.color);
    else if (p.type === 'spark') drawPattern(ctx, SPARK, p.x, p.y, 1, p.color);
    else if (p.type === 'bubble') { ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = 1; ctx.strokeRect(Math.round(p.x), Math.round(p.y), p.size || 5, p.size || 5); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, 1, 1); }
    else if (p.type === 'dot') { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
    else if (p.type === 'text') {
      ctx.font = `${p.size || 8}px "Press Start 2P", monospace`; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(p.text, Math.round(p.x) + 1, Math.round(p.y) + 1);
      ctx.fillStyle = p.color; ctx.fillText(p.text, Math.round(p.x), Math.round(p.y));
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- pet movement helpers (used by modes) ----------
function moveToward(tx, speed, dt) {
  const rt = appState.rt, d = tx - rt.petX;
  if (Math.abs(d) < 1.5) { rt.petX = tx; rt.moving = false; return true; }
  rt.facing = Math.sign(d); rt.moving = true;
  rt.petX += Math.sign(d) * Math.min(Math.abs(d), speed * dt);
  return false;
}

function hopPet() { appState.rt.hop = 0.45; }

// Deterministic dirt specks on body pixels, more as the pet gets dirtier.
const dirtCache = new Map();
function dirtSpots(pet) {
  const key = pet.id + pet.stage;
  if (!dirtCache.has(key)) {
    const g = getSprite(pet.speciesId, pet.stage), cells = [];
    for (let y = 8; y < 28; y++) for (let x = 2; x < 30; x++) if (g[y][x] && g[y][x] !== 'o' && g[y][x] !== 'k') cells.push([x, y]);
    let seed = [...pet.id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
    const out = []; for (let i = 0; i < 12 && cells.length; i++) out.push(cells.splice(Math.floor(rnd() * cells.length), 1)[0]);
    dirtCache.set(key, out);
  }
  return dirtCache.get(key);
}

// ---------- main loop ----------
function roomFrame(ts) {
  const dt = Math.min(0.1, (ts - (lastFrame || ts)) / 1000); lastFrame = ts;
  try { updateRoom(dt); drawRoom(); } catch (e) { console.error(e); }
  requestAnimationFrame(roomFrame);
}

function updateRoom(dt) {
  const rt = appState.rt, pet = activePet();
  rt.modeT += dt; rt.hop = Math.max(0, rt.hop - dt); rt.happyT = Math.max(0, rt.happyT - dt);
  rt.petFatigue = Math.max(0, rt.petFatigue - dt * 0.05);
  rt.blinkT -= dt; if (rt.blinkT < -0.15) rt.blinkT = 2 + Math.random() * 3;
  if (rt.flash) rt.flash = Math.max(0, rt.flash - dt);
  rt.moving = false;
  if (pet) {
    const m = MODES[rt.mode];
    if (m && m.update) m.update(pet, dt);
  }
  if (rt.moving) { rt.walkT = (rt.walkT || 0) + dt; if (rt.walkT > 0.16) { rt.walkT = 0; rt.walkFrame ^= 1; } }
  updateParticles(dt);
}

function petPose(pet) {
  const rt = appState.rt;
  if (rt.poseOverride) return rt.poseOverride;
  if (rt.happyT > 0 || rt.rubbing) return 'happy';
  if (rt.moving) return rt.walkFrame ? 'walk' : 'idle';
  if (rt.blinkT < 0) return 'blink';
  return moodScore(pet) < 25 && Math.floor(rt.modeT * 2) % 6 === 0 ? 'blink' : 'idle';
}

function drawRoom() {
  const ctx = roomCtx, rt = appState.rt, pet = activePet();
  const m = MODES[rt.mode];
  if (m && m.drawBg) m.drawBg(ctx); else ctx.drawImage(roomBg, 0, 0);
  if (!pet) { drawParticles(ctx); return; }
  if (m && m.drawBehind) m.drawBehind(ctx, pet);
  const pos = petDrawPos();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  const sw = pet.stage === 0 ? 30 : 22 + pet.stage * 6;
  ctx.fillRect(Math.round(rt.petX - sw), FLOOR + 2, sw * 2, 3);
  // legend aura
  if (pet.stage === 5) {
    const r = 70 + Math.sin(performance.now() / 300) * 6;
    const g = ctx.createRadialGradient(rt.petX, FLOOR - 60, 10, rt.petX, FLOOR - 60, r);
    g.addColorStop(0, 'rgba(255,230,120,0.35)'); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.fillRect(rt.petX - r, FLOOR - 60 - r, r * 2, r * 2);
  }
  const breathe = !rt.moving && rt.hop === 0 && Math.floor(performance.now() / 600) % 2 ? 1 : 0;
  const grid = getSprite(pet.speciesId, pet.stage, pet.stage === 0 ? 'idle' : petPose(pet));
  const pal = petPalette(pet), flip = rt.facing < 0;
  drawGrid(ctx, grid, pal, pos.x, pos.y + breathe, SC, flip);
  if (pet.stage === 0) drawEggCracks(ctx, pet, pos);
  else if (pet.needs.clean < 70) {
    const n = Math.min(12, Math.floor((70 - pet.needs.clean) / 6) + 1);
    ctx.fillStyle = '#5b3a1e';
    dirtSpots(pet).slice(0, n).forEach(([x, y]) => ctx.fillRect(pos.x + (flip ? SPR - 1 - x : x) * SC, pos.y + breathe + y * SC, SC, SC));
    if (pet.needs.clean < 25 && Math.random() < 0.05) addParticle('dot', rt.petX + (Math.random() - 0.5) * 40, pos.y + 40, { color: '#8a9a3a', vy: -15, life: 1 });
  }
  if (m && m.drawFront) m.drawFront(ctx, pet);
  drawParticles(ctx);
  if (rt.flash) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, rt.flash)})`; ctx.fillRect(0, 0, ROOM_W, ROOM_H); }
}

function drawEggCracks(ctx, pet, pos) {
  const prog = pet.hatchClicks / registry.rule('hatchClicks');
  const pts = [[16, 10], [14, 13], [17, 15], [13, 18], [16, 20], [12, 23], [15, 26]];
  const n = Math.floor(prog * pts.length);
  ctx.fillStyle = '#1a0a12';
  for (let i = 0; i < n; i++) {
    const [x, y] = pts[i];
    ctx.fillRect(pos.x + x * SC, pos.y + y * SC, SC, SC); ctx.fillRect(pos.x + (x + 1) * SC, pos.y + (y + 1) * SC, SC, SC);
  }
}

/* ===== js: care.js ===== */
// Care actions and room modes (idle, eat, bath, sleep, fetch, walk).
// Each mode: { update(pet, dt), onTap(pet, pt, onPet), onRub(pet, pt), drawBg/drawBehind/drawFront(ctx, pet) }.

function setMode(mode, data = {}) {
  const rt = appState.rt;
  rt.mode = mode; rt.modeT = 0; rt.modeData = data; rt.poseOverride = null;
  renderActions();
}
function endMode() { setMode('idle'); renderAll(); autosave(); }
const busy = () => appState.rt.mode !== 'idle';

function textPop(text, color = '#ffea00', x) {
  addParticle('text', x ?? appState.rt.petX, FLOOR - 120, { text, color, vx: 0, vy: -18, life: 1.4, max: 1.4 });
}

const MODES = {
  idle: {
    update(pet, dt) {
      const rt = appState.rt;
      if (pet.stage === 0) { rt.petX = 128; return; }
      if (rt.rubbing) return;
      if (rt.callX != null) { if (moveToward(rt.callX, 70, dt)) { rt.callX = null; rt.happyT = 0.6; } return; }
      rt.idleT = (rt.idleT ?? 2) - dt;
      if (rt.idleT <= 0) {
        rt.idleT = 2 + Math.random() * 4;
        const energetic = pet.needs.energy > 30;
        rt.targetX = energetic ? 50 + Math.random() * 156 : rt.petX;
      }
      moveToward(rt.targetX, pet.needs.energy > 30 ? 28 : 12, dt);
      // grumpy beasts show it
      if (moodScore(pet) < 30 && Math.random() < dt * 0.3) addParticle('text', rt.petX + 30, FLOOR - 110, { text: '💢', color: '#fff', vy: -8, vx: 0, life: 1.2, max: 1.2, size: 10 });
    },
    onTap(pet, pt, onPet) {
      const rt = appState.rt;
      if (pet.stage === 0) { if (onPet) hatchClick(pet); return; }
      if (onPet) {
        hopPet(); rt.happyT = 0.6; sfx('tap');
        addParticle('heart', rt.petX - 4, FLOOR - 110, { life: 0.9, max: 0.9 });
      } else { rt.callX = Math.max(40, Math.min(216, pt.x)); textPop('!', '#fff', rt.petX + 20); sfx('tap'); }
    },
    onRub(pet, pt) {
      const rt = appState.rt, gain = 1 / (1 + rt.petFatigue);
      addBond(pet, 0.5 * gain); changeNeeds(pet, { fun: 2 * gain });
      rt.petFatigue += 0.12; rt.happyT = 0.5;
      rt.facing = pt.x > rt.petX ? 1 : -1;
      addParticle('heart', pt.x - 5, pt.y - 10, { vy: -40, life: 0.9, max: 0.9, color: gain > 0.5 ? '#ff5c9a' : '#c890a8' });
      if (Math.random() < 0.5) sfx('pet');
      renderLive();
    },
  },

  eat: {
    update(pet, dt) {
      const rt = appState.rt, d = rt.modeData;
      if (!d.arrived) { d.arrived = moveToward(d.spot, 40, dt); return; }
      rt.facing = d.bowlX > rt.petX ? 1 : -1;
      d.t = (d.t || 0) + dt;
      rt.poseOverride = Math.floor(d.t * 5) % 2 ? 'blink' : 'happy';
      if (Math.random() < dt * 8) addParticle('dot', d.bowlX + (Math.random() - 0.5) * 10, FLOOR - 8, { color: '#e8c070', vy: -30, grav: 120, life: 0.6 });
      if (d.t > 0.15 && !d.sound) { d.sound = 1; sfx('eat'); }
      if (d.t > 2) {
        const f = d.food, fav = beastOf(pet).favoriteFood === f.id;
        changeNeeds(pet, { hunger: f.hunger, fun: f.fun + (fav ? 8 : 0) });
        addBond(pet, f.bond * (fav ? 3 : 1)); addXP(pet, 1);
        textPop(fav ? 'YUM!! ♥' : 'Yum!', fav ? '#ff5c9a' : '#ffea00');
        if (fav) { sfx('happy'); hopPet(); showNotif(`${f.icon} ${pet.name} LOVES ${f.name}!`, 'notif-win'); }
        endMode();
      }
    },
    drawFront(ctx) {
      const d = appState.rt.modeData, x = Math.round(d.bowlX);
      ctx.fillStyle = '#2a1a3a'; ctx.fillRect(x - 13, FLOOR - 9, 26, 11);
      ctx.fillStyle = '#ff3cac'; ctx.fillRect(x - 12, FLOOR - 8, 24, 9);
      ctx.fillStyle = '#ff8acb'; ctx.fillRect(x - 12, FLOOR - 8, 24, 2);
      if ((d.t || 0) < 1.8) { ctx.fillStyle = '#e8c070'; ctx.fillRect(x - 9, FLOOR - 12, 18, 4); ctx.fillStyle = '#b8803a'; ctx.fillRect(x - 6, FLOOR - 13, 4, 2); ctx.fillRect(x + 2, FLOOR - 12, 4, 2); }
    },
  },

  bath: {
    update(pet, dt) {
      const rt = appState.rt;
      moveToward(128, 50, dt);
      if (Math.random() < dt * 3) addParticle('bubble', 70 + Math.random() * 116, FLOOR - 4, { vy: -20, vx: 0, life: 1.2, max: 1.2, size: 3 });
      if (pet.needs.clean >= 100 && !rt.modeData.done) {
        rt.modeData.done = true;
        addBond(pet, 2); addXP(pet, 2); changeNeeds(pet, { fun: 3 });
        sfx('splash'); hopPet(); textPop('SPARKLY!', '#7ee8ff');
        for (let i = 0; i < 8; i++) addParticle('spark', 90 + Math.random() * 76, FLOOR - 40 - Math.random() * 70, { color: '#fff', vy: -10, life: 0.9, max: 0.9 });
        showNotif(`🛁 ${pet.name} is squeaky clean!`, 'notif-level');
        setTimeout(() => { if (appState.rt.mode === 'bath') endMode(); }, 900);
      }
    },
    onRub(pet, pt) {
      changeNeeds(pet, { clean: 4 });
      for (let i = 0; i < 3; i++) addParticle('bubble', pt.x + (Math.random() - 0.5) * 16, pt.y + (Math.random() - 0.5) * 10, { vy: -25 - Math.random() * 20, life: 0.9, max: 0.9, size: 3 + Math.floor(Math.random() * 4) });
      if (Math.random() < 0.4) sfx('bubble');
      renderLive();
    },
    onTap(pet, pt, onPet) { if (onPet) this.onRub(pet, pt); },
    drawFront(ctx) {
      ctx.fillStyle = 'rgba(126,232,255,0.45)'; ctx.fillRect(48, FLOOR - 14, 160, 22);
      ctx.fillStyle = '#e8e8ff'; ctx.fillRect(44, FLOOR - 16, 168, 3); ctx.fillRect(44, FLOOR - 16, 4, 26); ctx.fillRect(208, FLOOR - 16, 4, 26);
      ctx.fillStyle = '#bff4ff'; for (let i = 0; i < 9; i++) ctx.fillRect(56 + i * 17, FLOOR - 15 + (i % 2), 6, 2);
    },
  },

  sleep: {
    update(pet, dt) {
      const rt = appState.rt;
      rt.poseOverride = 'sleep';
      changeNeeds(pet, { energy: 7 * dt });
      rt.modeData.z = (rt.modeData.z || 0) + dt;
      if (rt.modeData.z > 0.7) { rt.modeData.z = 0; addParticle('text', rt.petX + 30, FLOOR - 90, { text: 'z', color: '#bfb8ff', vx: 8, vy: -16, life: 1.6, max: 1.6 }); }
      if (rt.modeT > registry.rule('napSeconds')) { showNotif(`😴 ${pet.name} feels rested!`, 'notif-level'); addBond(pet, 0.5); endMode(); }
    },
    onTap() { textPop('shh...', '#bfb8ff'); },
    drawBehind(ctx) { ctx.fillStyle = 'rgba(5,5,25,0.55)'; ctx.fillRect(0, 0, ROOM_W, ROOM_H); },
  },

  fetch: {
    update(pet, dt) {
      const rt = appState.rt, d = rt.modeData;
      const speed = Math.min(170, 60 + pet.stats.speed * 0.5);
      if (d.phase === 'aim') {
        moveToward(44, 60, dt); if (!rt.moving) rt.facing = 1;
        d.needle += d.dir * dt * (1.1 + d.throws * 0.25);
        if (d.needle > 1) { d.needle = 1; d.dir = -1; } if (d.needle < 0) { d.needle = 0; d.dir = 1; }
      } else if (d.phase === 'fly') {
        d.t += dt / 0.9;
        const b = d.ball, k = Math.min(1, d.t);
        b.x = b.x0 + (b.x1 - b.x0) * k; b.y = FLOOR - 40 - Math.sin(k * Math.PI) * 60 + k * 34;
        const arrived = moveToward(b.x1 - 20, speed, dt);
        if (d.perfect && arrived && k > 0.75 && !d.caught) { d.caught = true; hopPet(); rt.happyT = 0.8; }
        if (k >= 1) {
          if (d.perfect || d.caught) { d.caught = true; hopPet(); }
          else sfx('tap');
          d.phase = 'chase';
        }
      } else if (d.phase === 'chase') {
        if (moveToward(d.ball.x1 - 20, speed, dt)) { d.caught = true; d.phase = 'return'; }
      } else if (d.phase === 'return') {
        if (moveToward(44, speed * 0.8, dt)) {
          rt.facing = 1; d.throws++;
          changeNeeds(pet, { energy: -registry.rule('fetchEnergy'), hunger: -2 });
          if (d.perfect) {
            changeNeeds(pet, { fun: 10 }); addBond(pet, 2); pet.stats.speed++; addXP(pet, 3);
            appState.perfectCatches++; if (appState.perfectCatches >= 5) unlockTrophy('perfect5');
            textPop('PERFECT! +1 SPD', '#7ee8ff'); sfx('happy');
          } else { changeNeeds(pet, { fun: 6 }); addBond(pet, 0.8); addXP(pet, 2); textPop('Good catch!', '#ffea00'); sfx('coin'); }
          renderLive();
          if (d.throws >= 3 || pet.needs.energy < registry.rule('fetchEnergy')) { showNotif(`🎾 Fetch over! ${pet.name} had a blast.`, 'notif-level'); endMode(); return; }
          Object.assign(d, newThrow(d.throws));
        }
      }
    },
    onTap(pet) { fetchThrow(pet); },
    drawFront(ctx) {
      const d = appState.rt.modeData, rt = appState.rt;
      // power meter
      const mx = 48, my = 10, mw = 160;
      ctx.fillStyle = '#0a0a14'; ctx.fillRect(mx - 2, my - 2, mw + 4, 12);
      ctx.fillStyle = '#2a2a4a'; ctx.fillRect(mx, my, mw, 8);
      ctx.fillStyle = '#00ff88'; ctx.fillRect(mx + d.zone[0] * mw, my, (d.zone[1] - d.zone[0]) * mw, 8);
      ctx.fillStyle = '#fff'; ctx.fillRect(mx + d.needle * mw - 1, my - 3, 3, 14);
      ctx.font = '6px "Press Start 2P", monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#e8e8ff';
      ctx.fillText(`THROW ${d.throws + 1}/3`, mx, my + 20);
      // ball
      let bx, by;
      if (d.phase === 'aim') { bx = rt.petX + 22; by = FLOOR - 50; }
      else if (d.caught) { bx = rt.petX + 30 * rt.facing; by = petDrawPos().y + 60; }
      else { bx = d.ball.x; by = d.ball.y; }
      ctx.fillStyle = '#1a3a00'; ctx.fillRect(bx - 4, by - 3, 8, 6); ctx.fillRect(bx - 3, by - 4, 6, 8);
      ctx.fillStyle = '#c8ff3c'; ctx.fillRect(bx - 3, by - 2, 6, 4); ctx.fillRect(bx - 2, by - 3, 4, 6);
      ctx.fillStyle = '#fff'; ctx.fillRect(bx - 2, by - 2, 1, 1);
    },
  },

  walk: {
    update(pet, dt) {
      const rt = appState.rt, d = rt.modeData;
      rt.petX = 100; rt.facing = 1; rt.moving = true;
      d.scroll += dt * 40;
      for (const ev of d.events) if (!ev.done && rt.modeT > ev.at) { ev.done = true; walkFind(pet); }
      if (rt.modeT > 7) {
        changeNeeds(pet, { fun: 20, hunger: -8, clean: -12 }); addBond(pet, 3); addXP(pet, 4);
        showNotif(`🌳 Great walk! ${pet.name} got a little muddy.`, 'notif-level');
        rt.petX = 128; endMode();
      }
    },
    onTap(pet, pt, onPet) { if (onPet) { hopPet(); appState.rt.happyT = 0.5; } },
    drawBg(ctx) {
      const s = appState.rt.modeData.scroll;
      ctx.fillStyle = '#ffb56b'; ctx.fillRect(0, 0, ROOM_W, ROOM_H);
      ctx.fillStyle = '#ff8a6a'; ctx.fillRect(0, 50, ROOM_W, 40);
      ctx.fillStyle = '#ffe680'; ctx.fillRect(196, 24, 18, 18);
      ctx.fillStyle = '#7b4fa8';
      for (let x = 0; x < ROOM_W; x += 2) { const h = 30 + Math.sin((x + s * 0.3) / 26) * 12; ctx.fillRect(x, 120 - h, 2, h); }
      ctx.fillStyle = '#3f8f5a'; ctx.fillRect(0, 120, ROOM_W, 72);
      ctx.fillStyle = '#2f7048';
      for (let x = -((s) % 24); x < ROOM_W; x += 24) ctx.fillRect(x, 140, 10, 2);
      for (let x = -((s * 1.2) % 90); x < ROOM_W + 30; x += 90) { // trees
        ctx.fillStyle = '#5a3a1e'; ctx.fillRect(x + 10, 92, 6, 30);
        ctx.fillStyle = '#2f7048'; ctx.fillRect(x, 72, 26, 24); ctx.fillStyle = '#3f8f5a'; ctx.fillRect(x + 3, 70, 16, 10);
      }
      ctx.fillStyle = '#c8a46a'; ctx.fillRect(0, FLOOR - 4, ROOM_W, 10);
    },
  },
};

// ---------- actions (buttons) ----------
function hatchClick(pet) {
  pet.hatchClicks++; hopPet(); sfx('tap');
  for (let i = 0; i < 4; i++) addParticle('spark', 108 + Math.random() * 40, FLOOR - 60 - Math.random() * 40, { color: ['#ffea00', '#ff3cac', '#7b2fff'][i % 3], life: 0.7, max: 0.7 });
  if (pet.hatchClicks >= registry.rule('hatchClicks')) { hatch(pet); appState.rt.flash = 1; }
  renderAll(); autosave();
}

function feedPet(foodId) {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  if (!(appState.inventory[foodId] > 0)) return showNotif('Out of that food! Visit the shop.', 'notif-lose');
  if (pet.needs.hunger > 95) { textPop('Full!', '#fff'); return showNotif(`${pet.name} isn't hungry right now.`, ''); }
  appState.inventory[foodId]--;
  document.getElementById('foodTray').classList.remove('open');
  const rt = appState.rt, side = rt.petX < 128 ? 1 : -1, bowlX = rt.petX + 60 * side;
  setMode('eat', { food: registry.get('foods', foodId), bowlX, spot: bowlX - 34 * side });
}

function startBath() {
  const pet = activePet(); if (!pet || pet.stage === 0) return;
  if (appState.rt.mode === 'bath') return endMode();
  if (busy()) return;
  if (pet.needs.clean >= 100) return showNotif(`${pet.name} is already spotless!`, '');
  setMode('bath'); showNotif('🛁 Rub your beast to scrub it clean!', 'notif-level');
}

function startNap() {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  if (pet.needs.energy > 92) return showNotif(`${pet.name} isn't sleepy.`, '');
  setMode('sleep');
}

function newThrow(throws) {
  const w = Math.max(0.1, 0.2 - throws * 0.04), z = 0.15 + Math.random() * (0.8 - w);
  return { phase: 'aim', needle: 0, dir: 1, zone: [z, z + w], perfect: false, caught: false, t: 0, ball: {} };
}

function startFetch() {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  if (pet.needs.energy < registry.rule('fetchEnergy')) return showNotif(`${pet.name} is too tired. Try a nap!`, 'notif-lose');
  setMode('fetch', Object.assign({ throws: 0 }, newThrow(0)));
}

function fetchThrow(pet) {
  const d = appState.rt.modeData;
  if (appState.rt.mode !== 'fetch' || d.phase !== 'aim') return;
  d.perfect = d.needle >= d.zone[0] && d.needle <= d.zone[1];
  d.phase = 'fly'; d.t = 0; sfx('throw');
  d.ball = { x0: appState.rt.petX + 22, x1: 70 + d.needle * 170, x: 0, y: 0 };
  void pet;
}

function startWalk() {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  if (pet.needs.energy < registry.rule('walkEnergy')) return showNotif(`${pet.name} is too tired to walk.`, 'notif-lose');
  changeNeeds(pet, { energy: -registry.rule('walkEnergy') });
  setMode('walk', { scroll: 0, events: [{ at: 2.2 }, { at: 4.8 }] });
}

function walkFind(pet) {
  const r = Math.random(), rt = appState.rt;
  if (r < 0.5) {
    const n = 3 + Math.floor(Math.random() * 6); addCoins(n); sfx('coin');
    textPop(`+${n} 🪙`, '#ffd700', rt.petX + 40);
  } else if (r < 0.8) {
    const id = Math.random() < 0.5 ? beastOf(pet).favoriteFood : 'beast_bites', f = registry.get('foods', id);
    appState.inventory[id] = (appState.inventory[id] || 0) + 1; sfx('coin');
    textPop(`Found ${f.icon}!`, '#00ff88', rt.petX + 40);
  } else {
    changeNeeds(pet, { fun: 8 }); addBond(pet, 1); hopPet(); sfx('happy');
    textPop('Made a friend!', '#ff5c9a', rt.petX + 40);
  }
  renderLive();
}

/* ===== js: training.js ===== */
// Stat training. Costs energy; gains scale with level, species bias and mood.
const STAT_COLORS = { power: '#ff6b35', speed: '#00f5ff', charm: '#ff3cac' };
const STAT_SHORT = { power: 'POW', speed: 'SPD', charm: 'CHM' };

function trainStat(stat) {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  const cost = registry.rule('trainEnergy');
  if (pet.needs.energy < cost) return showNotif(`${pet.name} is too tired to train. Nap first!`, 'notif-lose');
  if (pet.needs.hunger < 10) return showNotif(`${pet.name} is too hungry to train!`, 'notif-lose');
  const bias = beastOf(pet).bias[stat] || 0, mood = moodInfo(pet);
  const gain = Math.max(1, Math.round((1 + Math.floor(pet.level / 3) + (bias >= 2 ? 1 : 0)) * mood.mult));
  pet.stats[stat] += gain;
  changeNeeds(pet, { energy: -cost, hunger: -4, fun: stat === 'charm' ? 2 : -1 });
  addXP(pet, 3); addCoins(1);
  hopPet(); sfx('tap');
  textPop(`+${gain} ${STAT_SHORT[stat]}`, STAT_COLORS[stat]);
  for (let i = 0; i < 5; i++) addParticle('spark', appState.rt.petX + (Math.random() - 0.5) * 60, FLOOR - 30 - Math.random() * 60, { color: STAT_COLORS[stat], life: 0.8, max: 0.8 });
  renderAll(); autosave();
}

/* ===== js: contests.js ===== */
// Contests against rival beasts, rendered with the same sprite engine.
function rivalFor(pet) {
  const rivals = registry.all('rivals'), r = rivals[Math.floor(Math.random() * rivals.length)];
  const stage = Math.max(1, Math.min(5, pet.stage + Math.floor(Math.random() * 3) - 1));
  const scale = 0.35 + pet.stage * 0.4 + Math.random() * 0.5;
  return { name: r.name, species: r.species, stage, power: Math.floor(r.power * scale), speed: Math.floor(r.speed * scale), charm: Math.floor(r.charm * scale) };
}

function startContest(contestId) {
  const pet = activePet(); if (!pet || pet.stage === 0 || busy()) return;
  const contest = registry.get('contests', contestId);
  if (pet.stage < contest.minStage) return;
  const fee = registry.rule('contestEntry'), en = registry.rule('contestEnergy');
  if (appState.coins < fee) return showNotif('🪙 Not enough coins! Train or walk to earn more.', 'notif-lose');
  if (pet.needs.energy < en) return showNotif(`${pet.name} is too tired to compete.`, 'notif-lose');
  addCoins(-fee); changeNeeds(pet, { energy: -en, hunger: -5 });

  const opp = rivalFor(pet), mood = moodInfo(pet), log = [];
  let myScore, oppScore;
  if (contest.stat === 'all') {
    myScore = statTotal(pet); oppScore = opp.power + opp.speed + opp.charm;
    log.push(`📊 Combined stats: ${pet.name} <span class="hl">${myScore}</span> vs ${opp.name} <span class="hl-bad">${oppScore}</span>`);
  } else {
    myScore = pet.stats[contest.stat]; oppScore = opp[contest.stat];
    log.push(`${contest.icon} ${contest.stat.toUpperCase()}: ${pet.name} <span class="hl">${myScore}</span> vs ${opp.name} <span class="hl-bad">${oppScore}</span>`);
  }
  if (contest.stat === 'charm' && pet.bond > 0) {
    const b = Math.round(pet.bond * 0.3); myScore += b;
    log.push(`💞 The judges adore your bond: <span class="hl-good">+${b}</span>`);
  }
  if (mood.mult !== 1) log.push(`${mood.emoji} ${pet.name} is ${mood.label.toLowerCase()}: rolls ×${mood.mult}`);
  let myTotal = myScore, oppTotal = oppScore;
  for (let r = 1; r <= 3; r++) {
    const myRoll = (Math.random() * 20 + myScore * 0.15) * mood.mult, oppRoll = Math.random() * 20 + oppScore * 0.15;
    myTotal += myRoll; oppTotal += oppRoll;
    const w = myRoll > oppRoll ? `<span class="hl-good">${pet.name}</span>` : `<span class="hl-bad">${opp.name}</span>`;
    log.push(`Round ${r}: ${pet.name} <span class="hl">${myRoll.toFixed(0)}</span> · ${opp.name} <span class="hl-bad">${oppRoll.toFixed(0)}</span> → ${w} takes it!`);
  }
  const draw = Math.abs(myTotal - oppTotal) < 5, won = !draw && myTotal > oppTotal;
  const result = won ? 'win' : draw ? 'draw' : 'lose';
  if (won) {
    appState.wins++; pet.wins++; addCoins(contest.reward); addXP(pet, 10); addBond(pet, 2); changeNeeds(pet, { fun: 15 });
    log.push(`🏆 <span class="hl-good">${pet.name} WINS!</span> +${contest.reward} coins`);
    unlockTrophy('win_' + contest.id);
    if (appState.wins >= 10) unlockTrophy('wins10');
  } else if (draw) {
    addCoins(3); addXP(pet, 5); log.push('🤝 A draw! +3 coins');
  } else {
    appState.losses++; addCoins(2); addXP(pet, 5); changeNeeds(pet, { fun: -5 });
    log.push(`💔 <span class="hl-bad">${pet.name} lost...</span> +2 coins for trying`);
  }
  appState.history.unshift({ contest: contest.name, result, opp: opp.name, oppSpecies: opp.species, oppStage: opp.stage, pet: pet.name });
  appState.history.length = Math.min(appState.history.length, 20);
  openArena(contest, pet, opp, { my: myTotal, opp: oppTotal }, result, log);
  renderAll(); autosave();
}

function openArena(contest, pet, opp, scores, result, log) {
  document.getElementById('arenaTitle').textContent = `${contest.icon} ${contest.name}`;
  const cls = (me) => result === 'draw' ? '' : (result === 'win') === me ? 'winner' : 'loser';
  const oppPal = registry.get('beasts', opp.species);
  const oppPalette = opp.stage === 5 ? Object.assign({}, oppPal.palette, oppPal.legendPalette) : oppPal.palette;
  document.getElementById('arenaFighters').innerHTML = `
    <div class="fighter-card ${cls(true)}">
      <img class="fighter-sprite" src="${spriteURL(pet.speciesId, pet.stage, petPalette(pet), 3)}" alt="">
      <div class="fighter-name">${esc(pet.name)}</div>
      <div class="fighter-score">${scores.my.toFixed(0)}</div>
    </div>
    <div class="vs-label">VS</div>
    <div class="fighter-card ${cls(false)}">
      <img class="fighter-sprite flip" src="${spriteURL(opp.species, opp.stage, oppPalette, 3)}" alt="">
      <div class="fighter-name">${esc(opp.name)}</div>
      <div class="fighter-score">${scores.opp.toFixed(0)}</div>
    </div>`;
  const res = {
    win: ['result-win', '🏆 VICTORY! 🏆', 'Your beast dominated the competition!'],
    draw: ['result-draw', '🤝 DRAW!', 'An incredibly close contest!'],
    lose: ['result-lose', '💔 DEFEAT', 'Train harder and try again!'],
  }[result];
  document.getElementById('arenaResult').innerHTML = `<div class="result-text ${res[0]}">${res[1]}</div><div class="result-desc">${res[2]}</div>`;
  document.getElementById('arenaLog').innerHTML = log.map(l => `<div class="log-entry">${l}</div>`).join('');
  closeMenu();
  document.getElementById('arenaOverlay').classList.add('active');
  if (result === 'win') { spawnConfetti(); sfx('win'); } else if (result === 'lose') sfx('sad');
}

function closeArena() { document.getElementById('arenaOverlay').classList.remove('active'); }

// Kennel (multi-pet), egg chooser, shop and rename.
function selectPet(id) {
  if (busy()) return showNotif('Finish the current activity first!', '');
  appState.activeId = id;
  Object.assign(appState.rt, { petX: 128, targetX: 128, callX: null, particles: [] });
  renderAll(); autosave();
}

// mode: 'start' (free, first beast) or 'buy' (costs eggPrice)
function openEggChooser(mode) {
  const price = registry.rule('eggPrice');
  if (mode === 'buy') {
    if (appState.pets.length >= registry.rule('kennelSize')) return showNotif('🏠 Your kennel is full!', 'notif-lose');
    if (appState.coins < price) return showNotif(`🪙 An egg costs ${price} coins.`, 'notif-lose');
  }
  document.getElementById('eggTitle').textContent = mode === 'start' ? '✦ CHOOSE YOUR FIRST EGG ✦' : `✦ ADOPT AN EGG · 🪙 ${price} ✦`;
  document.getElementById('eggCloseBtn').style.display = mode === 'start' ? 'none' : '';
  document.getElementById('eggGrid').innerHTML = registry.all('beasts').map(b => `
    <button class="egg-card" onclick="chooseEgg('${b.id}','${mode}')">
      <img src="${spriteURL(b.id, 0, b.palette, 2)}" alt="">
      <div class="egg-species">${b.species}</div>
      <div class="egg-element">${b.element} · grows into ${b.stages[4]}</div>
      <div class="egg-hint">"${b.eggHint}"</div>
    </button>`).join('');
  document.getElementById('eggOverlay').classList.add('active');
}

function closeEggChooser() { document.getElementById('eggOverlay').classList.remove('active'); }

function chooseEgg(speciesId, mode) {
  if (mode === 'buy') addCoins(-registry.rule('eggPrice'));
  const pet = makePet(speciesId);
  appState.pets.push(pet);
  closeEggChooser(); sfx('coin');
  showNotif(`🥚 A ${registry.get('beasts', speciesId).species} egg! Tap it to hatch.`, 'notif-level');
  selectPet(pet.id);
}

function buyFood(id) {
  const f = registry.get('foods', id);
  if (appState.coins < f.price) return showNotif('🪙 Not enough coins!', 'notif-lose');
  addCoins(-f.price); appState.inventory[id] = (appState.inventory[id] || 0) + 1;
  sfx('coin'); renderAll(); autosave();
}

function renamePet() {
  const pet = activePet(), inp = document.getElementById('nameInput'), val = inp.value.trim();
  if (!pet || !val) return;
  pet.name = val.slice(0, 15); pet.named = true; inp.value = '';
  renderAll(); autosave();
}

function releasePet() {
  const pet = activePet();
  if (!pet || busy() || appState.pets.length < 2) return;
  if (!confirm(`Release ${pet.name} into the wild? This can't be undone.`)) return;
  appState.pets = appState.pets.filter(p => p.id !== pet.id);
  showNotif(`🌄 ${pet.name} set off on its own adventure.`, '');
  selectPet(appState.pets[0].id);
}

// DOM rendering for every panel. renderAll() after actions; renderLive() every second (cheap).
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const urlCache = new Map();
const SILHOUETTE = new Proxy({}, { get: () => '#5a4a8a' });
function spriteURL(speciesId, stage, pal, scale = 2) {
  const key = `${speciesId}|${stage}|${scale}|${pal.b}|${pal.a}`;
  if (!urlCache.has(key)) {
    const c = document.createElement('canvas'); c.width = c.height = SPR * scale;
    drawGrid(c.getContext('2d'), getSprite(speciesId, stage), pal, 0, 0, scale);
    urlCache.set(key, c.toDataURL());
  }
  return urlCache.get(key);
}

function bar(label, cls, val, max, right) {
  return `<div class="stat-row ${cls}"><div class="stat-label"><span>${label}</span><span>${right ?? Math.floor(val)}</span></div>
    <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100, (val / max) * 100)}%"></div></div></div>`;
}

function renderAll() {
  renderHeader(); renderKennel(); renderActions(); renderContests(); renderShop();
  renderTrophies(); renderHistory(); renderLeaderboard(); renderLive();
}

function renderLive() { renderNeeds(); renderStats(); renderEvo(); $('coinDisplay').textContent = appState.coins; $('sideCoins').textContent = appState.coins; renderKennelMoods(); }

function renderHeader() {
  const pet = activePet();
  $('petNameDisplay').textContent = !pet ? '—' : pet.stage === 0 ? '???' : pet.name;
  $('petStageBadge').textContent = !pet ? 'NO BEAST' : `${STAGE_LABELS[pet.stage]} · ${stageName(pet)}`;
  const egg = !pet || pet.stage === 0;
  $('hatchSection').style.display = egg ? 'block' : 'none';
  $('petControls').style.display = egg ? 'none' : 'block';
  if (pet && egg) {
    const need = registry.rule('hatchClicks');
    $('hatchProgress').textContent = `TAPS: ${pet.hatchClicks} / ${need}`;
    $('hatchBar').style.width = `${(pet.hatchClicks / need) * 100}%`;
    $('hatchHint').textContent = beastOf(pet).eggHint;
  }
}

function renderKennel() {
  const size = registry.rule('kennelSize'), slots = [];
  for (const p of appState.pets) {
    const pal = petPalette(p);
    slots.push(`<button class="kennel-slot ${p.id === appState.activeId ? 'active' : ''}" onclick="selectPet('${p.id}')" title="${esc(p.name)}">
      <img src="${spriteURL(p.speciesId, p.stage, pal, 2)}" alt="">
      <span class="kennel-name">${esc(p.stage === 0 ? 'Egg' : p.name)}</span>
      <span class="kennel-mood" data-pet="${p.id}"></span></button>`);
  }
  if (appState.pets.length < size) slots.push(`<button class="kennel-slot empty" onclick="openEggChooser('buy')" title="Adopt an egg"><span class="kennel-plus">＋</span><span class="kennel-name">🪙 ${registry.rule('eggPrice')}</span></button>`);
  $('kennelList').innerHTML = slots.join('');
  $('kennelCount').textContent = `${appState.pets.length}/${size}`;
}

function renderKennelMoods() {
  document.querySelectorAll('.kennel-mood').forEach(el => {
    const p = appState.pets.find(x => x.id === el.dataset.pet);
    el.textContent = p && p.stage > 0 ? moodInfo(p).emoji : '🥚';
  });
}

function renderNeeds() {
  const pet = activePet(), el = $('needsPanel');
  if (!pet || pet.stage === 0) { el.innerHTML = '<div class="dim-note">Hatch your egg to start caring for it!</div>'; return; }
  const m = moodInfo(pet), n = pet.needs;
  el.innerHTML = `
    <div class="mood-line"><span class="mood-emoji">${m.emoji}</span><span>${m.label}</span><span class="mood-mult">train ×${m.mult}</span></div>
    ${bar('🍖 Fullness', 'need need-hunger' + (n.hunger < 20 ? ' low' : ''), n.hunger, 100)}
    ${bar('🫧 Clean', 'need need-clean' + (n.clean < 20 ? ' low' : ''), n.clean, 100)}
    ${bar('⚡ Energy', 'need need-energy' + (n.energy < 15 ? ' low' : ''), n.energy, 100)}
    ${bar('🎈 Fun', 'need need-fun' + (n.fun < 20 ? ' low' : ''), n.fun, 100)}
    ${bar('💞 Bond', 'need need-bond', pet.bond, 100, `${Math.floor(pet.bond)}/100`)}`;

function renderStats() {
  const pet = activePet(), el = $('statsSection');
  if (!pet || pet.stage === 0) { el.innerHTML = '<div class="dim-note">No stats yet.</div>'; return; }
  const max = registry.rule('statBarMax'), need = pet.level * 20;
  el.innerHTML = `${bar('⚡ Power', 'stat-power', pet.stats.power, max)}${bar('💨 Speed', 'stat-speed', pet.stats.speed, max)}${bar('✨ Charm', 'stat-charm', pet.stats.charm, max)}
    <div class="xp-section"><div class="xp-label"><span>Lv.${pet.level} XP</span><span>${pet.xp} / ${need}</span></div>
    <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${(pet.xp / need) * 100}%"></div></div></div>`;
}

function renderEvo() {
  const pet = activePet(), el = $('evoPanel');
  if (!pet || pet.stage === 0) { el.innerHTML = ''; return; }
  if (pet.stage === 5) { el.innerHTML = `<div class="evo-box legend">🔥 ${esc(pet.name)} has reached its LEGEND form! 🔥</div>`; return; }
  const r = evoRequirements(pet), next = beastOf(pet).stages[pet.stage];
  const row = (ok, label, have, need) => `<div class="evo-req ${ok ? 'ok' : ''}"><span>${ok ? '✔' : '✘'} ${label}</span><span>${have} / ${need}</span></div>`;
  el.innerHTML = `<div class="evo-box ${r.ready ? 'ready' : ''}">
    <div class="evo-title">NEXT: <img class="evo-silhouette" src="${spriteURL(pet.speciesId, pet.stage + 1, SILHOUETTE, 1)}" alt=""> ${r.ready ? next.toUpperCase() : '???'}</div>
    ${row(r.stats.ok, '📊 Total stats', r.stats.have, r.stats.need)}
    ${row(r.bond.ok, '💞 Bond', r.bond.have, r.bond.need)}
    ${row(r.mood.ok, '😊 Mood', r.mood.have, r.mood.need)}
    ${r.ready ? `<button class="btn btn-primary btn-full evo-btn" onclick="doEvolve()">💫 EVOLVE!</button>` : ''}</div>`;
}

function doEvolve() { const pet = activePet(); if (pet && !busy() && evolve(pet)) { renderAll(); autosave(); } }

function renderActions() {
  const pet = activePet(), rt = appState.rt, mode = rt.mode, idle = mode === 'idle';
  const set = (id, dis) => { const b = $(id); if (b) b.disabled = dis; };
  ['btnFeed', 'btnFetch', 'btnWalk', 'btnNap', 'btnPower', 'btnSpeed', 'btnCharm', 'btnRelease'].forEach(id => set(id, !idle));
  set('btnBath', !(idle || mode === 'bath'));
  set('btnRelease', !idle || appState.pets.length < 2);
  $('btnBath').innerHTML = mode === 'bath' ? '✅ DONE' : '🛁 BATHE';
  const hints = {
    idle: pet && pet.stage === 0 ? 'Tap the egg to warm it up!' : 'Rub to pet · Tap to play · Tap the floor to call',
    eat: 'Munch munch...', bath: 'Rub your beast to scrub away the dirt!', sleep: 'Sweet dreams...',
    fetch: 'Tap when the needle is in the GREEN zone!', walk: 'Out for a walk... keep an eye out for treasure!',
  };
  $('roomHint').textContent = hints[mode] || '';
  $('throwBtn').style.display = mode === 'fetch' ? '' : 'none';
  if (!idle) $('foodTray').classList.remove('open');
  renderFoodTray();
  if (pet) {
    const cost = registry.rule('trainEnergy');
    ['power', 'speed', 'charm'].forEach(s => { const b = $('btn' + s[0].toUpperCase() + s.slice(1)); if (b) b.title = `Costs ${cost} energy`; });
  }
}

function toggleFoodTray() { if (!busy()) { $('foodTray').classList.toggle('open'); renderFoodTray(); } }

function renderFoodTray() {
  const pet = activePet(), fav = pet ? beastOf(pet).favoriteFood : null;
  const owned = registry.all('foods').filter(f => appState.inventory[f.id] > 0);
  $('foodTray').innerHTML = owned.length ? owned.map(f => `
    <button class="food-btn ${f.id === fav ? 'fav' : ''}" onclick="feedPet('${f.id}')" title="${f.name}${f.id === fav ? ' (favorite!)' : ''}">
      <span class="food-icon">${f.icon}</span><span class="food-count">×${appState.inventory[f.id]}</span></button>`).join('')
    : '<div class="dim-note">No food! <button class="link-btn" onclick="openMenu(\'shop\')">Visit the shop →</button></div>';
}

function renderContests() {
  const pet = activePet(), sec = $('contestSection');
  if (!pet || pet.stage === 0) { sec.innerHTML = '<div class="dim-note">Hatch your beast first!</div>'; return; }
  const fee = registry.rule('contestEntry'), en = registry.rule('contestEnergy');
  sec.innerHTML = registry.all('contests').map(c => {
    const locked = pet.stage < c.minStage;
    return `<div class="contest-card ${locked ? 'locked' : ''}" ${locked ? '' : `onclick="startContest('${c.id}')"`} role="button" tabindex="${locked ? -1 : 0}">
      <div class="contest-name">${c.icon} ${c.name}</div>
      <div class="contest-desc">${c.desc}</div>
      <div class="contest-meta">
        <span class="contest-tag ${c.tag}">${c.stat === 'all' ? 'ALL STATS' : c.stat.toUpperCase()}</span>
        <span class="contest-tag tag-gold">🪙${fee} ⚡${en}</span>
        <span class="contest-tag tag-win">WIN ${c.reward}</span>
        ${locked ? `<span class="contest-tag tag-lock">${STAGE_LABELS[c.minStage]}+</span>` : ''}
      </div></div>`;
  }).join('');
}

function renderShop() {
  const pet = activePet(), fav = pet && pet.stage > 0 ? beastOf(pet).favoriteFood : null;
  $('shopList').innerHTML = registry.all('foods').map(f => `
    <div class="shop-row ${f.id === fav ? 'fav' : ''}">
      <span class="shop-icon">${f.icon}</span>
      <span class="shop-name">${f.name}${f.id === fav ? ' <em>♥ fav</em>' : ''}<small>+${f.hunger} full${f.fun ? ` · +${f.fun} fun` : ''}</small></span>
      <span class="shop-own">×${appState.inventory[f.id] || 0}</span>
      <button class="btn btn-gold shop-buy" onclick="buyFood('${f.id}')" ${appState.coins < f.price ? 'disabled' : ''}>🪙${f.price}</button>
    </div>`).join('');
}

function renderTrophies() {
  $('trophyRow').innerHTML = registry.all('trophies').map(t =>
    `<div class="trophy-item ${appState.trophies[t.id] ? '' : 'dim'}" title="${t.title}">${t.icon}</div>`).join('');
}

function renderHistory() {
  const list = $('historyList');
  if (!appState.history.length) { list.innerHTML = '<div class="dim-note">No contests yet...</div>'; return; }
  list.innerHTML = appState.history.map(h => {
    const b = registry.all('beasts').find(x => x.id === h.oppSpecies);
    return `<div class="history-entry">
      ${b ? `<img class="mini-sprite" src="${spriteURL(b.id, h.oppStage || 1, b.palette, 1)}" alt="">` : ''}
      <span style="flex:1">${esc(h.pet || '')} · ${h.contest} vs ${esc(h.opp)}</span>
      <span class="history-result hr-${h.result}">${h.result.toUpperCase()}</span></div>`;
  }).join('');
}

function renderLeaderboard() {
  const fixed = [['Zephyr', 'griffin', 5, 620, 24], ['Aurora', 'kitsune', 4, 470, 17], ['Titan', 'griffin', 4, 360, 12], ['Lumis', 'phoenix', 3, 240, 7], ['Blaze', 'dragon', 2, 120, 3]];
  const entries = fixed.map(([name, sp, st, score, wins]) => ({ name, sp, st, score, wins, pal: registry.get('beasts', sp).palette }));
  for (const p of appState.pets.filter(p => p.stage > 0))
    entries.push({ name: p.name, sp: p.speciesId, st: p.stage, score: statTotal(p) + p.wins * 10 + Math.floor(p.bond), wins: p.wins, pal: petPalette(p), mine: true });
  entries.sort((a, b) => b.score - a.score);
  $('leaderboard').innerHTML = entries.slice(0, 7).map((e, i) => `
    <div class="lb-row ${e.mine ? 'mine' : ''}">
      <span class="lb-rank r${i}">${i + 1}</span>
      <img class="mini-sprite" src="${spriteURL(e.sp, e.st, e.pal, 1)}" alt="">
      <span class="lb-name">${esc(e.name)}${e.mine ? ' ◀' : ''}</span>
      <span>⚔️${e.wins}</span><span class="lb-score">${e.score}</span></div>`).join('');
}

// ---------- sidebar menu ----------
let menuPage = 'kennel';
function openMenu(page) {
  if (page) menuPage = page;
  showPage(menuPage);
  $('sideMenu').classList.add('open'); $('sideScrim').classList.add('open');
  $('sideMenu').setAttribute('aria-hidden', 'false'); $('menuBtn').setAttribute('aria-expanded', 'true');
  document.querySelector(`.side-tab[data-page="${menuPage}"]`).focus();
}
function closeMenu() {
  $('sideMenu').classList.remove('open'); $('sideScrim').classList.remove('open');
  $('sideMenu').setAttribute('aria-hidden', 'true'); $('menuBtn').setAttribute('aria-expanded', 'false');
}
function showPage(page) {
  menuPage = page;
  document.querySelectorAll('.side-tab').forEach(t => { const on = t.dataset.page === page; t.classList.toggle('active', on); t.setAttribute('aria-selected', on); });
  document.querySelectorAll('.side-page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
}

/* ===== js: main.js ===== */
// Boot: validate data, load autosave, wire controls, start loops.
function newGame() {
  if (appState.pets.length && !confirm('Start a brand-new kennel? Your current beasts will be lost (export a save first if you want to keep them).')) return;
  newGameState(); autosave(); renderAll(); openEggChooser('start'); setStatus('🔄 New kennel started');
}

function toggleMute() {
  appState.muted = !appState.muted;
  $('muteBtn').textContent = appState.muted ? '🔇' : '🔊';
  autosave();
}

function boot() {
  registry.validate();
  resetRuntime();
  const loaded = loadAutosave();
  if (!loaded) newGameState();
  catchUpOffline();
  $('muteBtn').textContent = appState.muted ? '🔇' : '🔊';
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') renamePet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMenu(); closeArena(); if (appState.pets.length) closeEggChooser(); }
    if (e.key === ' ' && appState.rt.mode === 'fetch' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); fetchThrow(activePet()); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('contest-card')) { e.preventDefault(); e.target.click(); }
  });
  initRoom();
  renderAll();
  if (!appState.pets.length) openEggChooser('start');
  setStatus(loaded ? '✓ Welcome back! Autosave is on' : '✓ Autosave is on');
  // real-time needs
  setInterval(() => {
    const now = Date.now(), dt = (now - appState.lastTick) / 1000;
    appState.lastTick = now;
    tickPets(dt);
    renderLive();
  }, 1000);
  setInterval(autosave, 5000);
  window.addEventListener('beforeunload', autosave);
}

boot();
</script>
</body>
