<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WACKY PETS: Mythic Beast Kennel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ===== css: base.css ===== */
  :root {
    --bg: #0a0a14;
    --panel: #12121f;
    --panel2: #1a1a2e;
    --border: #2a2a4a;
    --accent: #ff3cac;
    --accent2: #7b2fff;
    --accent3: #00f5ff;
    --accent4: #ffea00;
    --gold: #ffd700;
    --text: #e8e8ff;
    --text-dim: #8888aa;
    --success: #00ff88;
    --danger: #ff4444;
    --power-color: #ff6b35;
    --speed-color: #00f5ff;
    --charm-color: #ff3cac;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(123,47,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,60,172,0.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px);
  }

  /* Scanline effect */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  .title-bar {
    text-align: center;
    padding: 20px;
    border-bottom: 2px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .title-bar::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(123,47,255,0.1), rgba(255,60,172,0.1), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .title-bar h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 24px);
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(255,60,172,0.5));
    letter-spacing: 4px;
  }
  .title-bar p {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .main-layout {
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent2), var(--accent), transparent);
    opacity: 0.6;
  }

  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--accent3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* PET DISPLAY */
  .pet-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 10px;
  }

  .pet-viewport {
    width: 200px;
    height: 200px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: var(--panel2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .pet-viewport:hover { border-color: var(--accent2); }
  .pet-viewport::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 110%, rgba(123,47,255,0.15) 0%, transparent 70%);
  }

  .pet-sprite {
    font-size: 80px;
    line-height: 1;
    animation: float 3s ease-in-out infinite;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 8px 20px rgba(123,47,255,0.4));
    transition: transform 0.1s;
    user-select: none;
  }
  .pet-sprite.bounce {
    animation: bigbounce 0.4s ease-out;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }
  @keyframes bigbounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.3) rotate(-5deg); }
    60% { transform: scale(0.9) rotate(3deg); }
    100% { transform: scale(1); }
  }
  @keyframes hatch-shake {
    0%,100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg) scale(1.05); }
    40% { transform: rotate(8deg) scale(1.05); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(6deg); }
  }
  .pet-sprite.hatching { animation: hatch-shake 0.4s ease-in-out; }

  .pet-name-display {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--accent);
    text-align: center;
    text-shadow: 0 0 10px currentColor;
  }
  .pet-stage-badge {
    font-size: 10px;
    color: var(--text-dim);
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Particles */
  .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: particle-rise 1s ease-out forwards;
    opacity: 0;
  }
  @keyframes particle-rise {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.2); }
  }

  /* STATS */
  .stat-row {
    margin-bottom: 10px;
  }
  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .stat-bar-track {
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }
  .stat-bar-fill::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    animation: bar-shine 2s linear infinite;
  }
  @keyframes bar-shine { from{transform:translateX(-100%)} to{transform:translateX(200%)} }

  .stat-power .stat-bar-fill { background: linear-gradient(90deg, var(--power-color), #ffaa00); }
  .stat-speed .stat-bar-fill { background: linear-gradient(90deg, #0088cc, var(--speed-color)); }
  .stat-charm .stat-bar-fill { background: linear-gradient(90deg, var(--accent2), var(--charm-color)); }

  .stat-power .stat-label span:first-child { color: var(--power-color); }
  .stat-speed .stat-label span:first-child { color: var(--speed-color); }
  .stat-charm .stat-label span:first-child { color: var(--charm-color); }

  /* BUTTONS */
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.95); }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .btn:hover::before { opacity: 1; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,60,172,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 30px rgba(255,60,172,0.5); transform: translateY(-1px); }

  .btn-power {
    background: linear-gradient(135deg, #c45000, var(--power-color));
    color: #fff;
    box-shadow: 0 4px 15px rgba(255,107,53,0.3);
  }
  .btn-speed {
    background: linear-gradient(135deg, #0066aa, var(--speed-color));
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,245,255,0.2);
  }
  .btn-charm {
    background: linear-gradient(135deg, var(--accent2), var(--charm-color));
    color: #fff;
    box-shadow: 0 4px 15px rgba(255,60,172,0.3);
  }
  .btn-gold {
    background: linear-gradient(135deg, #a07000, var(--gold));
    color: #0a0a14;
    box-shadow: 0 4px 20px rgba(255,215,0,0.3);
  }
  .btn-gold:hover { box-shadow: 0 6px 30px rgba(255,215,0,0.5); transform: translateY(-1px); }

  .btn-outline {
    background: transparent;
    color: var(--text-dim);
    border-color: var(--border);
  }
  .btn-outline:hover { border-color: var(--accent3); color: var(--accent3); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-full { grid-column: 1 / -1; width: 100%; justify-content: center; }

  /* XP BAR */
  .xp-section { margin-bottom: 14px; }
  .xp-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .xp-bar-track {
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .xp-bar-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 10px rgba(0,245,255,0.4);
  }

  /* EGG HATCH */
  .hatch-section {
    text-align: center;
    padding: 20px;
  }
  .hatch-instruction {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .hatch-progress {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--accent4);
    margin-bottom: 8px;
  }

  /* CONTEST */
  .contest-section { }
  .contest-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .contest-card:hover {
    border-color: var(--accent);
    transform: translateX(4px);
  }
  .contest-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .contest-card:hover::before { opacity: 1; }
  .contest-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .contest-desc {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .contest-meta {
    display: flex;
    gap: 8px;
    font-size: 10px;
  }
  .contest-tag {
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid;
  }
  .tag-power { color: var(--power-color); border-color: var(--power-color); background: rgba(255,107,53,0.1); }
  .tag-speed { color: var(--speed-color); border-color: var(--speed-color); background: rgba(0,245,255,0.1); }
  .tag-charm { color: var(--charm-color); border-color: var(--charm-color); background: rgba(255,60,172,0.1); }
  .tag-all { color: var(--accent4); border-color: var(--accent4); background: rgba(255,234,0,0.1); }

  /* BATTLE/CONTEST ARENA */
  .arena-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .arena-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .arena-box {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 20px;
    padding: 28px;
    width: min(600px, 95vw);
    box-shadow: 0 0 60px rgba(255,60,172,0.3), 0 0 120px rgba(123,47,255,0.2);
    position: relative;
    transform: scale(0.8);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .arena-overlay.active .arena-box { transform: scale(1); }

  .arena-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    text-align: center;
    color: var(--accent4);
    margin-bottom: 20px;
    text-shadow: 0 0 20px currentColor;
    letter-spacing: 3px;
  }

  .arena-fighters {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: center;
    margin-bottom: 20px;
  }
  .fighter-card {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .fighter-card.winner { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
  .fighter-card.loser { border-color: var(--danger); opacity: 0.7; }
  .fighter-emoji { font-size: 50px; display: block; margin-bottom: 8px; }
  .fighter-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .fighter-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--accent3);
  }

  .vs-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--accent);
    text-align: center;
    text-shadow: 0 0 20px currentColor;
    animation: pulse-vs 1s ease-in-out infinite;
  }
  @keyframes pulse-vs {
    0%,100%{transform:scale(1)} 50%{transform:scale(1.1)}
  }

  .arena-result {
    text-align: center;
    margin-bottom: 20px;
  }
  .result-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .result-win { color: var(--gold); text-shadow: 0 0 30px currentColor; animation: result-pop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .result-lose { color: var(--danger); }
  .result-draw { color: var(--accent3); }
  @keyframes result-pop {
    0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1}
  }
  .result-desc { font-size: 12px; color: var(--text-dim); }

  .arena-log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    max-height: 120px;
    overflow-y: auto;
    margin-bottom: 16px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 2;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .log-entry { border-bottom: 1px solid rgba(255,255,255,0.04); padding: 2px 0; }
  .log-entry .hl { color: var(--accent3); font-weight: 700; }
  .log-entry .hl-bad { color: var(--danger); }
  .log-entry .hl-good { color: var(--success); }

  /* NOTIFICATIONS */
  .notif-stack {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .notif {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 700;
    max-width: 260px;
    animation: notif-in 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .notif.fade-out { animation: notif-out 0.3s ease forwards; }
  @keyframes notif-in { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes notif-out { from{transform:translateX(0);opacity:1} to{transform:translateX(120%);opacity:0} }
  .notif-win { border-color: var(--gold); color: var(--gold); }
  .notif-lose { border-color: var(--danger); color: var(--danger); }
  .notif-level { border-color: var(--accent3); color: var(--accent3); }
  .notif-evolve { border-color: var(--accent); color: var(--accent); }

  /* TROPHIES */
  .trophy-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .trophy-item {
    font-size: 20px;
    padding: 4px;
    border-radius: 6px;
    background: var(--panel2);
    border: 1px solid var(--border);
    cursor: default;
    transition: transform 0.2s;
    position: relative;
  }
  .trophy-item:hover { transform: scale(1.2); }
  .trophy-item.dim { opacity: 0.2; filter: grayscale(1); }

  /* HISTORY */
  .history-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 11px;
    color: var(--text-dim);
  }
  .history-result { font-weight: 700; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .hr-win { background: rgba(255,215,0,0.15); color: var(--gold); }
  .hr-lose { background: rgba(255,68,68,0.1); color: var(--danger); }
  .hr-draw { background: rgba(0,245,255,0.1); color: var(--accent3); }

  /* EVOLVE GLOW */
  @keyframes evolve-flash {
    0%{box-shadow:0 0 0 0 rgba(255,60,172,0.8)}
    50%{box-shadow:0 0 60px 30px rgba(123,47,255,0.6)}
    100%{box-shadow:0 0 0 0 rgba(255,60,172,0)}
  }
  .pet-viewport.evolving { animation: evolve-flash 1s ease-out; }

  .evolve-notice {
    text-align: center;
    padding: 10px;
    background: linear-gradient(135deg, rgba(123,47,255,0.15), rgba(255,60,172,0.15));
    border: 1px solid var(--accent);
    border-radius: 8px;
    margin-top: 12px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    animation: pulse-border 2s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%,100%{border-color:var(--accent);box-shadow:0 0 10px rgba(255,60,172,0.2)}
    50%{border-color:var(--accent3);box-shadow:0 0 20px rgba(0,245,255,0.3)}
  }

  /* CLOSE BTN */
  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 30px; height: 30px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
  }
  .close-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* COIN */
  .coin-display {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--gold);
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.2);
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* RENAME */
  .name-input {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    width: 100%;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .name-input:focus { outline: none; border-color: var(--accent2); }

  /* Confetti particles */
  .confetti-container {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1999;
    overflow: hidden;
  }
  .conf {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: conf-fall linear forwards;
    opacity: 0;
  }
  @keyframes conf-fall {

  .scroll-area { max-height: 400px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* Rage click meter */

  .bar-meter-track {
    height: 14px;
    background: rgba(255,255,255,0.05);
    border-radius: 7px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin: 6px 0;
  }
  .bar-meter-fill {
    height: 100%;
    border-radius: 7px;
    background: linear-gradient(90deg, var(--accent2), var(--accent4), var(--accent));
    transition: width 0.3s;
    position: relative;
  }
  .bar-meter-fill.full { background: linear-gradient(90deg, var(--gold), #ff6600, var(--gold)); box-shadow: 0 0 15px rgba(255,215,0,0.5); }

/* ===== css: wacky-pets.css ===== */
/* WACKY PETS additions: room canvas, kennel, care, evolution, shop, egg chooser, responsive. */
.main-layout { grid-template-columns: 290px 1fr 300px; max-width: 1280px; }
.col { min-width: 0; }
.dim-note { color: var(--text-dim); font-size: 11px; text-align: center; padding: 12px; }
.title-count { color: var(--text-dim); font-size: 8px; }
.section-label { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--text-dim); letter-spacing: 2px; margin: 14px 0 6px; }
.section-label small { font-family: 'Nunito', sans-serif; font-size: 10px; letter-spacing: 0; }
.btn:focus-visible, .kennel-slot:focus-visible, .contest-card:focus-visible, .egg-card:focus-visible, .food-btn:focus-visible { outline: 2px solid var(--accent3); outline-offset: 2px; }

/* save bar */
.save-bar { position: relative; display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.save-bar .btn { font-size: 7px; padding: 8px 10px; min-height: 36px; }
.save-status { font-size: 11px; color: var(--success); min-width: 160px; text-align: left; }

/* room */
.center-panel { min-width: 0; }
.pet-stage { gap: 8px; }
.room-wrap { width: 100%; max-width: 512px; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; background: #1d1838; box-shadow: 0 0 30px rgba(123,47,255,0.15) inset; }
#room { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; touch-action: none; }
#room:active { cursor: grabbing; }
.room-hint { font-size: 11px; color: var(--text-dim); text-align: center; min-height: 16px; }
.hatch-instruction { margin-top: 10px; font-style: italic; }

/* care buttons */
.care-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.btn-care { background: var(--panel2); color: var(--text); border-color: var(--border); justify-content: center; padding: 12px 4px; min-height: 44px; font-size: 7px; }
.btn-care:hover:not(:disabled) { border-color: var(--accent3); color: var(--accent3); }
.train-grid { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
.train-grid .btn { justify-content: center; min-height: 44px; }
.throw-btn { margin-top: 8px; min-height: 48px; font-size: 10px; animation: pulse-border 1s infinite; }
.food-tray { display: none; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; padding: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; }
.food-tray.open { display: flex; }
.food-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 52px; min-height: 44px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; align-items: center; transition: transform .15s, border-color .15s; }
.food-btn:hover { transform: translateY(-2px); border-color: var(--accent); }
.food-btn.fav { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,60,172,.35); }
.food-icon { font-size: 20px; }
.food-count { font-size: 10px; font-weight: 700; color: var(--text-dim); }

/* kennel */
.kennel-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kennel-slot { position: relative; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 2px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--text); min-height: 86px; transition: border-color .15s, transform .15s; font-family: inherit; }
.kennel-slot:hover { transform: translateY(-2px); border-color: var(--accent2); }
.kennel-slot.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(255,60,172,.35); }
.kennel-slot img { width: 56px; height: 56px; image-rendering: pixelated; }
.kennel-name { font-size: 10px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.kennel-mood { position: absolute; top: 3px; right: 4px; font-size: 12px; }
.kennel-slot.empty { border-style: dashed; color: var(--text-dim); justify-content: center; }
.kennel-plus { font-size: 26px; line-height: 1.3; }

/* needs */
.mood-line { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 13px; margin-bottom: 10px; }
.mood-emoji { font-size: 22px; }
.mood-mult { margin-left: auto; font-size: 10px; color: var(--text-dim); font-weight: 700; }
.need-hunger .stat-bar-fill { background: linear-gradient(90deg, #c45000, #ffaa00); }
.need-clean .stat-bar-fill { background: linear-gradient(90deg, #0088cc, #7ee8ff); }
.need-energy .stat-bar-fill { background: linear-gradient(90deg, #a07000, var(--accent4)); }
.need-fun .stat-bar-fill { background: linear-gradient(90deg, #00a060, var(--success)); }
.need-bond .stat-bar-fill { background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.need .stat-label span:first-child { color: var(--text); }
.need.low .stat-label span:first-child { color: var(--danger); animation: shimmer 1s infinite; }
.stat-bar-fill { transition: width .4s ease-out; }

/* evolution */
.evo-box { margin-top: 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel2); font-size: 11px; }
.evo-box.ready { border-color: var(--accent); animation: pulse-border 2s infinite; }
.evo-box.legend { text-align: center; color: var(--gold); font-weight: 900; border-color: var(--gold); }
.evo-title { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.evo-silhouette { width: 32px; height: 32px; image-rendering: pixelated; }
.evo-req { display: flex; justify-content: space-between; color: var(--danger); padding: 2px 0; font-weight: 700; }
.evo-req.ok { color: var(--success); }
.evo-btn { margin-top: 8px; min-height: 44px; }

/* rename */
.rename-row { display: flex; gap: 6px; margin-top: 12px; align-items: stretch; }
.rename-row .name-input { margin: 0; flex: 1; min-width: 0; }
.rename-row .btn { font-size: 7px; min-height: 40px; }

/* contests & shop */
.contest-card.locked { opacity: .4; cursor: not-allowed; }
.contest-card.locked:hover { transform: none; border-color: var(--border); }
.contest-meta { flex-wrap: wrap; }
.tag-gold { color: var(--gold); border-color: var(--gold); background: rgba(255,215,0,.1); }
.tag-win { color: var(--success); border-color: var(--success); background: rgba(0,255,136,.1); }
.tag-lock { color: var(--danger); border-color: var(--danger); }
.shop-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 11px; }
.shop-row.fav { background: linear-gradient(90deg, rgba(255,60,172,.1), transparent); }
.shop-icon { font-size: 18px; width: 24px; text-align: center; }
.shop-name { flex: 1; font-weight: 700; display: flex; flex-direction: column; }
.shop-name em { color: var(--accent); font-style: normal; font-size: 9px; }
.shop-name small { color: var(--text-dim); font-weight: 400; font-size: 9px; }
.shop-own { color: var(--text-dim); font-size: 10px; }
.shop-buy { font-size: 7px; padding: 8px; min-height: 36px; }

/* sprites in lists */
.mini-sprite { width: 32px; height: 32px; image-rendering: pixelated; flex-shrink: 0; }
.lb-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 11px; color: var(--text-dim); }
.lb-row.mine { color: var(--accent3); }
.lb-rank { font-family: 'Press Start 2P', monospace; font-size: 8px; width: 16px; text-align: center; }
.lb-rank.r0 { color: var(--gold); } .lb-rank.r1 { color: #aaa; } .lb-rank.r2 { color: #a08050; }
.lb-name { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-score { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--accent4); }
.history-entry .mini-sprite { width: 24px; height: 24px; }

/* arena sprites */
.fighter-sprite { width: 96px; height: 96px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
.fighter-sprite.flip { transform: scaleX(-1); }

/* egg chooser */
.egg-box { width: min(760px, 95vw); max-height: 90vh; overflow-y: auto; }
.egg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.egg-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 8px; cursor: pointer; color: var(--text); font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s, border-color .15s; }
.egg-card:hover { transform: translateY(-4px); border-color: var(--accent); }
.egg-card img { width: 64px; height: 64px; image-rendering: pixelated; animation: float 3s ease-in-out infinite; }
.egg-species { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--accent); margin-top: 4px; }
.egg-element { font-size: 10px; color: var(--accent3); font-weight: 700; text-align: center; }
.egg-hint { font-size: 10px; color: var(--text-dim); font-style: italic; text-align: center; }

/* responsive: tablet stacks the side columns below the room, mobile is single column */
@media (max-width: 1024px) {
  .main-layout { grid-template-columns: 1fr 1fr; }
  .center-panel { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 600px) {
  .main-layout { grid-template-columns: 1fr; padding: 10px; }
  .care-grid { grid-template-columns: repeat(3, 1fr); }
  .kennel-list { grid-template-columns: repeat(3, 1fr); }
  .save-status { min-width: 0; text-align: center; width: 100%; }
}
.center-panel, .kennel-list, .care-grid, .train-grid { user-select: none; -webkit-user-select: none; }
.center-panel input { user-select: text; -webkit-user-select: text; }

/* hamburger + sidebar menu */
.title-bar .hamburger { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 2; width: 48px; height: 48px; border-radius: 10px; border: 2px solid var(--border); background: var(--panel2); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; transition: border-color .15s, box-shadow .15s; }
.hamburger span { display: block; width: 22px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.hamburger:hover { border-color: var(--accent); box-shadow: 0 0 16px rgba(255,60,172,.35); }
.hamburger:focus-visible { outline: 2px solid var(--accent3); outline-offset: 2px; }
.title-bar .mute-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); z-index: 2; min-width: 44px; min-height: 44px; justify-content: center; font-size: 14px; padding: 6px; }
.side-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 940; opacity: 0; pointer-events: none; transition: opacity .25s; }
.side-scrim.open { opacity: 1; pointer-events: all; }
.side-menu { position: fixed; top: 0; left: 0; bottom: 0; width: min(380px, 92vw); z-index: 950; background: var(--panel); border-right: 2px solid var(--accent2); box-shadow: 8px 0 40px rgba(123,47,255,.3); display: flex; flex-direction: column; transform: translateX(-105%); transition: transform .3s cubic-bezier(0.34,1.2,0.64,1); padding-top: 56px; }
.side-menu.open { transform: translateX(0); }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.side-title { font-family: 'Press Start 2P', monospace; font-size: 11px; background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
.side-close { position: static; width: 36px; height: 36px; }
.side-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
.side-tab { font-family: 'Press Start 2P', monospace; font-size: 7px; letter-spacing: 1px; min-height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text-dim); cursor: pointer; transition: all .15s; }
.side-tab:hover { color: var(--accent3); border-color: var(--accent3); }
.side-tab.active { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent2), var(--accent)); box-shadow: 0 4px 16px rgba(255,60,172,.3); }
.side-tab:focus-visible { outline: 2px solid var(--accent3); outline-offset: 2px; }
.side-pages { flex: 1; overflow-y: auto; padding: 14px 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.side-page { display: none; animation: notif-in .25s ease-out; }
.side-page.active { display: block; }
.side-page .kennel-list { grid-template-columns: repeat(3, 1fr); }
.side-footer { border-top: 1px solid var(--border); padding: 12px 16px 16px; background: var(--panel2); }
.side-footer .panel-title { margin-bottom: 8px; }
.side-save { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.side-save .btn { font-size: 7px; justify-content: center; min-height: 44px; padding: 8px 4px; }
.side-footer .save-status { margin-top: 8px; min-width: 0; text-align: center; font-size: 11px; color: var(--success); min-height: 14px; }
.link-btn { background: none; border: none; color: var(--accent3); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 4px; }
@media (max-width: 600px) { .title-bar { padding-top: 70px; } .title-bar .hamburger, .title-bar .mute-btn { top: 12px; transform: none; } }

<script>
/* ===== js: state.js ===== */
// All mutable game state. appState is saved; appState.rt (runtime) is not.
const SAVE_VERSION = 2;
const appState = {
  version: SAVE_VERSION,
  coins: 0,
  pets: [],
  activeId: null,
  inventory: {},
  trophies: {},
  history: [],
  wins: 0,
  losses: 0,
  perfectCatches: 0,
  speciesRaised: {},
  muted: false,
  lastTick: Date.now(),
  rt: null, // runtime, rebuilt by resetRuntime()
};

function resetRuntime() {
  appState.rt = {
    mode: 'idle',        // idle | eat | bath | sleep | fetch | walk
    modeT: 0,            // seconds in current mode
    modeData: {},
    petX: 120, targetX: 120, facing: 1, walkFrame: 0, hop: 0, blinkT: 0,
    rubbing: false, rubDist: 0, petFatigue: 0, happyT: 0,
    particles: [],
    pointer: null,
    warned: {},
  };
}

function newGameState() {
  const keep = { muted: appState.muted };
  Object.assign(appState, {
    version: SAVE_VERSION, coins: registry.rule('startCoins'), pets: [], activeId: null,
    inventory: Object.assign({}, registry.rule('startFood')), trophies: {}, history: [],
    wins: 0, losses: 0, perfectCatches: 0, speciesRaised: {}, lastTick: Date.now(),
  }, keep);
  resetRuntime();
}

let petSeq = 0;
function makePet(speciesId) {
  const b = registry.get('beasts', speciesId);
  return {
    id: `p${Date.now().toString(36)}${(petSeq++).toString(36)}`,
    speciesId, name: b.stages[0], named: false,
    stage: 0, hatchClicks: 0,
    stats: { power: 0, speed: 0, charm: 0 },
    xp: 0, level: 1, bond: 0, wins: 0,
    needs: { hunger: 80, clean: 100, energy: 100, fun: 70 },
    born: Date.now(),
  };
}

/* ===== js: sprite-engine.js ===== */
// Pixel sprite engine: 32x32 grids of palette keys (not colors), so palettes can be swapped
// (legend shimmer, rival recolors) without redrawing. Pure functions, no DOM except drawGrid().
const SPR = 32;

class Pix {
  constructor() { this.g = Array.from({ length: SPR }, () => Array(SPR).fill(null)); }
  set(x, y, c) {
    x = Math.floor(x); y = Math.floor(y);
    if (c && x >= 0 && y >= 0 && x < SPR && y < SPR) this.g[y][x] = c;
  }
  get(x, y) { return (x >= 0 && y >= 0 && x < SPR && y < SPR) ? this.g[y][x] : null; }
  // Filled ellipse. shade: key for the lower part, light: key for a top-left highlight.
  ell(cx, cy, rx, ry, c, shade, light) {
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) {
      for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy > 1) continue;
        let col = c;
        if (shade && dy > 0.4) col = shade;
        if (light && dy < -0.35 && dx < 0.1 && dx > -0.7) col = light;
        this.set(x, y, col);
      }
    }
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); }
  // Thick line built from discs; t0 -> t1 lets limbs and tails taper.
  line(x0, y0, x1, y1, c, t0 = 1, t1 = t0) {
    const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2));
    for (let i = 0; i <= n; i++) {
      const k = i / n, x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k, t = t0 + (t1 - t0) * k;
      if (t <= 1) this.set(x, y, c); else this.ell(x, y, t / 2, t / 2, c);
    }
  }
  // Polyline through points [[x,y],...] tapering from t0 to t1.
  path(pts, c, t0 = 1, t1 = t0) {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = t0 + (t1 - t0) * (i / (pts.length - 1)), b = t0 + (t1 - t0) * ((i + 1) / (pts.length - 1));
      this.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], c, a, b);
    }
  }
  poly(pts, c) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    for (let y = Math.floor(Math.min(...ys)); y <= Math.max(...ys); y++) {
      for (let x = Math.floor(Math.min(...xs)); x <= Math.max(...xs); x++) {
        const px = x + 0.5, py = y + 0.5; let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
        }
        if (inside) this.set(x, y, c);
      }
    }
  }
  // Eye: 2x2 dark with a highlight; closed = a short line. big = 2x3.
  eye(x, y, big, closed) {
    x = Math.floor(x); y = Math.floor(y);
    if (closed) { this.set(x, y + 1, 'k'); this.set(x + 1, y + 1, 'k'); return; }
    this.rect(x, y, 2, big ? 3 : 2, 'k');
    this.set(x + 1, y, 'w');
  }
  // Outer outline: every empty pixel touching a filled one becomes 'o'.
  outline() {
    const src = this.g.map(r => r.slice());
    for (let y = 0; y < SPR; y++) for (let x = 0; x < SPR; x++) {
      if (src[y][x]) continue;
      const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const v = (src[y + dy] || [])[x + dx]; return v && v !== 'o' && v !== 'f2';
      });
      if (n) this.g[y][x] = 'o';
    }
    return this;
  }
}

// Paint a grid onto a canvas context. pal maps keys to CSS colors.
function drawGrid(ctx, grid, pal, ox, oy, scale, flip = false) {
  for (let y = 0; y < SPR; y++) for (let x = 0; x < SPR; x++) {
    const k = grid[y][x]; if (!k) continue;
    const col = pal[k] || '#f0f'; ctx.fillStyle = col;
    const dx = flip ? SPR - 1 - x : x;
    ctx.fillRect(ox + dx * scale, oy + y * scale, scale, scale);
  }
}

// Sprite cache keyed by species/stage/pose so the render loop never re-rasterises.
const spriteCache = new Map();
function getSprite(speciesId, stage, pose = 'idle') {
  const key = `${speciesId}|${stage}|${pose}`;
  if (!spriteCache.has(key)) {
    const p = new Pix();
    if (stage === 0) drawEgg(p, speciesId); else BEAST_DRAWERS[speciesId](p, stage, pose);
    spriteCache.set(key, p.outline().g);
  }
  return spriteCache.get(key);
}

function drawEgg(p, speciesId) {
  p.ell(16, 19, 8, 10, 'b', 's', 'l');
  const spots = { dragon: 'a', phoenix: 'a', griffin: 'a', kitsune: 'a', unicorn: 'a' };
  const c = spots[speciesId] || 'a';
  [[12, 15], [19, 13], [17, 22], [11, 23], [21, 19]].forEach(([x, y]) => p.ell(x, y, 1.6, 1.3, c));
}

/* ===== js: sprites-beasts.js ===== */
// Species drawers. Each draws one 32x32 side-view sprite (facing right) for stage 1..5
// (Baby, Infant, Teen, Adult, Legend). pose: 'idle' | 'blink' | 'happy' | 'walk' | 'sleep'.
// To add a species: add it to data/beasts.json and add a drawer here under the same id.
const GROUND = 30;
const pick = (arr, stage) => arr[stage - 1];

function eyeFor(p, x, y, stage, pose) {
  if (pose === 'happy') { p.set(x, y + 1, 'k'); p.set(x + 1, y, 'k'); p.set(x + 2, y + 1, 'k'); return; }
  p.eye(x, y, stage <= 2, pose === 'blink' || pose === 'sleep');
}

// Four legs (far pair darker), returns body geometry. Draw tail/far wing BEFORE calling.
function quadBody(p, o) {
  const cy = GROUND - o.leg - o.ry;
  const backX = o.cx - o.rx * 0.55, frontX = o.cx + o.rx * 0.45;
  const top = cy + o.ry * 0.3, w = o.legW || 2;
  const step = o.pose === 'walk' ? 1 : 0;
  // far legs
  p.rect(backX + 2 - step, top, w, GROUND - top, 's');
  p.rect(frontX + 2 + step, top, w, GROUND - top, 's');
  p.ell(o.cx, cy, o.rx, o.ry, o.body || 'b', o.shade || 's', o.light || 'l');
  // near legs + feet
  p.rect(backX + step, top, w, GROUND - top, o.body || 'b');
  p.rect(frontX - step, top, w, GROUND - top, o.frontLeg || o.body || 'b');
  p.rect(backX + step, GROUND - 1, w + 1, 1, o.foot || 's');
  p.rect(frontX - step, GROUND - 1, w + 1, 1, o.frontFoot || o.foot || 's');
  return { cx: o.cx, cy, rx: o.rx, ry: o.ry };
}

// Small floating flame/spirit wisp used by legend forms.
function wisp(p, x, y) {
  p.ell(x, y + 1, 1.6, 1.6, 'f'); p.set(x, y - 1, 'f'); p.set(x + 1, y - 2, 'f'); p.set(x, y + 1, 'f2');
}

const BEAST_DRAWERS = {
  dragon(p, s, pose) {
    const rx = pick([5.5, 6.5, 7, 7.5, 8], s), ry = pick([5, 5, 5, 5.5, 5.5], s);
    const leg = pick([2, 3, 3, 4, 4], s), hr = pick([5.5, 5, 4.5, 4.5, 4.5], s);
    const neck = pick([0, 1, 2, 3, 4], s), wing = pick([0, 4, 6, 8, 10], s);
    const horn = pick([0, 1, 2, 3, 4], s), tail = pick([5, 6, 7, 8, 9], s), cx = pick([14, 13, 13, 13, 13], s);
    const cy = GROUND - leg - ry;
    // tail
    const tx = cx - rx + 1, ty = cy + 1;
    const tpts = [[tx, ty], [tx - tail * 0.45, ty + 2], [tx - tail * 0.8, ty], [tx - tail, ty - 3]];
    p.path(tpts, 'b', ry * 0.9, 1.5);
    const [ex, ey] = tpts[3];
    if (s >= 3) p.poly([[ex - 2, ey - 1], [ex + 1, ey - 3], [ex + 1, ey + 1]], 'a');
    if (s === 5) { p.ell(ex - 1, ey - 3, 1.8, 2.2, 'f'); p.set(ex - 1, ey - 3, 'f2'); }
    // far wing
    if (wing) p.poly([[cx + 1, cy - ry + 2], [cx + 1 - wing * 0.3, cy - ry - wing + 1], [cx - wing * 0.7, cy - ry - wing * 0.4], [cx - 2, cy - ry + 2]], 's');
    const g = quadBody(p, { cx, rx, ry, leg, pose, legW: s >= 3 ? 3 : 2 });
    p.ell(cx + rx * 0.25, cy + ry * 0.35, rx * 0.6, ry * 0.45, 'a');
    // back spikes
    if (s >= 4) for (let i = 0; i < 3; i++) { const x = cx - 3 + i * 3; p.poly([[x, cy - ry + 1], [x + 1, cy - ry - 2], [x + 2, cy - ry + 1]], 'a'); }
    // neck + head
    const hx = cx + rx * 0.55 + neck * 0.6 + 1, hy = cy - ry * 0.4 - neck * 0.9 - hr * 0.5;
    if (neck) p.line(cx + rx * 0.4, cy - ry * 0.2, hx, hy + 1, 'b', hr * 1.2, hr);
    if (horn) {
      p.path([[hx - hr * 0.4, hy - hr * 0.6], [hx - hr * 0.6 - horn * 0.5, hy - hr * 0.7 - horn * 0.7], [hx - hr * 0.6 - horn, hy - hr * 0.5 - horn]], 'h', 2, 1);
      if (s === 5) p.path([[hx + 0.5, hy - hr * 0.8], [hx - 1, hy - hr - 2.5]], 'h', 2, 1);
    }
    p.ell(hx, hy, hr, hr * 0.9, 'b', 's', 'l');
    p.ell(hx + hr * 0.85, hy + hr * 0.3, hr * 0.7, hr * 0.5, 'b', 's');
    if (s >= 2) p.set(hx + hr * 1.35, hy + hr * 0.05, 'k');
    eyeFor(p, hx - 0.5, hy - hr * 0.45, s, pose);
    if (s <= 2) p.set(hx - 1, hy + hr * 0.3, 'p');
    // near wing
    if (wing) {
      const root = [cx, cy - ry + 3], tip = [cx - wing * 0.35, cy - ry - wing];
      p.poly([root, tip, [cx - wing * 0.95, cy - ry - wing * 0.35], [cx - wing * 0.55, cy - ry + 1], [cx - 3, cy - ry + 3]], 'A');
      p.line(root[0], root[1], tip[0], tip[1], 'b', 1.6, 1);
      if (wing >= 6) p.line(tip[0], tip[1], cx - wing * 0.75, cy - ry - wing * 0.1, 's');
    }
  },

  kitsune(p, s, pose) {
    const rx = pick([5, 5.5, 6.5, 7, 7.5], s), ry = pick([4.5, 4.5, 4.5, 5, 5], s);
    const leg = pick([2, 3, 4, 5, 5], s), hr = pick([5.5, 5, 4.5, 4.5, 4.5], s);
    const tails = pick([1, 2, 3, 5, 9], s), tl = pick([6, 6, 7, 8, 9], s), cx = pick([16, 15, 15, 15, 15], s);
    const cy = GROUND - leg - ry;
    // fanned tails behind
    const bx = cx - rx + 2, by = cy - 1;
    for (let i = 0; i < tails; i++) {
      const a = tails === 1 ? 2.6 : 1.45 + (1.85 * i) / (tails - 1); // radians; pi=left, pi/2=up
      const tl2 = tl - (tails > 3 ? (i % 2) * 2 : 0);
      const dx = Math.cos(a), dy = -Math.sin(a);
      const mx = bx + dx * tl2 * 0.55 - dy * 1.2, my = by + dy * tl2 * 0.55 + dx * 1.2;
      const ex = bx + dx * tl2, ey = by + dy * tl2;
      p.path([[bx, by], [mx, my], [ex, ey]], i % 2 ? 's' : 'b', 2.5, 3.5);
      p.ell(ex, ey, 1.8, 1.8, 'a');
    }
    quadBody(p, { cx, rx, ry, leg, pose, foot: 'k' });
    p.ell(cx + rx * 0.45, cy + ry * 0.2, rx * 0.4, ry * 0.6, 'a');
    const hx = cx + rx * 0.7 + 1, hy = cy - ry * 0.55 - hr * 0.45;
    const eh = pick([3, 3, 3.5, 4, 4.5], s);
    // far ear, head, near ear
    p.poly([[hx + 0.5, hy - hr * 0.5], [hx + hr * 0.7, hy - hr * 0.3], [hx + hr * 0.5, hy - hr - eh]], 's');
    p.ell(hx, hy, hr, hr * 0.85, 'b', 's', 'l');
    p.poly([[hx - hr * 0.75, hy - hr * 0.3], [hx + 0.2, hy - hr * 0.6], [hx - hr * 0.5, hy - hr - eh]], 'b');
    p.poly([[hx - hr * 0.5, hy - hr * 0.5], [hx - 0.5, hy - hr * 0.6], [hx - hr * 0.45, hy - hr - eh + 2]], 'a');
    // muzzle
    p.poly([[hx + hr * 0.3, hy - 0.5], [hx + hr + 2.5, hy + hr * 0.45], [hx + hr * 0.2, hy + hr * 0.85]], 'a');
    p.set(hx + hr + 1.6, hy + hr * 0.3, 'k');
    p.ell(hx - hr * 0.1, hy + hr * 0.55, hr * 0.55, hr * 0.3, 'a');
    eyeFor(p, hx, hy - hr * 0.35, s, pose);
    if (s <= 2) p.set(hx - 1, hy + hr * 0.25, 'p');
    if (s >= 4) { p.set(hx - 1, hy - hr * 0.75, 'A'); p.set(hx, hy - hr * 0.8, 'A'); }
    if (s === 5) [[3, 20], [27, 4], [29, 18]].forEach(([x, y]) => wisp(p, x, y));
  },

  unicorn(p, s, pose) {
    const rx = pick([5, 6, 6.5, 7, 7.5], s), ry = pick([4, 4, 4.5, 4.5, 5], s);
    const leg = pick([4, 5, 6, 7, 7], s), hr = pick([4.5, 4, 3.8, 3.8, 3.8], s);
    const neck = pick([1, 2, 3, 4, 4], s), horn = pick([1, 2, 3, 5, 6], s), cx = pick([14, 13, 13, 12, 12], s);
    const cy = GROUND - leg - ry;
    // tail
    const tx = cx - rx + 1, ty = cy - ry * 0.4, tlen = pick([4, 5, 7, 8, 9], s);
    p.path([[tx, ty], [tx - 3, ty + 1], [tx - 4, ty + tlen * 0.6], [tx - 3, ty + tlen]], 'a', 2.5, 2);
    if (s >= 3) p.path([[tx - 1, ty + 1], [tx - 3, ty + tlen * 0.5], [tx - 2, ty + tlen]], 'A', 1);
    if (s === 5) { // wings (celestial)
      p.poly([[cx + 1, cy - ry + 2], [cx - 2, cy - ry - 10], [cx - 9, cy - ry - 8], [cx - 6, cy - ry + 1]], 's');
    }
    quadBody(p, { cx, rx, ry, leg, pose, foot: 'H', legW: 2 });
    const hx = cx + rx * 0.6 + neck * 0.6, hy = cy - ry * 0.4 - neck * 1.1 - hr * 0.5;
    p.line(cx + rx * 0.45, cy - ry * 0.3, hx, hy + 1, 'b', hr * 1.3, hr * 1.1);
    // mane along neck
    p.path([[hx - hr * 0.6, hy - hr * 0.6], [hx - hr * 0.9 - neck * 0.4, hy + neck * 0.5], [cx + rx * 0.2, cy - ry + 0.5]], 'a', 2.5, 2);
    if (s >= 3) p.path([[hx - hr * 0.9, hy], [cx + rx * 0.3, cy - ry + 1.5]], 'A', 1);
    p.poly([[hx - hr * 0.5, hy - hr * 0.4], [hx + 0.3, hy - hr * 0.7], [hx - hr * 0.3, hy - hr - 2.5]], 'b');
    p.ell(hx, hy, hr, hr * 0.9, 'b', 's', 'l');
    p.ell(hx + hr * 0.95, hy + hr * 0.45, hr * 0.7, hr * 0.55, 'b', 's');
    p.set(hx + hr * 1.4, hy + hr * 0.5, 's');
    // horn
    const hbx = hx + hr * 0.15, hby = hy - hr * 0.75;
    p.line(hbx, hby, hbx + horn * 0.45, hby - horn, 'h', 2, 1);
    if (horn >= 3) p.set(hbx + horn * 0.2, hby - horn * 0.45, 'H');
    p.path([[hx - hr * 0.2, hy - hr * 0.9], [hx + hr * 0.3, hy - hr * 0.3]], 'a', 1.5); // forelock
    eyeFor(p, hx - 0.5, hy - hr * 0.25, s, pose);
    if (s <= 2) p.set(hx - 1, hy + hr * 0.4, 'p');
    if (s === 5) {
      const r = [cx - 1, cy - ry + 3];
      p.poly([r, [cx - 3, cy - ry - 11], [cx - 11, cy - ry - 9], [cx - 9, cy - ry - 3], [cx - 5, cy - ry + 1]], 'w');
      p.line(cx - 4, cy - ry - 5, cx - 9, cy - ry - 6, 'f'); p.line(cx - 4, cy - ry - 1, cx - 8, cy - ry - 2, 'f');
      [[25, 4], [5, 14], [28, 13]].forEach(([x, y]) => { p.set(x, y, 'f2'); p.set(x - 1, y, 'f'); p.set(x + 1, y, 'f'); p.set(x, y - 1, 'f'); p.set(x, y + 1, 'f'); });
    }
  },

  griffin(p, s, pose) {
    const rx = pick([5.5, 6, 6.5, 7, 7.5], s), ry = pick([5, 5, 5, 5.5, 5.5], s);
    const leg = pick([2, 3, 4, 4, 5], s), hr = pick([5.5, 5, 4.5, 4.5, 4.5], s);
    const neck = pick([0, 1, 2, 2, 3], s), wing = pick([3, 5, 7, 9, 11], s), cx = pick([14, 13, 13, 13, 13], s);
    const cy = GROUND - leg - ry;
    // lion tail with tuft
    const tx = cx - rx + 1, ty = cy;
    const tlen = pick([4, 5, 7, 8, 9], s);
    p.path([[tx, ty], [tx - tlen * 0.5, ty + 1], [tx - tlen * 0.8, ty - 2], [tx - tlen, ty - 5]], 'b', 1.8, 1.5);
    p.ell(tx - tlen, ty - 6, 1.6, 2, 'W');
    if (wing) p.poly([[cx + 1, cy - ry + 2], [cx - wing * 0.2, cy - ry - wing + 1], [cx - wing * 0.75, cy - ry - wing * 0.45], [cx - 3, cy - ry + 2]], 'Ws');
    quadBody(p, { cx, rx, ry, leg, pose, frontLeg: 'b', frontFoot: 'y', foot: 's' });
    // chest ruff
    p.ell(cx + rx * 0.55, cy - ry * 0.05, rx * 0.4, ry * 0.75, 'c', 'cs');
    const hx = cx + rx * 0.6 + neck * 0.6 + 1, hy = cy - ry * 0.5 - neck * 0.9 - hr * 0.5;
    if (neck) p.line(cx + rx * 0.5, cy - ry * 0.3, hx, hy + 1, 'c', hr * 1.3, hr * 1.1);
    p.ell(hx, hy, hr, hr * 0.9, 'c', 'cs', 'w');
    if (s >= 3) p.poly([[hx - hr * 0.6, hy - hr * 0.6], [hx - hr - 2, hy - hr - 1], [hx - hr * 0.2, hy - hr * 0.8]], 'c'); // ear tuft
    // hooked beak
    const bk = pick([2, 2.5, 3, 3.5, 3.5], s);
    p.poly([[hx + hr * 0.55, hy - hr * 0.45], [hx + hr + bk, hy - 0.5], [hx + hr + bk - 0.5, hy + 2], [hx + hr * 0.5, hy + hr * 0.45]], 'y');
    p.set(hx + hr + bk - 1, hy + 1, 'ys'); p.line(hx + hr * 0.6, hy + 0.5, hx + hr + bk - 1.5, hy + 0.5, 'ys');
    eyeFor(p, hx - 0.5, hy - hr * 0.4, s, pose);
    if (s <= 2) p.set(hx - 1, hy + hr * 0.3, 'p');
    // near wing, feathered
    if (wing) {
      const root = [cx, cy - ry + 3], tip = [cx - wing * 0.3, cy - ry - wing];
      const pts = [root, tip, [cx - wing * 0.9, cy - ry - wing * 0.3], [cx - wing * 0.7, cy - ry + 1], [cx - 3, cy - ry + 3]];
      p.poly(pts, 'W');
      for (let i = 1; i <= Math.floor(wing / 3); i++) {
        const k = i / (wing / 3 + 1);
        p.line(root[0] - 1 - wing * 0.55 * k, root[1] - wing * 0.8 * k, root[0] - 3 - wing * 0.6 * k, root[1] - wing * 0.25 * k, 'Wl');
      }
    }
    if (s === 5) { p.path([[27, 2], [25, 6], [27, 7], [24, 12]], 'f', 1); p.path([[4, 4], [3, 8], [5, 8], [3, 12]], 'f', 1); }
  },

  phoenix(p, s, pose) {
    const rx = pick([6, 6, 6, 6.5, 6.5], s), ry = pick([5.5, 5.5, 5, 5, 5.5], s);
    const leg = pick([2, 3, 4, 4, 5], s), hr = pick([4.5, 4, 3.8, 3.8, 4], s);
    const cx = pick([15, 15, 15, 15, 15], s), cy = GROUND - leg - ry;
    const tails = pick([1, 2, 3, 4, 5], s), tl = pick([4, 6, 8, 10, 12], s), wing = pick([0, 3, 6, 9, 11], s);
    const step = pose === 'walk' ? 1 : 0;
    // tail feathers sweeping back-down
    const keys = ['a', 'A', 'f', 'a', 'A'];
    for (let i = 0; i < tails; i++) {
      const sx = cx - rx + 2, sy = cy + 1, spread = (i - (tails - 1) / 2) * 1.6;
      const pts = [[sx, sy], [sx - tl * 0.5, sy + 1 + spread * 0.5], [sx - tl, sy - 1 + spread]];
      p.path(pts, keys[i], 2, 1.5);
      if (s >= 4) { const [ex, ey] = pts[2]; p.ell(ex, ey, 1.4, 1.4, 'f2'); }
    }
    // far wing
    if (wing >= 6) p.poly([[cx + 1, cy - ry + 2], [cx - 1, cy - ry - wing + 1], [cx - wing * 0.65, cy - ry - wing * 0.5], [cx - 3, cy - ry + 2]], 's');
    // legs
    const lt = cy + ry - 1;
    p.rect(cx - 1 + step, lt, 1, GROUND - lt, 'y'); p.rect(cx + 2 - step, lt, 1, GROUND - lt, 'ys');
    p.rect(cx - 1 + step, GROUND - 1, 3, 1, 'y'); p.rect(cx + 2 - step, GROUND - 1, 3, 1, 'ys');
    p.ell(cx, cy, rx, ry, 'b', 's', 'l');
    p.ell(cx + rx * 0.35, cy + ry * 0.2, rx * 0.5, ry * 0.6, 'a');
    // head
    const hx = cx + rx * 0.45, hy = cy - ry * (s === 1 ? 0.55 : 0.8) - hr * 0.5;
    const crest = pick([1, 2, 3, 3, 5], s);
    for (let i = 0; i < crest; i++) {
      const a = 1.9 + i * 0.32, len = 3 + (s >= 4 ? 2 : 0) + (i === 1 ? 1 : 0);
      p.path([[hx - 0.5, hy - hr * 0.6], [hx - 0.5 + Math.cos(a) * len, hy - hr * 0.6 - Math.sin(a) * len]], i % 2 ? 'a' : 'f', 1.5, 1);
    }
    p.ell(hx, hy, hr, hr * 0.9, 'b', 's', 'l');
    p.poly([[hx + hr * 0.7, hy - 1], [hx + hr + 2.5, hy + 0.5], [hx + hr * 0.7, hy + 1.5]], 'y');
    eyeFor(p, hx, hy - hr * 0.35, s, pose);
    if (s <= 2) p.set(hx - 1, hy + hr * 0.3, 'p');
    // near wing
    if (wing < 6) p.ell(cx - 1, cy, rx * 0.55, ry * 0.5, 'A', 's');
    else {
      const root = [cx, cy - ry + 3], tip = [cx - 2, cy - ry - wing];
      p.poly([root, tip, [cx - wing * 0.8, cy - ry - wing * 0.45], [cx - wing * 0.5, cy - ry + 2], [cx - 3, cy + 1]], 'A');
      p.line(root[0], root[1], tip[0], tip[1], 'a', 1.5, 1);
      for (let i = 0; i < 3; i++) p.set(cx - wing * 0.8 + i * 2, cy - ry - wing * 0.45 + i * 2.2, 'f');
    }
    if (s === 5) [[4, 6], [28, 6], [27, 16]].forEach(([x, y]) => wisp(p, x, y));
  },
};

/* ===== js: registry.js ===== */
// Engine-side access to content. Code asks the registry; it never reads DATA directly.
// To add content: edit a file in src/data/ (new species also need a drawer in sprites-beasts.js).
const registry = {
  get(collection, id) {
    const found = (DATA[collection] || []).find((x) => x.id === id);
    if (!found) throw new Error(`registry: no "${id}" in "${collection}"`);
    return found;
  },
  all(collection) { return DATA[collection] || []; },
  rule(key) { return DATA.rules[key]; },
  validate() {
    const errs = [];
    for (const b of this.all('beasts')) {
      if (!BEAST_DRAWERS[b.id]) errs.push(`beast "${b.id}" has no drawer in sprites-beasts.js`);
      if (!b.stages || b.stages.length !== 5) errs.push(`beast "${b.id}" needs exactly 5 stage names`);
      if (!this.all('foods').some(f => f.id === b.favoriteFood)) errs.push(`beast "${b.id}" favoriteFood "${b.favoriteFood}" missing from foods.json`);
    }
    for (const r of this.all('rivals')) if (!BEAST_DRAWERS[r.species]) errs.push(`rival "${r.id}" uses unknown species`);
    if ((DATA.rules.evolve || []).length !== 4) errs.push('rules.evolve needs 4 thresholds (Baby→Infant … Adult→Legend)');
    if (errs.length) {
      document.body.innerHTML = `<pre style="color:#ff6b6b;padding:20px;font:14px monospace">WACKY PETS data error:\n${errs.join('\n')}</pre>`;
      throw new Error(errs.join('; '));
    }
  },
};

// Persistence: autosave to localStorage; Export/Import a JSON save via File System Access API
// (falls back to download / file input where the API is missing).
const STORE_KEY = 'petamon_save_v2'; // old internal name, kept so existing saves still load
let fileHandle = null;

function serialize() {
  const { rt, ...save } = appState;
  return JSON.stringify(save);
}

function applySave(data) {
  if (!data || !Array.isArray(data.pets)) throw new Error('Not a Wacky Pets save');
  newGameState();
  const { rt, ...rest } = data;
  Object.assign(appState, rest);
  appState.pets = appState.pets.filter(p => DATA.beasts.some(b => b.id === p.speciesId));
  if (!appState.pets.some(p => p.id === appState.activeId)) appState.activeId = appState.pets[0]?.id || null;
}

function autosave() {
  try { localStorage.setItem(STORE_KEY, serialize()); } catch (e) { /* storage full or blocked */ }
}

function loadAutosave() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    applySave(JSON.parse(raw));
    return true;
  } catch (e) { console.warn('autosave unreadable', e); return false; }
}

async function exportSave() {
  const text = JSON.stringify(JSON.parse(serialize()), null, 2);
  try {
    if (window.showSaveFilePicker) {
      fileHandle = fileHandle || await window.showSaveFilePicker({ suggestedName: 'wacky-pets-save.json',
        types: [{ description: 'Wacky Pets save', accept: { 'application/json': ['.json'] } }] });
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = 'wacky-pets-save.json'; a.click(); URL.revokeObjectURL(a.href);
    }
    setStatus('💾 Save exported');
  } catch (e) { if (e.name !== 'AbortError') setStatus('⚠️ Export failed: ' + e.message); }
}

async function importSave() {
  try {
    let text;
    if (window.showOpenFilePicker) {
      [fileHandle] = await window.showOpenFilePicker({ types: [{ description: 'Wacky Pets save', accept: { 'application/json': ['.json'] } }] });
      text = await (await fileHandle.getFile()).text();
    } else {
      text = await new Promise((res, rej) => {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = () => inp.files[0] ? inp.files[0].text().then(res, rej) : rej(new Error('No file'));
        inp.click();
      });
    }
    applySave(JSON.parse(text));
    autosave(); renderAll();
    setStatus(`📂 Loaded · ${appState.pets.length} beast${appState.pets.length === 1 ? '' : 's'}`);
  } catch (e) { if (e.name !== 'AbortError') setStatus('⚠️ Load failed: ' + e.message); }
}

function setStatus(msg) {
  const el = document.getElementById('saveStatus');
  if (el) el.textContent = msg;
}

// Notifications, confetti and tiny chiptune sound effects (WebAudio, no assets).
function showNotif(msg, cls = '') {
  const stack = document.getElementById('notifStack');
  const el = document.createElement('div');
  el.className = `notif ${cls}`;
  el.textContent = msg;
  stack.appendChild(el);
  while (stack.children.length > 4) stack.firstChild.remove();

}

function spawnConfetti(colors = ['#ff3cac', '#7b2fff', '#00f5ff', '#ffea00', '#ff6b35', '#00ff88']) {

      width:${size}px;height:${size}px;border-radius:${i % 2 ? '50%' : '1px'};

let audioCtx = null;
// notes: array of [freqHz, durationSec]; plays them in sequence.
function sfx(name) {
  if (appState.muted) return;
  const tunes = {
    tap: [[660, 0.05]], pet: [[880, 0.04], [1175, 0.06]], eat: [[300, 0.05], [260, 0.05], [330, 0.06]],
    happy: [[523, 0.07], [659, 0.07], [784, 0.1]], sad: [[392, 0.12], [330, 0.18]],
    coin: [[988, 0.05], [1319, 0.12]], hatch: [[392, 0.08], [523, 0.08], [659, 0.08], [1047, 0.2]],
    evolve: [[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.1], [1319, 0.3]], splash: [[200, 0.06], [420, 0.08]],
    throw: [[400, 0.04], [700, 0.06]], win: [[784, 0.1], [988, 0.1], [1175, 0.1], [1568, 0.3]], bubble: [[1200, 0.03]],
  };
  const seq = tunes[name]; if (!seq) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    for (const [f, d] of seq) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + d + 0.02);
      t += d;
    }
  } catch (e) { /* audio unavailable */ }
}
